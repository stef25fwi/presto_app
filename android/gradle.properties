org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.workers.max=1
org.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
# Désactive l'instrumentation ASM de Firebase Performance (transforme tous les JARs
# y compris le moteur Flutter et provoque un OOM sur le runner GitHub Actions 7 Go).
firebasePerformanceInstrumentationEnabled=false
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
android.builtInKotlin=false
