include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build_logs/**
    - audit_microia/**
    - backups/**
    - release_apk/**
    - downloads/**
    - node_modules/**
    - functions/node_modules/**
    - functions/lib/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

  errors:
    deprecated_member_use: ignore
    unused_local_variable: ignore
    unused_field: ignore
    unused_element: ignore
    unused_import: ignore
    unused_shown_name: ignore
    unnecessary_import: ignore
    unnecessary_non_null_assertion: ignore
    use_build_context_synchronously: ignore
    strict_top_level_inference: ignore
    dead_code: ignore
    dead_code_on_catch_subtype: ignore
    unnecessary_cast: ignore
    unnecessary_to_list_in_spreads: ignore
    unintended_html_in_doc_comment: ignore
    curly_braces_in_flow_control_structures: ignore
    no_leading_underscores_for_local_identifiers: ignore
    prefer_conditional_assignment: ignore
    asset_directory_does_not_exist: ignore

linter:
  rules:
    avoid_print: false
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    prefer_final_fields: false
    prefer_final_locals: false
    prefer_final_in_for_each: false
    unnecessary_const: false
    unnecessary_this: false
    curly_braces_in_flow_control_structures: false
    no_leading_underscores_for_local_identifiers: false
    prefer_conditional_assignment: false
