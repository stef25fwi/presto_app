<!DOCTYPE html>
<html>
<head>
    <title>Test Firebase Auth - Presto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .status { 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 5px; 
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Test Firebase Authentication - Presto</h1>
    
    <div id="status" class="status info">
        Initialisation...
    </div>

    <div id="userInfo"></div>

    <div style="margin: 20px 0;">
        <button id="signInPopup">Sign In with Google (Popup)</button>
        <button id="signInRedirect">Sign In with Google (Redirect)</button>
        <button id="signOut">Sign Out</button>
    </div>

    <p>
        Renseigner la clé via l'URL avec <strong>?apiKey=...</strong> ou via le prompt affiché au chargement.
    </p>

    <h2>Configuration actuelle</h2>
    <pre id="config"></pre>

    <h2>Logs</h2>
    <pre id="logs"></pre>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, GoogleAuthProvider, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const apiKeyFromUrl = new URLSearchParams(window.location.search).get('apiKey');
        const storedApiKey = window.localStorage.getItem('FIREBASE_WEB_API_KEY');
        const runtimeApiKey = apiKeyFromUrl || storedApiKey || window.prompt('Entrer FIREBASE_WEB_API_KEY pour ce test:');

        if (!runtimeApiKey) {
            throw new Error('FIREBASE_WEB_API_KEY manquante. Ajoutez ?apiKey=... a l\'URL ou saisissez-la dans le prompt.');
        }

        window.localStorage.setItem('FIREBASE_WEB_API_KEY', runtimeApiKey);

        const firebaseConfig = {
            apiKey: runtimeApiKey,
            authDomain: 'ilipresto.fr',
            projectId: 'presto-app-74abe',
            storageBucket: 'presto-app-74abe.firebasestorage.app',
            messagingSenderId: '151421230024',
            appId: '1:151421230024:web:8b83d1d11084c5a02b3efd'
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const statusDiv = document.getElementById('status');
        const userInfoDiv = document.getElementById('userInfo');
        const logsDiv = document.getElementById('logs');
        const configDiv = document.getElementById('config');

        let logs = [];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logs.push(`[${timestamp}] ${type.toUpperCase()}: ${message}`);
            logsDiv.textContent = logs.join('\n');
            console.log(message);
        }

        function updateStatus(message, type = 'info') {
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            addLog(message, type);
        }

        function displayUserInfo(user) {
            if (user) {
                userInfoDiv.innerHTML = `
                    <div class="status success">
                        <h3>✅ Utilisateur connecté</h3>
                        <p><strong>UID:</strong> ${user.uid}</p>
                        <p><strong>Email:</strong> ${user.email}</p>
                        <p><strong>Display Name:</strong> ${user.displayName || 'N/A'}</p>
                        <p><strong>Photo:</strong> ${user.photoURL ? `<img src="${user.photoURL}" width="50" />` : 'N/A'}</p>
                    </div>
                `;
            } else {
                userInfoDiv.innerHTML = `
                    <div class="status info">
                        <p>❌ Aucun utilisateur connecté</p>
                    </div>
                `;
            }
        }

        // Display config
        configDiv.textContent = JSON.stringify({
            apiKeyPreview: `${runtimeApiKey.slice(0, 12)}...`,
            authDomain: firebaseConfig.authDomain,
            projectId: firebaseConfig.projectId,
            appId: firebaseConfig.appId,
            currentURL: window.location.href,
            currentDomain: window.location.hostname
        }, null, 2);

        // Auth state observer
        onAuthStateChanged(auth, (user) => {
            displayUserInfo(user);
            if (user) {
                updateStatus('Authentifié', 'success');
            } else {
                updateStatus('Non authentifié', 'info');
            }
        });

        // Check for redirect result on page load
        getRedirectResult(auth)
            .then((result) => {
                if (result && result.user) {
                    updateStatus(`Redirect réussi: ${result.user.email}`, 'success');
                } else {
                    addLog('Pas de redirect result');
                }
            })
            .catch((error) => {
                if (error.code !== 'auth/no-auth-event') {
                    updateStatus(`Erreur redirect: ${error.code} - ${error.message}`, 'error');
                }
            });

        // Sign in with popup
        document.getElementById('signInPopup').addEventListener('click', async () => {
            try {
                updateStatus('Tentative popup...', 'info');
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                provider.addScope('email');
                provider.addScope('profile');
                
                const result = await signInWithPopup(auth, provider);
                updateStatus(`Popup réussi: ${result.user.email}`, 'success');
            } catch (error) {
                updateStatus(`Erreur popup: ${error.code} - ${error.message}`, 'error');
            }
        });

        // Sign in with redirect
        document.getElementById('signInRedirect').addEventListener('click', async () => {
            try {
                updateStatus('Démarrage redirect...', 'info');
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                provider.addScope('email');
                provider.addScope('profile');
                
                await signInWithRedirect(auth, provider);
                // La page va rediriger, pas de code après
            } catch (error) {
                updateStatus(`Erreur redirect: ${error.code} - ${error.message}`, 'error');
            }
        });

        // Sign out
        document.getElementById('signOut').addEventListener('click', async () => {
            try {
                await signOut(auth);
                updateStatus('Déconnecté', 'success');
            } catch (error) {
                updateStatus(`Erreur déconnexion: ${error.message}`, 'error');
            }
        });

        updateStatus('Initialisé - Prêt pour les tests', 'success');
    </script>
</body>
</html>
