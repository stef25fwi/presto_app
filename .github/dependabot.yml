version: 2
updates:
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      firebase-functions:
        patterns:
          - firebase-admin
          - firebase-functions
          - firebase
          - '@firebase/*'
      email-providers:
        patterns:
          - nodemailer
          - resend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
