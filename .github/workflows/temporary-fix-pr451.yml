name: Temporary PR451 avatar fix

on:
  push:
    branches:
      - coverage/issue-449-conversation-thread-shell

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: coverage/issue-449-conversation-thread-shell
          fetch-depth: 0
      - name: Apply exact source and test fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('lib/pages/messages/conversation_thread_page.dart')
          text = source.read_text()
          old = """            onForegroundImageError: (error, stackTrace) {
              debugPrint(
                '[ConversationThread] header avatar load failed '
                'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
                'error=$error',
              );
            },
"""
          new = """            onForegroundImageError: _otherParticipantPhotoUrl.isNotEmpty
                ? (error, stackTrace) {
                    debugPrint(
                      '[ConversationThread] header avatar load failed '
                      'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
                      'error=$error',
                    );
                  }
                : null,
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one avatar callback block, found {text.count(old)}')
          source.write_text(text.replace(old, new))

          test = Path('test/pages/messages/conversation_thread_page_shell_test.dart')
          test_text = test.read_text()
          drain = """void _drainExpectedConversationThreadExceptions(WidgetTester tester) {
  Object? exception;
  while ((exception = tester.takeException()) != null) {
    final message = exception.toString();
    final isExpectedCircleAvatarAssertion =
        message.contains('circle_avatar.dart') &&
        message.contains(
          'foregroundImage != null || onForegroundImageError == null',
        );
    if (!isExpectedCircleAvatarAssertion) {
      throw exception!;
    }
  }
}

"""
          if test_text.count(drain) != 1:
              raise SystemExit(f'Expected exactly one exception drain helper, found {test_text.count(drain)}')
          test_text = test_text.replace(drain, '')
          test_text = test_text.replace('  _drainExpectedConversationThreadExceptions(tester);\n', '')
          test.write_text(test_text)

          workflow = Path('.github/workflows/temporary-fix-pr451.yml')
          workflow.unlink()
          PY
      - name: Commit targeted correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/pages/messages/conversation_thread_page.dart test/pages/messages/conversation_thread_page_shell_test.dart .github/workflows/temporary-fix-pr451.yml
          git commit -m "fix(messages): guard empty conversation avatar"
          git push origin HEAD:coverage/issue-449-conversation-thread-shell
