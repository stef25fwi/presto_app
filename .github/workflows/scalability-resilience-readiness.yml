name: Scalability resilience readiness

on:
  pull_request:
    paths:
      - 'quality/scalability_resilience_readiness.json'
      - 'tools/quality/check_scalability_resilience_readiness.mjs'
      - 'tools/quality/check_scalability_resilience_readiness.test.mjs'
      - '.github/workflows/scalability-resilience-readiness.yml'
      - 'docs/production/PHASE_15_SCALABILITY_RESILIENCE_EVIDENCE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scalability-resilience-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Validate scalability and resilience registry
        run: node tools/quality/check_scalability_resilience_readiness.mjs
      - name: Run scalability and resilience tests
        run: node --test tools/quality/check_scalability_resilience_readiness.test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: scalability-resilience-readiness-report
          path: build/quality/scalability-resilience-readiness-report.json
          retention-days: 30
