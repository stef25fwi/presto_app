name: Point 6 marketplace migration

on:
  push:
    branches:
      - agent/point-6-marketplace-readiness

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[point6-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/point-6-marketplace-readiness
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Apply point 6 patch
        run: node tools/quality/apply_point6_marketplace_readiness.mjs
      - name: Format Dart files
        run: |
          dart format \
            lib/data/marketplace/favorite_repository.dart \
            lib/data/marketplace/listing_repository.dart \
            lib/pages/user_offers_section.dart \
            test/data/marketplace/marketplace_pagination_policy_test.dart
      - name: Validate generated readiness
        run: |
          node tools/quality/check_marketplace_readiness.mjs --enforce
          node tools/quality/check_marketplace_readiness.test.mjs
          flutter pub get
          flutter test test/data/marketplace/marketplace_pagination_policy_test.dart
          flutter analyze --fatal-infos lib/data/marketplace/favorite_repository.dart lib/data/marketplace/listing_repository.dart lib/pages/user_offers_section.dart
      - name: Commit generated implementation
        run: |
          git config user.name "ilipresto-quality-agent"
          git config user.email "actions@users.noreply.github.com"
          git add \
            lib/data/marketplace/favorite_repository.dart \
            lib/data/marketplace/listing_repository.dart \
            lib/pages/user_offers_section.dart \
            test/data/marketplace/marketplace_pagination_policy_test.dart \
            quality/marketplace-readiness.json \
            docs/evidence/marketplace/listing-e2e.md \
            docs/evidence/marketplace/search-pagination.md \
            tools/quality/check_marketplace_readiness.mjs \
            tools/quality/check_marketplace_readiness.test.mjs
          git commit -m "Point 6 — Certifier la Marketplace d’annonces [point6-generated]"
          git push origin HEAD:agent/point-6-marketplace-readiness
