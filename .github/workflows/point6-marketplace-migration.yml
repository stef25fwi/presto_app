name: Point 6 marketplace formatting

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/point6-marketplace-migration.yml

permissions:
  contents: write

concurrency:
  group: point6-marketplace-formatting
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/point-6-marketplace-readiness
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Format Point 6 Dart files
        run: |
          dart format \
            lib/data/marketplace/favorite_repository.dart \
            lib/data/marketplace/listing_repository.dart \
            lib/pages/user_offers_section.dart \
            lib/pages/publish_offer_page.dart \
            lib/pages/offers/offer_details_page.dart \
            test/data/marketplace/marketplace_pagination_policy_test.dart
      - name: Commit formatting
        run: |
          git config user.name "ilipresto-quality-agent"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git add \
            lib/data/marketplace/favorite_repository.dart \
            lib/data/marketplace/listing_repository.dart \
            lib/pages/user_offers_section.dart \
            lib/pages/publish_offer_page.dart \
            lib/pages/offers/offer_details_page.dart \
            test/data/marketplace/marketplace_pagination_policy_test.dart
          git commit -m "Point 6 — Formater la Marketplace [point6-format]"
          git push origin HEAD:agent/point-6-marketplace-readiness
