name: Apply home carousel cleanup

on:
  push:
    branches:
      - fix/home-responsive-overflow-20260731

permissions:
  contents: write

concurrency:
  group: apply-home-carousel-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/home-responsive-overflow-20260731
          fetch-depth: 0

      - name: Remove inactive carousel ticker
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('lib/pages/home_page.dart')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "class _AutoScrollingOffersCarouselState\n"
                  "    extends State<_AutoScrollingOffersCarousel>\n"
                  "    with SingleTickerProviderStateMixin {",
                  "class _AutoScrollingOffersCarouselState\n"
                  "    extends State<_AutoScrollingOffersCarousel> {",
              ),
              ("  late final Ticker _ticker;\n", ""),
              ("  Duration _lastElapsed = Duration.zero;\n", ""),
              ("  static const double _pixelsPerSecond = 44.0;\n", ""),
              (
                  "    // Le défilement continu coupait visuellement la première carte.\n"
                  "    // Le carrousel reste maintenant aligné et se parcourt au geste.\n"
                  "    _ticker = createTicker(_onTick);\n",
                  "",
              ),
              ("      _lastElapsed = Duration.zero;\n", ""),
              ("    _ticker.dispose();\n", ""),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected fragment: {old!r}')
              text = text.replace(old, new, 1)

          pattern = re.compile(
              r"\n  void _onTick\(Duration elapsed\) \{.*?\n  \}\n\n"
              r"  String _interventionDelayLabel",
              re.DOTALL,
          )
          text, count = pattern.subn(
              "\n  String _interventionDelayLabel",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'_onTick removal expected 1 match, found {count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format and validate cleanup
        run: |
          flutter pub get
          dart format lib/pages/home_page.dart
          dart format --output=none --set-exit-if-changed lib/pages/home_page.dart
          flutter analyze lib/pages/home_page.dart
          lines="$(wc -l < lib/pages/home_page.dart)"
          echo "home_page.dart lines=$lines"
          test "$lines" -le 2792

      - name: Commit cleanup and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-home-carousel-cleanup.yml
          git rm tools/.home_cleanup_trigger
          git add lib/pages/home_page.dart
          git diff --cached --check
          git commit -m "refactor(home): remove inactive carousel ticker"
          git push origin HEAD:fix/home-responsive-overflow-20260731
