name: Dart format quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dart-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-dart-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Verify changed Dart files are formatted
        run: bash tools/quality/check_changed_dart_format.sh '${{ github.base_ref }}'
