name: Dart format quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dart-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-dart-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply exact Dart format and restore workflow
        run: |
          dart format test/admin/shared/admin_bulk_listing_service_test.dart
          git checkout origin/main -- .github/workflows/dart-format-quality.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/admin/shared/admin_bulk_listing_service_test.dart .github/workflows/dart-format-quality.yml
          git commit -m 'test: applique le format Dart exact'
          git push origin HEAD:${{ github.head_ref }}
