name: Dart format quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dart-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-dart-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format Auth files exactly
        run: |
          dart format \
            lib/pages/auth/auth_gate.dart \
            lib/pages/auth/auth_guard_policy.dart \
            lib/services/auth_status_policy.dart \
            test/pages/auth/auth_gate_policy_test.dart \
            test/pages/auth/auth_guard_policy_test.dart \
            test/services/auth_status_policy_test.dart \
            test/features/auth/domain/auth_validators_test.dart \
            test/features/auth/presentation/widgets/auth_widgets_test.dart \
            test/pages/auth/auth_gate_widget_test.dart

      - name: Upload formatted Auth files
        uses: actions/upload-artifact@v4
        with:
          name: auth-formatted-files
          path: |
            lib/pages/auth/auth_gate.dart
            lib/pages/auth/auth_guard_policy.dart
            lib/services/auth_status_policy.dart
            test/pages/auth/auth_gate_policy_test.dart
            test/pages/auth/auth_guard_policy_test.dart
            test/services/auth_status_policy_test.dart
            test/features/auth/domain/auth_validators_test.dart
            test/features/auth/presentation/widgets/auth_widgets_test.dart
            test/pages/auth/auth_gate_widget_test.dart
          retention-days: 2
