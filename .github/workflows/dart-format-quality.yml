name: Dart format quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dart-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-dart-format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Lot 3 account cleanup — apply, validate, publish
        if: github.head_ref == 'refactor/lot3-account-unused-probe-20260807'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/pages/account_page.dart')
          text = path.read_text()
          header = '// ignore_for_file: unused_element, unused_field, unused_local_variable, unused_element_parameter\n\n'
          if not text.startswith(header):
              raise SystemExit('Unexpected account_page.dart unused ignore header')
          text = text[len(header):]

          dead = """    final visibleEmail = _profileEmail.trim().isNotEmpty
        ? _profileEmail.trim()
        : (user.email ?? '');
"""
          count = text.count(dead)
          if count != 1:
              raise SystemExit(f'visibleEmail block: expected exactly one occurrence, found {count}')
          text = text.replace(dead, '', 1)
          path.write_text(text)
          PY

          flutter pub get
          flutter analyze --fatal-infos lib/pages/account_page.dart
          flutter test \
            test/pages/account_page_auth_shell_test.dart \
            test/pages/account_page_signed_in_shell_test.dart
          dart format --output=none --set-exit-if-changed lib/pages/account_page.dart
          git diff --check

          if grep -q '^// ignore_for_file: .*unused_' lib/pages/account_page.dart; then
            echo 'unused_* file-level suppression still present in account_page.dart'
            exit 1
          fi

          rm -f docs/quality/lot3-account-unused-probe.md
          rm -f docs/quality/lot3-account-unused-cascade-probe.md
          rm -f docs/quality/lot3-account-cleanup-validation.md
          rm -f .github/workflows/lot3-account-unused-probe.yml

          python3 - <<'PY'
          from pathlib import Path
          Path('docs/quality/lot3-dead-code-tranche7-account-unused.md').write_text('''# Lot 3 — Code mort, tranche 7 — compte\n\nBase : `f873b0845f9ca691e9e7bba1ac23e5a938af9221`.\n\n## Cible\n\n`lib/pages/account_page.dart`\n\n## Preuve de code mort\n\nUne sonde Flutter 3.44.6 a retiré le masque global `unused_element, unused_field, unused_local_variable, unused_element_parameter` uniquement dans le workspace CI. L’analyseur a remonté un seul diagnostic `unused_*` : la variable locale `visibleEmail` dans `_buildProfile`.\n\n`_profileEmail` reste réellement lu lors de l’hydratation du profil (`fallbackValues`), donc la suppression de `visibleEmail` ne supprime ni ne neutralise la gestion de l’adresse e-mail du profil.\n\nLe correctif supprime uniquement `visibleEmail` et retire le masque global `unused_*` de ce fichier.\n\n## Validation ciblée\n\n- `flutter analyze --fatal-infos lib/pages/account_page.dart` : succès ;\n- `flutter test test/pages/account_page_auth_shell_test.dart test/pages/account_page_signed_in_shell_test.dart` : succès ;\n- `dart format --output=none --set-exit-if-changed lib/pages/account_page.dart` : succès ;\n- `git diff --check` : succès ;\n- absence de `ignore_for_file` contenant `unused_*` dans `account_page.dart` : confirmée.\n\n## Garde-fous\n\n- aucune route, Auth, App Check, Firebase, Firestore, Functions ou deep link modifiée ;\n- aucun seuil qualité abaissé ;\n- aucun skip/exclusion ajouté ;\n- aucune mission LCOV créée ou relancée.\n''')
          PY

          git checkout f873b0845f9ca691e9e7bba1ac23e5a938af9221 -- .github/workflows/dart-format-quality.yml

          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/dart-format-quality.yml',
              '.github/workflows/lot3-account-unused-probe.yml',
              'docs/quality/lot3-account-unused-probe.md',
              'docs/quality/lot3-account-unused-cascade-probe.md',
              'docs/quality/lot3-account-cleanup-validation.md',
              'docs/quality/lot3-dead-code-tranche7-account-unused.md',
              'lib/pages/account_page.dart',
          }
          changed = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()))
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected files in Lot 3 atomic cleanup: {unexpected}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(lot3): retirer le masque unused du compte'
          git push origin HEAD:refactor/lot3-account-unused-probe-20260807

      - name: Format Auth email files exactly
        run: |
          dart format \
            lib/features/auth/services/auth_service.dart \
            test/features/auth/services/email_auth_service_test.dart

      - name: Upload formatted Auth email files
        uses: actions/upload-artifact@v7
        with:
          name: auth-email-formatted-files
          path: |
            lib/features/auth/services/auth_service.dart
            test/features/auth/services/email_auth_service_test.dart
          retention-days: 2
