name: Dart format quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dart-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-dart-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Record exact Git tree
        run: git rev-parse 'HEAD^{tree}' > /tmp/pr459-tree-sha.txt

      - name: Upload exact Git tree
        uses: actions/upload-artifact@v7
        with:
          name: pr459-tree-${{ github.sha }}
          path: /tmp/pr459-tree-sha.txt
          if-no-files-found: error
          retention-days: 1

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format Auth email files exactly
        run: |
          dart format \
            lib/features/auth/services/auth_service.dart \
            test/features/auth/services/email_auth_service_test.dart

      - name: Upload formatted Auth email files
        uses: actions/upload-artifact@v4
        with:
          name: auth-email-formatted-files
          path: |
            lib/features/auth/services/auth_service.dart
            test/features/auth/services/email_auth_service_test.dart
          retention-days: 2
