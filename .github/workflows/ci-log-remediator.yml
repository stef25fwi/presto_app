name: CI Log Remediator

on:
  workflow_run:
    workflows:
      - Pull request validation
      - Dart format quality
      - Production guardrails
      - Coverage Factory 5x2
      - LCOV Supervisor
    types: [completed]

concurrency:
  group: ci-remediator-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  repair:
    name: Diagnose and repair failed logs
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'automation/ci-repair-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      FAILED_RUN_NAME: ${{ github.event.workflow_run.name }}
      FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      FAILED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      CI_REPAIR_MODEL: ${{ vars.CI_REPAIR_MODEL || 'gpt-5.1' }}

    steps:
      - name: Stop when the API key is not configured
        if: env.OPENAI_API_KEY == ''
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[CI remediation] OPENAI_API_KEY is not configured" \
            --body "The CI Log Remediator detected a failure in run $FAILED_RUN_ID ($FAILED_RUN_NAME), but cannot diagnose it until the repository secret OPENAI_API_KEY is configured."
          exit 1

      - name: Checkout failed revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download failed logs
        run: |
          mkdir -p quality_reports/ci-remediator
          gh run view "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
            > quality_reports/ci-remediator/failed.log 2>&1 || \
          gh run view "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --log \
            > quality_reports/ci-remediator/failed.log 2>&1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install repair runtime
        run: python -m pip install --disable-pip-version-check 'openai>=1.68,<3'

      - name: Ask the guarded repair agent for a patch
        id: repair
        continue-on-error: true
        run: |
          python tools/ci/ci_log_remediator.py \
            --logs quality_reports/ci-remediator/failed.log \
            --output quality_reports/ci-remediator/result.json
          echo "patched=true" >> "$GITHUB_OUTPUT"

      - name: Read repair result
        id: result
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path('quality_reports/ci-remediator/result.json')
          data = json.loads(path.read_text()) if path.exists() else {'status': 'error', 'reason': 'No result produced.'}
          for key in ('status', 'confidence'):
              print(f"{key}={data.get(key, '')}")
          diagnosis = str(data.get('diagnosis') or data.get('reason') or '').replace('\n', ' ')[:1500]
          print(f"diagnosis={diagnosis}")
          PY

      - name: Set up Flutter
        if: steps.result.outputs.status == 'patched'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Validate the generated repair
        if: steps.result.outputs.status == 'patched'
        run: |
          set -euo pipefail
          flutter pub get
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          test "${#changed[@]}" -le 3
          printf '%s\n' "${changed[@]}" | grep -Ev '^(\.github/|pubspec\.lock$|android/|ios/)' >/dev/null || true
          dart format --set-exit-if-changed "${changed[@]}"
          flutter analyze --fatal-infos "${changed[@]}"
          mapfile -t tests < <(printf '%s\n' "${changed[@]}" | grep -E '^(test|integration_test)/.*_test\.dart$' || true)
          if [ "${#tests[@]}" -gt 0 ]; then
            flutter test "${tests[@]}"
          else
            flutter test
          fi

      - name: Open an automatic repair PR
        if: steps.result.outputs.status == 'patched' && success()
        run: |
          set -euo pipefail
          branch="automation/ci-repair-${FAILED_RUN_ID}"
          git config user.name "ilipresto-ci-remediator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add --all
          git commit -m "fix(ci): repair failure from run ${FAILED_RUN_ID}"
          git push origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base "$FAILED_HEAD_BRANCH" --head "$branch" \
            --title "fix(ci): automatic repair for ${FAILED_RUN_NAME} run ${FAILED_RUN_ID}" \
            --body "## Automatic CI remediation

- Failed workflow: **${FAILED_RUN_NAME}**
- Failed run: **${FAILED_RUN_ID}**
- Source revision: \`${FAILED_HEAD_SHA}\`
- Agent confidence: **${{ steps.result.outputs.confidence }}**
- Diagnosis: ${{ steps.result.outputs.diagnosis }}

The patch was restricted to files referenced by the logs, then formatted, analyzed and tested. No workflow, secret, permission, dependency version, exclusion or coverage threshold was changed."

      - name: Escalate when an automatic repair is unsafe
        if: always() && steps.result.outputs.status != 'patched'
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "run ${FAILED_RUN_ID} in:title" --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "[CI remediation] Manual diagnosis required for run ${FAILED_RUN_ID}" \
              --body "The CI Log Remediator analyzed **${FAILED_RUN_NAME}** but did not apply a patch because the confidence or safety constraints were insufficient.

Diagnosis: ${{ steps.result.outputs.diagnosis }}

Run: ${FAILED_RUN_ID} — source \`${FAILED_HEAD_SHA}\`."
          fi

      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-remediator-${{ github.event.workflow_run.id }}
          path: quality_reports/ci-remediator/
          if-no-files-found: ignore
          retention-days: 14
