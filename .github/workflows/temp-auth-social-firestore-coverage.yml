name: Temporary auth social Firestore coverage fix

on:
  push:
    branches:
      - coverage/w1-auth-social-final-20260724
    paths:
      - .github/workflows/temp-auth-social-firestore-coverage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-auth-social-firestore-coverage
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: coverage/w1-auth-social-final-20260724
          fetch-depth: 0

      - name: Apply deterministic Firestore test injection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('lib/services/account_social_auth_actions.dart')
          text = source.read_text()
          old = "  static Future<void> Function()? _debugRememberAccountRouteOverride;\n"
          new = old + "  static FirebaseFirestore? _debugFirestoreOverride;\n"
          if new not in text:
              if old not in text:
                  raise SystemExit('static override anchor missing')
              text = text.replace(old, new, 1)

          old = "    _debugRememberAccountRouteOverride = null;\n"
          new = old + "    _debugFirestoreOverride = null;\n"
          if new not in text:
              if old not in text:
                  raise SystemExit('reset anchor missing')
              text = text.replace(old, new, 1)

          anchor = "  @visibleForTesting\n  static bool shouldFallbackToRedirectForTesting(Object error) =>\n"
          injection = "  @visibleForTesting\n  static void setFirestoreForTesting(FirebaseFirestore? firestore) {\n    _debugFirestoreOverride = firestore;\n  }\n\n"
          if injection not in text:
              if anchor not in text:
                  raise SystemExit('testing method anchor missing')
              text = text.replace(anchor, injection + anchor, 1)

          old = "            await FirebaseFirestore.instance\n                .collection('users')\n"
          new = "            await (_debugFirestoreOverride ?? FirebaseFirestore.instance)\n                .collection('users')\n"
          if new not in text:
              if old not in text:
                  raise SystemExit('Firestore write anchor missing')
              text = text.replace(old, new, 1)
          source.write_text(text)

          test = Path('test/services/account_social_auth_actions_apple_profile_coverage_test.dart')
          text = test.read_text()
          anchor = "import 'package:firebase_auth/firebase_auth.dart';\n"
          addition = anchor + "import 'package:fake_cloud_firestore/fake_cloud_firestore.dart';\n"
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('test import anchor missing')
              text = text.replace(anchor, addition, 1)

          old = "  late FirebaseAuth auth;\n  late TestDefaultBinaryMessenger messenger;\n"
          new = "  late FirebaseAuth auth;\n  late FakeFirebaseFirestore firestore;\n  late TestDefaultBinaryMessenger messenger;\n"
          if new not in text:
              if old not in text:
                  raise SystemExit('test declaration anchor missing')
              text = text.replace(old, new, 1)

          old = "  setUp(() {\n    platform\n"
          new = "  setUp(() {\n    firestore = FakeFirebaseFirestore();\n    AccountSocialAuthActions.setFirestoreForTesting(firestore);\n    platform\n"
          if new not in text:
              if old not in text:
                  raise SystemExit('test setup anchor missing')
              text = text.replace(old, new, 1)

          old = "  tearDown(() {\n    messenger.setMockMethodCallHandler(SignInWithApple.channel, null);\n  });\n"
          new = "  tearDown(() {\n    AccountSocialAuthActions.setFirestoreForTesting(null);\n    messenger.setMockMethodCallHandler(SignInWithApple.channel, null);\n  });\n"
          if new not in text:
              if old not in text:
                  raise SystemExit('test teardown anchor missing')
              text = text.replace(old, new, 1)

          old = "      expect(platform.user.updatedDisplayName, 'Martin');\n      expect(trackedMethod, 'apple');\n"
          new = "      expect(platform.user.updatedDisplayName, 'Martin');\n      final profile =\n          await firestore.collection('users').doc('apple-profile-user').get();\n      expect(profile.data()?['pseudo'], 'Martin');\n      expect(trackedMethod, 'apple');\n"
          if new not in text:
              if old not in text:
                  raise SystemExit('test assertion anchor missing')
              text = text.replace(old, new, 1)
          test.write_text(text)
          PY

          rm -f .github/workflows/temp-auth-social-firestore-coverage.yml
          dart format lib/services/account_social_auth_actions.dart \
            test/services/account_social_auth_actions_apple_profile_coverage_test.dart
          flutter pub get
          flutter test test/services/account_social_auth_actions_apple_profile_coverage_test.dart
          flutter analyze --fatal-infos lib/services/account_social_auth_actions.dart \
            test/services/account_social_auth_actions_apple_profile_coverage_test.dart
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(coverage): close Apple Firestore persistence line'
          git push origin HEAD:coverage/w1-auth-social-final-20260724
