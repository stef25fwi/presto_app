name: Temporary compact repair PR694

on:
  push:
    branches: [main]
    paths:
      - tools/repair_pr694_compact.py
      - .github/workflows/temporary-repair-pr694-compact.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-repair-pr694-compact
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: coverage/w1-messaging-next-20260723
          fetch-depth: 0

      - name: Apply atomic repair and restore budgets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/coverage/w1-messaging-next-20260723:refs/remotes/origin/coverage/w1-messaging-next-20260723
          git switch -C coverage/w1-messaging-next-20260723 \
            refs/remotes/origin/coverage/w1-messaging-next-20260723

          git show origin/main:tools/repair_pr694_compact.py > /tmp/repair_pr694_compact.py
          python3 /tmp/repair_pr694_compact.py
          git show origin/main:quality/flutter_architecture_size_budget.json \
            > quality/flutter_architecture_size_budget.json

          git diff --check
          if git diff --quiet; then
            echo 'Repair already applied.'
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(messages): defer admin log UI mutation safely'
          git push origin HEAD:coverage/w1-messaging-next-20260723
