name: Mobile release builds

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: Release channel
        required: true
        default: internal
        type: choice
        options: [internal, beta, production]
      publish_android:
        description: Publish Android to Google Play
        required: true
        default: false
        type: boolean
      publish_ios:
        description: Publish iOS to TestFlight
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: mobile-release
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Configure Android signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF
      - name: Build Android App Bundle
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v7
        with:
          name: android-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Publish to Google Play
        if: github.event_name == 'workflow_dispatch' && inputs.publish_android == true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fr.ilipresto.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.release_channel == 'production' && 'production' || inputs.release_channel == 'beta' && 'beta' || 'internal' }}
          status: completed

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: mobile-release
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Install signing certificate and profile
        if: env.IOS_CERTIFICATE_BASE64 != ''
        run: |
          certificate_path="$RUNNER_TEMP/build_certificate.p12"
          profile_path="$RUNNER_TEMP/build_pp.mobileprovision"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Build signed IPA
        if: env.IOS_CERTIFICATE_BASE64 != ''
        run: flutter build ipa --release
      - name: Build unsigned iOS archive
        if: env.IOS_CERTIFICATE_BASE64 == ''
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v7
        with:
          name: ios-build-${{ github.sha }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 30
      - name: Publish to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.publish_ios == true && env.IOS_CERTIFICATE_BASE64 != ''
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$(find build/ios/ipa -name '*.ipa' | head -1)" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
