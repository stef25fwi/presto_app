name: Apply and validate production hardening

on:
  push:
    branches:
      - audit/prod-hardening-p0-p11
    paths-ignore:
      - docs/APPLY_PATCH_STATUS.md
      - docs/AUDIT_VALIDATION_STATUS.md
      - audit_validation_logs/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-prod-hardening
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/prod-hardening-p0-p11
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Prepare logs
        run: mkdir -p audit_validation_logs

      - name: Apply idempotent patches
        id: patches
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee audit_validation_logs/patches.log) 2>&1
          node tools/apply_prod_hardening_patches.mjs
          node tools/apply_startup_hardening.mjs
          node tools/apply_auth_client_hardening.mjs
          node tools/apply_account_cleanup_patch.mjs
          node tools/normalize_cursor_patch_script.mjs
          node tools/fix_cursor_query_signature_patch.mjs
          node tools/apply_cursor_pagination.mjs
          node tools/apply_validation_fixes.mjs
          node tools/apply_identity_authority_hardening.mjs
          node tools/apply_dependency_security_upgrades.mjs
          node tools/apply_stripe_ordering_hardening.mjs
          node tools/apply_function_resource_limits.mjs
          node tools/apply_validation_round2_fixes.mjs
          npm --prefix functions install --package-lock-only --ignore-scripts
          node tools/check_production_guardrails.mjs

      - name: Commit generated changes
        if: steps.patches.outcome == 'success'
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy.yml \
            .github/workflows/pr-validation.yml \
            .github/workflows/audit-branch-validation.yml \
            firestore.rules \
            functions/package.json \
            functions/package-lock.json \
            functions/scripts/test_canonical_marketplace_rules.mjs \
            functions/scripts/test_user_authority_rules.mjs \
            functions/src/index.ts \
            functions/src/modules/auth/account_deletion.ts \
            functions/src/modules/billing/stripe_webhook.ts \
            functions/src/modules/marketplace/callables/media.ts \
            functions/src/modules/messaging/callables.ts \
            lib/main.dart \
            lib/features/subscriptions/subscription_widgets.dart \
            lib/services/auth_service.dart \
            lib/services/app_monitoring_service.dart \
            lib/services/public_offers_query_helpers.dart \
            lib/pages/consult_offers_page.dart \
            lib/pages/admin_space_page.dart \
            lib/pages/toolbox_je_me_lance_page.dart \
            test/auth_email_static_test.dart \
            test/toolbox_je_me_lance_etudiant_journey_test.dart \
            tools/apply_auth_client_hardening.mjs \
            tools/apply_cursor_pagination.mjs \
            tools/check_web_bundle_size.mjs
          git commit -m "fix: corrige les derniers blocages préproduction"
          git push origin HEAD:audit/prod-hardening-p0-p11

      - name: Publish patch failure report
        if: steps.patches.outcome != 'success'
        run: |
          {
            echo '# Échec du générateur de durcissement'
            echo
            echo "Commit source : \`${GITHUB_SHA}\`"
            echo
            echo '```text'
            tail -n 180 audit_validation_logs/patches.log
            echo '```'
          } > docs/APPLY_PATCH_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/APPLY_PATCH_STATUS.md
          git commit -m "test: publie l’échec du générateur de durcissement"
          git push origin HEAD:audit/prod-hardening-p0-p11

      - name: Flutter dependencies
        id: flutter_deps
        if: steps.patches.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter config --enable-web 2>&1 | tee audit_validation_logs/flutter_deps.log
          flutter pub get 2>&1 | tee -a audit_validation_logs/flutter_deps.log

      - name: Flutter analyze
        id: flutter_analyze
        if: steps.patches.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee audit_validation_logs/flutter_analyze.log

      - name: Flutter tests
        id: flutter_test
        if: steps.patches.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee audit_validation_logs/flutter_test.log

      - name: Functions dependencies
        id: functions_deps
        if: steps.patches.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions ci 2>&1 | tee audit_validation_logs/functions_deps.log

      - name: Functions build
        id: functions_build
        if: steps.patches.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions run build 2>&1 | tee audit_validation_logs/functions_build.log

      - name: Functions tests
        id: functions_test
        if: steps.patches.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions test 2>&1 | tee audit_validation_logs/functions_test.log

      - name: Install Firebase CLI
        id: firebase_cli
        if: steps.patches.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm install -g firebase-tools@13 2>&1 | tee audit_validation_logs/firebase_cli.log

      - name: Firestore rules tests
        id: firestore_rules
        if: steps.patches.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions run test:firestore 2>&1 | tee audit_validation_logs/firestore_rules.log

      - name: Web release build
        id: web_build
        if: steps.patches.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          APPCHECK_RECAPTCHA_SITE_KEY=audit-placeholder-site-key \
            bash tools/flutter_with_build_stamp.sh build web --release --no-wasm-dry-run \
            2>&1 | tee audit_validation_logs/web_build.log

      - name: Web bundle budget
        id: bundle_budget
        if: steps.patches.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/check_web_bundle_size.mjs 2>&1 | tee audit_validation_logs/bundle_budget.log

      - name: Generate validation report
        if: always() && steps.patches.outcome == 'success'
        run: |
          cat > docs/AUDIT_VALIDATION_STATUS.md <<'REPORT'
          # Validation automatique — branche audit/prod-hardening-p0-p11

          Généré par GitHub Actions sur le commit `${{ github.sha }}`.

          | Contrôle | Résultat |
          |---|---|
          | Patchs idempotents et garde-fous | `${{ steps.patches.outcome }}` |
          | Dépendances Flutter | `${{ steps.flutter_deps.outcome }}` |
          | Flutter analyze | `${{ steps.flutter_analyze.outcome }}` |
          | Tests Flutter | `${{ steps.flutter_test.outcome }}` |
          | Dépendances Functions | `${{ steps.functions_deps.outcome }}` |
          | Build Functions | `${{ steps.functions_build.outcome }}` |
          | Tests Functions | `${{ steps.functions_test.outcome }}` |
          | Firebase CLI | `${{ steps.firebase_cli.outcome }}` |
          | Tests Firestore Rules | `${{ steps.firestore_rules.outcome }}` |
          | Build Web release | `${{ steps.web_build.outcome }}` |
          | Budget bundle Web | `${{ steps.bundle_budget.outcome }}` |

          Les 100 dernières lignes de chaque contrôle sont conservées ci-dessous.
          REPORT

          for file in audit_validation_logs/*.log; do
            printf '\n## %s\n\n```text\n' "$(basename "$file")" >> docs/AUDIT_VALIDATION_STATUS.md
            tail -n 100 "$file" >> docs/AUDIT_VALIDATION_STATUS.md
            printf '\n```\n' >> docs/AUDIT_VALIDATION_STATUS.md
          done

      - name: Commit validation report
        if: always() && steps.patches.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AUDIT_VALIDATION_STATUS.md audit_validation_logs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: publie le rapport de validation préproduction"
          git push origin HEAD:audit/prod-hardening-p0-p11

      - name: Enforce successful validation
        if: always()
        run: |
          if [ "${{ steps.patches.outcome }}" != "success" ]; then
            echo "Patch generation failed."
            exit 1
          fi
          outcomes='${{ steps.flutter_deps.outcome }} ${{ steps.flutter_analyze.outcome }} ${{ steps.flutter_test.outcome }} ${{ steps.functions_deps.outcome }} ${{ steps.functions_build.outcome }} ${{ steps.functions_test.outcome }} ${{ steps.firebase_cli.outcome }} ${{ steps.firestore_rules.outcome }} ${{ steps.web_build.outcome }} ${{ steps.bundle_budget.outcome }}'
          if echo "$outcomes" | grep -Eq 'failure|cancelled|skipped'; then
            echo "Validation failed: $outcomes"
            exit 1
          fi
          echo "Validation succeeded: $outcomes"
