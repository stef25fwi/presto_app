name: Apply production hardening patches

on:
  push:
    branches:
      - coverage/issue-449-conversation-thread-shell

permissions:
  contents: write

concurrency:
  group: apply-pr451-avatar-fix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: coverage/issue-449-conversation-thread-shell
          fetch-depth: 0

      - name: Apply exact PR451 repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('lib/pages/messages/conversation_thread_page.dart')
          text = source.read_text()

          header_old = """            onForegroundImageError: (error, stackTrace) {
              debugPrint(
                '[ConversationThread] header avatar load failed '
                'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
                'error=$error',
              );
            },
"""
          header_new = """            onForegroundImageError: _otherParticipantPhotoUrl.isNotEmpty
                ? (error, stackTrace) {
                    debugPrint(
                      '[ConversationThread] header avatar load failed '
                      'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
                      'error=$error',
                    );
                  }
                : null,
"""
          header_count = text.count(header_old)
          if header_count != 1:
              raise SystemExit(
                  f'Expected one header avatar callback, found {header_count}'
              )
          text = text.replace(header_old, header_new)

          bubble_old = """      onForegroundImageError: (error, stackTrace) {
        debugPrint(
          '[ConversationThread] bubble avatar load failed '
          'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
          'error=$error',
        );
      },
"""
          bubble_new = """      onForegroundImageError: _otherParticipantPhotoUrl.isNotEmpty
          ? (error, stackTrace) {
              debugPrint(
                '[ConversationThread] bubble avatar load failed '
                'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
                'error=$error',
              );
            }
          : null,
"""
          bubble_count = text.count(bubble_old)
          if bubble_count != 1:
              raise SystemExit(
                  f'Expected one bubble avatar callback, found {bubble_count}'
              )
          source.write_text(text.replace(bubble_old, bubble_new))

          test = Path('test/pages/messages/conversation_thread_page_shell_test.dart')
          test_text = test.read_text()
          drain = """void _drainExpectedConversationThreadExceptions(WidgetTester tester) {
  Object? exception;
  while ((exception = tester.takeException()) != null) {
    final message = exception.toString();
    final isExpectedCircleAvatarAssertion =
        message.contains('circle_avatar.dart') &&
        message.contains(
          'foregroundImage != null || onForegroundImageError == null',
        );
    if (!isExpectedCircleAvatarAssertion) {
      throw exception!;
    }
  }
}

"""
          drain_count = test_text.count(drain)
          if drain_count != 1:
              raise SystemExit(
                  f'Expected one exception drain helper, found {drain_count}'
              )
          test_text = test_text.replace(drain, '')
          test_text = test_text.replace(
              '  _drainExpectedConversationThreadExceptions(tester);\n',
              '',
          )
          test.write_text(test_text)
          PY

          git checkout origin/main -- \
            .github/workflows/apply-prod-hardening.yml \
            .github/workflows/pr-validation.yml \
            .github/workflows/dart-format-quality.yml
          rm -f .github/workflows/temporary-fix-pr451.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(messages): guard empty conversation avatars"
          git push origin HEAD:coverage/issue-449-conversation-thread-shell
