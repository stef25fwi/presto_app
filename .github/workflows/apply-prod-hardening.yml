name: Apply production hardening patches

on:
  push:
    branches:
      - audit/prod-hardening-p0-p11
    paths-ignore:
      - docs/APPLY_PATCH_STATUS.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-prod-hardening
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/prod-hardening-p0-p11
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply idempotent patches
        id: patches
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee apply_patch.log) 2>&1
          node tools/apply_prod_hardening_patches.mjs
          node tools/apply_startup_hardening.mjs
          node tools/apply_auth_client_hardening.mjs
          node tools/apply_account_cleanup_patch.mjs
          node tools/normalize_cursor_patch_script.mjs
          node tools/apply_cursor_pagination.mjs
          node tools/apply_validation_fixes.mjs
          node tools/apply_identity_authority_hardening.mjs
          node tools/apply_dependency_security_upgrades.mjs
          node tools/apply_stripe_ordering_hardening.mjs
          npm --prefix functions install --package-lock-only --ignore-scripts

      - name: Commit generated changes
        if: steps.patches.outcome == 'success'
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy.yml \
            .github/workflows/pr-validation.yml \
            .github/workflows/audit-branch-validation.yml \
            firestore.rules \
            functions/package.json \
            functions/package-lock.json \
            functions/scripts/test_canonical_marketplace_rules.mjs \
            functions/scripts/test_user_authority_rules.mjs \
            functions/src/index.ts \
            functions/src/modules/auth/account_deletion.ts \
            functions/src/modules/billing/stripe_webhook.ts \
            lib/main.dart \
            lib/services/auth_service.dart \
            lib/services/app_monitoring_service.dart \
            lib/services/public_offers_query_helpers.dart \
            lib/pages/consult_offers_page.dart \
            lib/pages/admin_space_page.dart \
            test/toolbox_je_me_lance_etudiant_journey_test.dart \
            tools/apply_auth_client_hardening.mjs \
            tools/apply_cursor_pagination.mjs
          git commit -m "security: applique le durcissement préproduction"
          git push origin HEAD:audit/prod-hardening-p0-p11

      - name: Publish patch failure report
        if: steps.patches.outcome != 'success'
        run: |
          {
            echo '# Échec du générateur de durcissement'
            echo
            echo "Commit source : \`${GITHUB_SHA}\`"
            echo
            echo '```text'
            tail -n 160 apply_patch.log
            echo '```'
          } > docs/APPLY_PATCH_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/APPLY_PATCH_STATUS.md
          git commit -m "test: publie l’échec du générateur de durcissement"
          git push origin HEAD:audit/prod-hardening-p0-p11

      - name: Enforce successful patching
        if: steps.patches.outcome != 'success'
        run: exit 1
