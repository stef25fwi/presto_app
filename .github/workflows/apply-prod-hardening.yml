name: Apply production hardening patches

on:
  push:
    branches:
      - audit/prod-hardening-p0-p11
    paths:
      - tools/apply_release_validation_fixes.mjs
      - tools/apply_validation_round2_fixes.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-prod-hardening
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/prod-hardening-p0-p11
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Apply idempotent patches
        run: |
          set -euo pipefail
          node tools/apply_prod_hardening_patches.mjs
          node tools/apply_startup_hardening.mjs
          node tools/apply_auth_client_hardening.mjs
          node tools/apply_account_cleanup_patch.mjs
          node tools/normalize_cursor_patch_script.mjs
          node tools/fix_cursor_query_signature_patch.mjs
          node tools/apply_cursor_pagination.mjs
          node tools/apply_validation_fixes.mjs
          node tools/apply_identity_authority_hardening.mjs
          node tools/apply_dependency_security_upgrades.mjs
          node tools/apply_stripe_ordering_hardening.mjs
          node tools/apply_function_resource_limits.mjs
          node tools/apply_release_validation_fixes.mjs
          node tools/apply_validation_round2_fixes.mjs
          npm --prefix functions install --package-lock-only --ignore-scripts
          node tools/check_production_guardrails.mjs

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: régénère les correctifs de durcissement"
          git push origin HEAD:audit/prod-hardening-p0-p11
