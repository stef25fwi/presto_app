name: Security controls inventory

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enforce:
        description: 'Fail if any required security control is incomplete'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  security-controls:
    name: Security inventory (not go-live approval)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test security controls checker
        run: node --test tools/quality/check_security_controls.test.mjs

      - name: Inventory security readiness
        if: github.event_name != 'workflow_dispatch' || !inputs.enforce
        run: node tools/quality/check_security_controls.mjs

      - name: Enforce required security controls
        if: github.event_name == 'workflow_dispatch' && inputs.enforce
        run: node tools/quality/check_security_controls.mjs --enforce

      - name: Upload security readiness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-controls-${{ github.sha }}
          path: |
            quality_reports/security/security-controls.json
            quality_reports/security/security-controls.md
          if-no-files-found: error
          retention-days: 30
