name: Security controls readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test security controls checker and its automated controls
        run: |
          node --test \
            tools/quality/check_security_controls.test.mjs \
            tools/quality/check_secrets_inventory.test.mjs \
            tools/quality/check_functions_app_check.test.mjs \
            tools/quality/generate_dependency_audit.test.mjs

      # Les contrôles `automated` de la matrice sont réellement exécutés ici :
      # leur statut est dérivé du code de sortie, jamais déclaré à la main.
      # Aucun n'exige de node_modules installés.
      - name: Inventory security readiness
        run: node tools/quality/check_security_controls.mjs

      - name: Upload security readiness report
        uses: actions/upload-artifact@v4
        with:
          name: security-controls-${{ github.sha }}
          path: quality_reports/security/security-controls.json
          if-no-files-found: error
          retention-days: 30
