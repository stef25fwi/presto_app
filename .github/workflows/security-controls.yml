name: Security controls readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test security controls checker
        run: node --test tools/quality/check_security_controls.test.mjs

      - name: Inventory security readiness
        run: node tools/quality/check_security_controls.mjs

      - name: Upload security readiness report
        uses: actions/upload-artifact@v4
        with:
          name: security-controls-${{ github.sha }}
          path: quality_reports/security/security-controls.json
          if-no-files-found: error
          retention-days: 30
