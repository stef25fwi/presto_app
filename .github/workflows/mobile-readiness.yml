name: Mobile readiness

on:
  pull_request:
    paths:
      - 'quality/mobile_readiness.json'
      - 'tools/quality/check_mobile_readiness.mjs'
      - 'tools/quality/check_mobile_readiness.test.mjs'
      - '.github/workflows/mobile-readiness.yml'
      - 'docs/production/PHASE_12_MOBILE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test mobile readiness checker
        run: node tools/quality/check_mobile_readiness.test.mjs
      - name: Generate mobile readiness report
        run: node tools/quality/check_mobile_readiness.mjs
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: mobile-readiness-report
          path: mobile-readiness-report.json
          retention-days: 30
