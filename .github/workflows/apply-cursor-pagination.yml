name: Apply cursor pagination

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-cursor-pagination
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/prod-hardening-p0-p11
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply cursor pagination
        run: |
          node tools/normalize_cursor_patch_script.mjs
          node tools/apply_cursor_pagination.mjs

      - name: Commit cursor implementation
        run: |
          if git diff --quiet; then
            echo "Cursor pagination already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/consult_offers_page.dart \
            lib/services/public_offers_query_helpers.dart \
            tools/apply_cursor_pagination.mjs
          git commit -m "perf: applique la pagination Firestore par curseur"
          git push origin HEAD:audit/prod-hardening-p0-p11
