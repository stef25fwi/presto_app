name: Lot 3 consult offers dead locals

on:
  push:
    branches:
      - refactor/lot3-consult-offers-unused-20260808

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/lot3-consult-offers-unused-20260808
          fetch-depth: 0

      - name: Remove the four analyzer-confirmed dead locals and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/pages/consult_offers_page.dart')
          text = path.read_text()

          snippets = [
              "    final annonceurId = (data['userId'] ?? data['uid'] ?? '').toString().trim();\n\n",
              "                final description = (data['description'] ?? '').toString();\n                final phone = data['phone']?.toString();\n\n",
              "                final List<String> imageUrls =\n                    (data['imageUrls'] as List<dynamic>? ?? [])\n                        .map((e) => e.toString())\n                        .toList();\n\n",
          ]
          for snippet in snippets:
              count = text.count(snippet)
              if count != 1:
                  raise SystemExit(f'Expected exactly one analyzer-confirmed snippet, found {count}: {snippet!r}')
              text = text.replace(snippet, '', 1)

          path.write_text(text)
          PY

          rm .github/workflows/lot3-consult-offers-dead-locals.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/consult_offers_page.dart .github/workflows/lot3-consult-offers-dead-locals.yml
          git commit -m 'refactor(lot3): remove consult offers dead locals'
          git push origin HEAD:refactor/lot3-consult-offers-unused-20260808
