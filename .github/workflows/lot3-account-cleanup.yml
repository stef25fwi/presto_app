name: Lot 3 account dead-code patch

on:
  push:
    branches:
      - refactor/lot3-account-unused-admin-helpers-20260807

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove proven-dead account admin helpers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/pages/account_page.dart')
          text = path.read_text(encoding='utf-8')
          block = """  bool _isAdminAccessDenied(Object? error) {\n    if (error is FirebaseFunctionsException) {\n      return error.code == 'permission-denied' ||\n          error.code == 'unauthenticated';\n    }\n\n    final errStr = error?.toString() ?? '';\n    return errStr.contains('permission-denied') ||\n        errStr.contains('unauthenticated');\n  }\n\n  bool _isAdminAccessUnauthenticated(Object? error) {\n    if (error is FirebaseFunctionsException) {\n      return error.code == 'unauthenticated';\n    }\n\n    final errStr = error?.toString() ?? '';\n    return errStr.contains('unauthenticated');\n  }\n\n"""
          count = text.count(block)
          if count != 1:
              raise SystemExit(f'expected one dead-helper block, found {count}')
          path.write_text(text.replace(block, '', 1), encoding='utf-8')
          Path('.github/workflows/lot3-account-cleanup.yml').unlink()
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/account_page.dart .github/workflows/lot3-account-cleanup.yml
          git diff --cached --check
          git commit -m "refactor(lot3): supprimer helpers admin morts du compte"
          git push origin HEAD:refactor/lot3-account-unused-admin-helpers-20260807
