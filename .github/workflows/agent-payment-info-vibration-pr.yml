name: Agent - Apply payment info vibration on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.head_ref == 'agent/payment-info-vibration' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/payment-info-vibration
          fetch-depth: 0

      - name: Execute focused patch embedded in companion workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/agent-payment-info-vibration.yml').read_text(
              encoding='utf-8',
          )
          begin = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if begin not in workflow:
              raise SystemExit('Embedded patch start marker not found')
          script = workflow.split(begin, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(script), '<payment-info-patch>', 'exec'))
          PY

      - name: Validate focused patch
        shell: bash
        run: |
          git diff --check
          grep -q "Informations sur le paiement" lib/pages/offers/offer_details_page.dart
          grep -q "duration: const Duration(milliseconds: 2200)" lib/pages/offers/offer_details_page.dart

      - name: Commit focused change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/offers/offer_details_page.dart
          git commit -m "feat: animate payment info chip"
          git push origin HEAD:agent/payment-info-vibration
