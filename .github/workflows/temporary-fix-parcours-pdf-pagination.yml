name: Temporary fix parcours PDF pagination

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-fix-parcours-pdf-pagination.yml'

permissions:
  contents: write

jobs:
  patch-pagination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch PDF pagination
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/quality
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee build/quality/parcours-pdf-pagination-patch.log
          from pathlib import Path
          import re

          path = Path('lib/services/journey_pdf_export_service.dart')
          text = path.read_text(encoding='utf-8')

          call_pattern = re.compile(
              r'(?m)^(\s*)widgets\.add\(\s*\n\s*_stepCard\('
          )
          text, call_count = call_pattern.subn(
              lambda match: (
                  f'{match.group(1)}widgets.addAll(\n'
                  f'{match.group(1)}  _stepCards('
              ),
              text,
              count=1,
          )
          if call_count != 1:
              raise SystemExit(f'Remplacement appel _stepCard: {call_count}')

          method_pattern = re.compile(
              r'(?ms)^  static pw\.Widget _stepCard\(\{.*?'
              r'^  \}\n\n(?=  static List<String> _stepActions\()'
          )
          new_method = '''  static List<pw.Widget> _stepCards({
            required int number,
            required String title,
            required String objective,
            required List<String> actions,
            required String expectedResult,
          }) {
            const maxActionsPerCard = 12;
            final chunks = <List<String>>[];

            if (actions.isEmpty) {
              chunks.add(const <String>[]);
            } else {
              for (var start = 0;
                  start < actions.length;
                  start += maxActionsPerCard) {
                final proposedEnd = start + maxActionsPerCard;
                final end = proposedEnd < actions.length
                    ? proposedEnd
                    : actions.length;
                chunks.add(actions.sublist(start, end));
              }
            }

            return [
              for (var index = 0; index < chunks.length; index++)
                _stepCardChunk(
                  heading: index == 0
                      ? 'Étape $number - $title'
                      : 'Étape $number - $title (suite ${index + 1})',
                  objective: index == 0 ? objective : '',
                  actions: chunks[index],
                  expectedResult:
                      index == chunks.length - 1 ? expectedResult : '',
                ),
            ];
          }

          static pw.Widget _stepCardChunk({
            required String heading,
            required String objective,
            required List<String> actions,
            required String expectedResult,
          }) {
            return pw.Container(
              width: double.infinity,
              margin: const pw.EdgeInsets.only(bottom: 12),
              decoration: pw.BoxDecoration(
                border: pw.Border.all(color: PdfColors.grey300),
                borderRadius: pw.BorderRadius.circular(10),
              ),
              child: pw.Column(
                crossAxisAlignment: pw.CrossAxisAlignment.start,
                children: [
                  pw.Container(
                    width: double.infinity,
                    padding: const pw.EdgeInsets.symmetric(
                      horizontal: 11,
                      vertical: 8,
                    ),
                    decoration: const pw.BoxDecoration(
                      color: PdfColors.blue50,
                      borderRadius: pw.BorderRadius.only(
                        topLeft: pw.Radius.circular(10),
                        topRight: pw.Radius.circular(10),
                      ),
                    ),
                    child: pw.Text(
                      heading,
                      style: pw.TextStyle(
                        fontSize: 12,
                        fontWeight: pw.FontWeight.bold,
                        color: PdfColors.blue900,
                      ),
                    ),
                  ),
                  pw.Padding(
                    padding: const pw.EdgeInsets.all(11),
                    child: pw.Column(
                      crossAxisAlignment: pw.CrossAxisAlignment.start,
                      children: [
                        if (objective.isNotEmpty) ...[
                          _miniHeading('Objectif'),
                          _paragraph(objective),
                        ],
                        if (actions.isNotEmpty) ...[
                          _miniHeading('Actions à réaliser'),
                          ...actions.map(_checkLine),
                        ],
                        if (expectedResult.isNotEmpty) ...[
                          _miniHeading('Résultat attendu avant de continuer'),
                          pw.Container(
                            width: double.infinity,
                            padding: const pw.EdgeInsets.all(8),
                            decoration: pw.BoxDecoration(
                              color: PdfColors.green50,
                              border: pw.Border.all(color: PdfColors.green200),
                              borderRadius: pw.BorderRadius.circular(6),
                            ),
                            child: pw.Text(
                              expectedResult,
                              style: const pw.TextStyle(
                                fontSize: 9,
                                lineSpacing: 2,
                              ),
                            ),
                          ),
                        ],
                      ],
                    ),
                  ),
                ],
              ),
            );
          }
'''
          text, method_count = method_pattern.subn(new_method, text, count=1)
          if method_count != 1:
              raise SystemExit(f'Remplacement méthode _stepCard: {method_count}')

          letter_pattern = re.compile(
              r'''      for \(final template in letterTemplates\) \{\n'''
              r'''        widgets\.add\(_letterTemplate\(template\)\);\n'''
              r'''      \}'''
          )
          letter_replacement = '''      for (var index = 0; index < letterTemplates.length; index++) {
            if (index > 0) widgets.add(pw.NewPage());
            widgets.add(_letterTemplate(letterTemplates[index]));
          }'''
          text, letter_count = letter_pattern.subn(
              letter_replacement,
              text,
              count=1,
          )
          if letter_count != 1:
              raise SystemExit(f'Remplacement pagination courriers: {letter_count}')

          text = text.replace('              fontStyle: pw.FontStyle.italic,\n', '')
          path.write_text(text, encoding='utf-8')
          print('Pagination des étapes et des courriers corrigée.')
          PY
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parcours-pdf-pagination-patch
          path: build/quality/parcours-pdf-pagination-patch.log
          retention-days: 7
      - name: Format and commit
        if: steps.patch.outcome == 'success'
        run: |
          dart format lib/services/journey_pdf_export_service.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/journey_pdf_export_service.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Corrige la pagination des étapes et courriers PDF'
          git push origin HEAD:agent/guide-parcours-pas-a-pas
      - name: Enforce patch
        if: steps.patch.outcome != 'success'
        run: exit 1
