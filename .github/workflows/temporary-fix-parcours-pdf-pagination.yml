name: Temporary fix parcours PDF pagination

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-fix-parcours-pdf-pagination.yml'
      - 'tools/temporary_patch_parcours_pdf.py'

permissions:
  contents: write

jobs:
  patch-pagination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply pagination patch
        run: python3 tools/temporary_patch_parcours_pdf.py
      - name: Format and commit
        run: |
          dart format lib/services/journey_pdf_export_service.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/journey_pdf_export_service.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Corrige la pagination des étapes et courriers PDF'
          git push origin HEAD:agent/guide-parcours-pas-a-pas
