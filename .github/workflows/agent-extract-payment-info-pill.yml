name: Agent - Extract payment info pill

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  extract-widget:
    if: github.head_ref == 'agent/payment-info-vibration' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/payment-info-vibration
          fetch-depth: 0

      - name: Extract widget from legacy page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/pages/offers/offer_details_page.dart')
          text = path.read_text(encoding='utf-8')

          import_anchor = (
              "import 'package:presto_app/pages/offers/widgets/payment_info_popup.dart';"
          )
          new_import = (
              "import 'package:presto_app/pages/offers/widgets/"
              "animated_payment_info_pill.dart';"
          )
          if new_import not in text:
              if import_anchor not in text:
                  raise SystemExit('Payment popup import anchor not found')
              text = text.replace(
                  import_anchor,
                  new_import + '\n' + import_anchor,
                  1,
              )

          start_marker = 'class _AnimatedPaymentInfoPill extends StatefulWidget {'
          end_marker = 'class _AdvertiserMetaLine extends StatelessWidget {'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Local payment info pill class markers not found')
          text = text[:start] + text[end:]

          usage_count = text.count('_AnimatedPaymentInfoPill(')
          if usage_count != 1:
              raise SystemExit(
                  f'Unexpected payment info pill usage count after extraction: {usage_count}'
              )
          text = text.replace(
              '_AnimatedPaymentInfoPill(',
              'AnimatedPaymentInfoPill(',
              1,
          )

          if '_AnimatedPaymentInfoPill' in text:
              raise SystemExit('Local payment info pill symbol still present')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate extraction
        shell: bash
        run: |
          git diff --check
          grep -q "animated_payment_info_pill.dart" lib/pages/offers/offer_details_page.dart
          grep -q "AnimatedPaymentInfoPill(" lib/pages/offers/offer_details_page.dart
          test "$(wc -l < lib/pages/offers/offer_details_page.dart)" -le 4616
          test "$(wc -l < lib/pages/offers/widgets/animated_payment_info_pill.dart)" -le 250

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/offers/offer_details_page.dart
          git commit -m "refactor: use extracted payment info pill"
          git push origin HEAD:agent/payment-info-vibration
