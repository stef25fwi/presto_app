name: Temporary remove spread toList

on:
  push:
    branches:
      - agent/phase-0-analyzer-ignore-15

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-analyzer-ignore-15
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply targeted cleanup
        run: |
          node tools/temporary_remove_spread_to_list.mjs
          dart format lib/pages/toolbox_je_me_lance_page.dart

      - name: Commit targeted cleanup
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/toolbox_je_me_lance_page.dart
          git commit -m 'fix: retire le toList inutile du spread toolbox'
          git push origin HEAD:agent/phase-0-analyzer-ignore-15
