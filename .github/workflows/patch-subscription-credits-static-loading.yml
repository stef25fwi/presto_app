name: Patch subscription credits static loading

on:
  push:
    branches:
      - agent/subscription-credits-dashboard

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply static credits loading') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/subscription-credits-dashboard
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/patch_subscription_credits_static_loading.py
      - name: Commit product patch and remove temporary tooling
        run: |
          git rm .github/workflows/patch-subscription-credits-static-loading.yml
          git rm tools/patch_subscription_credits_static_loading.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/subscriptions/subscription_credits_card.dart
          git commit -m "fix: apply static credits loading"
          git push origin HEAD:agent/subscription-credits-dashboard
