name: Analyzer ignore quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis_options.yaml'
      - 'quality/analyzer-ignore-gates.json'
      - 'tools/quality/check_analyzer_ignores.py'
      - '.github/workflows/analyzer-ignore-quality.yml'
  push:
    branches: [main]
    paths:
      - 'analysis_options.yaml'
      - 'quality/analyzer-ignore-gates.json'
      - 'tools/quality/check_analyzer_ignores.py'
      - '.github/workflows/analyzer-ignore-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyzer-ignore-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Enforce analyzer ignore ceiling
        run: |
          python3 tools/quality/check_analyzer_ignores.py \
            --output quality_reports/analyzer-ignores.md \
            --enforce

      - name: Publish report
        if: always()
        run: |
          if [ -f quality_reports/analyzer-ignores.md ]; then
            cat quality_reports/analyzer-ignores.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analyzer-ignores-${{ github.sha }}
          path: quality_reports/analyzer-ignores.md
          if-no-files-found: warn
          retention-days: 30
