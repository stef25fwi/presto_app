name: RGPD readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enforce:
        description: Fail unless every RGPD control is implemented with evidence
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  rgpd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test RGPD readiness checker
        run: node --test tools/quality/check_rgpd_readiness.test.mjs
      - name: Build RGPD readiness report
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.enforce }}" == "true" ]]; then
            node tools/quality/check_rgpd_readiness.mjs --enforce
          else
            node tools/quality/check_rgpd_readiness.mjs
          fi
      - name: Upload RGPD readiness report
        uses: actions/upload-artifact@v7
        with:
          name: rgpd-readiness-report
          path: quality_reports/rgpd/report.json
          retention-days: 30
