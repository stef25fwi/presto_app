name: SEO public profile activation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run ou application des projections déjà consenties"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: "Pour apply, saisir ACTIVATE_CONSENTED_PROFILES"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: recaptcha
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Install and build Functions
        run: |
          npm --prefix functions ci
          npm --prefix functions run build

      - name: Guard apply mode
        if: inputs.mode == 'apply'
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "ACTIVATE_CONSENTED_PROFILES"

      - name: Audit or activate consented public profiles
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          args=(
            "--project=presto-app-74abe"
            "--output=build/quality/seo-public-profile-activation.json"
          )
          if [ "$MODE" = "apply" ]; then
            args+=("--apply")
          fi
          node functions/scripts/backfill_public_service_profiles.mjs "${args[@]}"

      - name: Upload activation report
        uses: actions/upload-artifact@v7
        with:
          name: seo-public-profile-activation-${{ github.sha }}-${{ inputs.mode }}
          path: build/quality/seo-public-profile-activation.json
          if-no-files-found: error
          retention-days: 90
