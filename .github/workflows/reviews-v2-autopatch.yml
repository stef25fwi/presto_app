name: Reviews V2 complete flow autopatch

on:
  push:
    branches:
      - agent/reviews-v2-complete-mutual-flow

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/reviews-v2-complete-mutual-flow
          fetch-depth: 0

      - name: Apply targeted source patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Firestore: both the legacy user field and the canonical V2 score
          # collection are server-controlled.
          replace_once(
              "firestore.rules",
              "        'trustScore',\n        'uid',",
              "        'trustScore',\n        'trustScoreV2',\n        'uid',",
          )
          replace_once(
              "firestore.rules",
              "    // ⛔ [REFUSÉ] Catch-all — tout accès non déclaré est refusé\n    match /{document=**} {",
              "    // 🔒 Score Confiance V2 canonique — Cloud Functions Admin SDK uniquement.\n"
              "    match /user_trust_scores_v2/{userId} {\n"
              "      allow read, write: if false;\n"
              "    }\n\n"
              "    // ⛔ [REFUSÉ] Catch-all — tout accès non déclaré est refusé\n"
              "    match /{document=**} {",
          )

          # Preserve the semantic difference between \"Noter plus tard\" and
          # \"Supprimer sans avis\" even though both close the same listing.
          replace_once(
              "lib/pages/user_offers_section.dart",
              "          successMessage:\n              'Annonce \"$title\" marquée comme réalisée. Vous pourrez noter plus tard.',\n        );",
              "          successMessage:\n              'Annonce \"$title\" marquée comme réalisée. Vous pourrez noter plus tard.',\n          keepReviewTask: true,\n        );",
          )
          replace_once(
              "lib/pages/user_offers_section.dart",
              "      successMessage: message,\n    );\n  }\n\n  Future<void> _closeFoundOnIliPrestoWithoutReview({",
              "      successMessage: message,\n      keepReviewTask: action == FoundSomeoneOnIliPrestoAction.rateLater,\n    );\n  }\n\n  Future<void> _closeFoundOnIliPrestoWithoutReview({",
          )
          replace_once(
              "lib/pages/user_offers_section.dart",
              "    required String successMessage,\n  }) async {",
              "    required String successMessage,\n    bool keepReviewTask = false,\n  }) async {",
          )
          replace_once(
              "lib/pages/user_offers_section.dart",
              "      await _trustScoreService.closeOfferWithReason(\n        offerId: item.offerId,\n        reason: reason,\n        jobDone: true,\n      );\n      if (!mounted) return;",
              "      await _trustScoreService.closeOfferWithReason(\n        offerId: item.offerId,\n        reason: reason,\n        jobDone: true,\n      );\n      if (!keepReviewTask) {\n        await _trustScoreService.dismissPendingReviewTask(\n          offerId: item.offerId,\n        );\n      }\n      if (!mounted) return;",
          )

          # Conversation-level CTA: users can act on the reciprocal review
          # without having to discover the account menu first.
          replace_once(
              "lib/pages/messages/conversation_thread_page.dart",
              "import '../../features/subscriptions/subscription_models.dart';\n",
              "import '../../features/subscriptions/subscription_models.dart';\n"
              "import '../../features/trust_score/conversation_review_v2_cta.dart';\n",
          )
          replace_once(
              "lib/pages/messages/conversation_thread_page.dart",
              "              buildSafetyReminderBanner(),\n              buildTypingIndicator(),",
              "              buildSafetyReminderBanner(),\n"
              "              ConversationReviewV2Cta(\n"
              "                conversationId: widget.conversationId,\n"
              "              ),\n"
              "              buildTypingIndicator(),",
          )

          # A correction request must land on the actionable queue, not on a
          # passive profile page.
          replace_once(
              "functions/src/modules/marketplace/callables/reviews_admin_v2.ts",
              "            routeName: `/profile/${encodeURIComponent(userId)}`,",
              "            routeName: decision === \"request_correction\"\n"
              "              ? \"/account/mes-avis\"\n"
              "              : `/profile/${encodeURIComponent(userId)}` ,",
          )

          # TrustScoreService grew three actionable V2 methods. Any Dart test
          # double using `implements TrustScoreService` must implement them too.
          fake_methods = '''  @override
          Future<List<Map<String, dynamic>>> getPendingReviewTasks() async =>
              const <Map<String, dynamic>>[];

          @override
          Future<void> dismissPendingReviewTask({required String offerId}) async {}

          @override
          Future<String> reviseReview({
            required String reviewId,
            required String comment,
          }) async =>
              'pending_peer_review';

          '''.replace('          ', '')

          for path in Path('test').rglob('*.dart'):
              text = path.read_text()
              if 'implements TrustScoreService' not in text:
                  continue
              if 'getPendingReviewTasks()' in text:
                  continue
              anchor = '  @override\n  Future<TrustScoreProfile> getUserTrustScore'
              if anchor not in text:
                  raise SystemExit(f'Cannot patch TrustScoreService test double in {path}')
              path.write_text(text.replace(anchor, fake_methods + anchor, 1))
          PY

      - name: Verify patch integrity
        run: |
          git diff --check
          grep -q "'trustScoreV2'" firestore.rules
          grep -q "match /user_trust_scores_v2" firestore.rules
          grep -q "ConversationReviewV2Cta" lib/pages/messages/conversation_thread_page.dart
          grep -q "keepReviewTask" lib/pages/user_offers_section.dart
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('test').rglob('*.dart'):
              text = path.read_text()
              if 'implements TrustScoreService' in text and 'getPendingReviewTasks()' not in text:
                  raise SystemExit(f'incomplete TrustScoreService test double: {path}')
          PY

      - name: Commit generated patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "fix(reviews): complete review flow hardening [reviews-v2-autopatch]"
          git push origin HEAD:agent/reviews-v2-complete-mutual-flow
