name: Temporary wire admin access policy

on:
  push:
    branches:
      - agent/phase-2-admin-access-policy

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-2-admin-access-policy
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply targeted refactor
        run: |
          node tools/temporary_wire_admin_access_policy.mjs
          dart format lib/services/admin_access_resolver.dart \
            lib/services/admin_access_policy.dart \
            test/services/admin_access_policy_test.dart

      - name: Commit targeted change
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/admin_access_resolver.dart \
            lib/services/admin_access_policy.dart \
            test/services/admin_access_policy_test.dart
          git commit -m 'refactor: branche la policy pure d accès admin'
          git push origin HEAD:agent/phase-2-admin-access-policy
