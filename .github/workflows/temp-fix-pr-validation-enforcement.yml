name: Temporary fix PR validation enforcement

on:
  push:
    branches:
      - coverage/w1-auth-social-final-20260724
    paths:
      - .github/workflows/temp-fix-pr-validation-enforcement.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-fix-pr-validation-enforcement
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: coverage/w1-auth-social-final-20260724
          fetch-depth: 0

      - name: Fix conditional validation aggregation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pr-validation.yml')
          text = path.read_text()
          old = """      - name: Enforce validation result
        if: always()
        run: |
          outcomes='${{ steps.generated_check.outcome }} ${{ steps.flutter_deps.outcome }} ${{ steps.flutter_analyze.outcome }} ${{ steps.flutter_test.outcome }} ${{ steps.quality_gate.outcome }} ${{ steps.critical_coverage.outcome }} ${{ steps.functions_deps.outcome }} ${{ steps.functions_build.outcome }} ${{ steps.functions_test.outcome }} ${{ steps.firebase_cli.outcome }} ${{ steps.firestore_rules.outcome }} ${{ steps.web_build.outcome }} ${{ steps.bundle_budget.outcome }}'
          if echo \"$outcomes\" | grep -Eq 'failure|cancelled'; then
            echo \"Validation failed: $outcomes\"
            exit 1
          fi
          echo \"Validation succeeded: $outcomes\"
"""
          new = """      - name: Enforce validation result
        if: always()
        env:
          FUNCTIONS_CHANGED: ${{ steps.scope.outputs.functions }}
          FIRESTORE_CHANGED: ${{ steps.scope.outputs.firestore }}
          WEB_CHANGED: ${{ steps.scope.outputs.web }}
          CORE_OUTCOMES: ${{ steps.generated_check.outcome }} ${{ steps.flutter_deps.outcome }} ${{ steps.flutter_analyze.outcome }} ${{ steps.flutter_test.outcome }} ${{ steps.quality_gate.outcome }} ${{ steps.critical_coverage.outcome }}
          FUNCTIONS_OUTCOMES: ${{ steps.functions_deps.outcome }} ${{ steps.functions_build.outcome }} ${{ steps.functions_test.outcome }}
          FIRESTORE_OUTCOMES: ${{ steps.firebase_cli.outcome }} ${{ steps.firestore_rules.outcome }}
          WEB_OUTCOMES: ${{ steps.web_build.outcome }} ${{ steps.bundle_budget.outcome }}
        run: |
          set -euo pipefail
          required=\"$CORE_OUTCOMES\"
          if [ \"$FUNCTIONS_CHANGED\" = true ]; then
            required=\"$required $FUNCTIONS_OUTCOMES\"
          fi
          if [ \"$FIRESTORE_CHANGED\" = true ]; then
            required=\"$required $FIRESTORE_OUTCOMES\"
          fi
          if [ \"$WEB_CHANGED\" = true ]; then
            required=\"$required $WEB_OUTCOMES\"
          fi
          if echo \"$required\" | grep -Eq 'failure|cancelled'; then
            echo \"Validation failed: $required\"
            exit 1
          fi
          echo \"Validation succeeded: $required\"
"""
          if old not in text:
              raise SystemExit('enforcement block not found or already changed')
          path.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/workflows/temp-fix-pr-validation-enforcement.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pr-validation.yml .github/workflows/temp-fix-pr-validation-enforcement.yml
          git commit -m 'ci: enforce only required validation scopes'
          git push origin HEAD:coverage/w1-auth-social-final-20260724
