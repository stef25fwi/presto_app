name: Temporary compact fix 696

on:
  push:
    branches:
      - coverage/w1-messaging-next-20260723
    paths:
      - .github/workflows/temp-compact-696.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coverage/w1-messaging-next-20260723
          fetch-depth: 0

      - name: Compact equivalent post-frame mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('lib/pages/messages/conversations_list_page.dart')
          old = '''    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (!mounted || !_diagPanelVisible) return;
      final maxLines = _diagPanelVisible ? 40 : 12;
      setState(() {
        _adminConversationLoadLogs.insert(0, line);
        if (_adminConversationLoadLogs.length > maxLines) {
          _adminConversationLoadLogs.removeRange(
            maxLines,
            _adminConversationLoadLogs.length,
          );
        }
      });
    });'''
          new = '''    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (!mounted || !_diagPanelVisible) return;
      setState(() {
        final logs = _adminConversationLoadLogs;
        logs.insert(0, line);
        if (logs.length > 40) logs.removeRange(40, logs.length);
      });
    });'''

          text = target.read_text(encoding='utf-8')
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('Expected post-frame block not found')
          target.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          dart format lib/pages/messages/conversations_list_page.dart
          git config user.name "coverage-fix-bot"
          git config user.email "coverage-fix-bot@users.noreply.github.com"
          git add lib/pages/messages/conversations_list_page.dart
          git diff --cached --quiet && exit 0
          git commit -m "refactor(messages): keep admin log fix within legacy budget"
          git push origin HEAD:coverage/w1-messaging-next-20260723
