name: Temporary patch parcours orphan headers

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-patch-parcours-orphan-headers.yml'
      - 'tools/temporary_patch_parcours_orphan_headers.py'

permissions:
  contents: write

jobs:
  patch-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Apply orphan header patch
        run: python3 tools/temporary_patch_parcours_orphan_headers.py
      - name: Format and commit
        run: |
          dart format lib/services/journey_pdf_export_service.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/journey_pdf_export_service.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Éviter les titres d’étapes isolés dans le PDF'
          git push origin HEAD:agent/guide-parcours-pas-a-pas
