name: Temporary make contact width patch idempotent

on:
  push:
    branches:
      - agent/phase-0-analyzer-ignore-15

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-analyzer-ignore-15
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply generator fix
        run: node tools/temporary_make_contact_width_patch_idempotent.mjs

      - name: Commit generator fix
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/apply_validation_round2_fixes.mjs
          git commit -m 'fix: rend le patch largeur contact indépendant du formatage'
          git push origin HEAD:agent/phase-0-analyzer-ignore-15
