name: Repair PR459 via GitHub API

on:
  push:
    branches: [main]
    paths:
      - .github/pr459-api-repair.trigger
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: repair-pr459-api
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Patch product and test files
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'repair/pr451-complete';

            async function readFile(path, ref = branch) {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref,
              });
              if (Array.isArray(response.data) || response.data.type !== 'file') {
                throw new Error(`Expected file at ${path}`);
              }
              return {
                sha: response.data.sha,
                text: Buffer.from(response.data.content, 'base64').toString('utf8'),
              };
            }

            async function writeFile(path, text, message) {
              const current = await readFile(path);
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                branch,
                sha: current.sha,
                message,
                content: Buffer.from(text, 'utf8').toString('base64'),
              });
            }

            async function deleteFile(path) {
              try {
                const current = await readFile(path);
                await github.rest.repos.deleteFile({
                  owner,
                  repo,
                  path,
                  branch,
                  sha: current.sha,
                  message: 'chore(ci): remove temporary PR459 trigger',
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const sourcePath = 'lib/pages/messages/conversation_thread_page.dart';
            let source = (await readFile(sourcePath)).text;

            const headerOld = `            onForegroundImageError: (error, stackTrace) {
              debugPrint(
                '[ConversationThread] header avatar load failed '
                'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
                'error=$error',
              );
            },`;
            const headerNew = `            onForegroundImageError: _otherParticipantPhotoUrl.isNotEmpty
                ? (error, stackTrace) {
                    debugPrint(
                      '[ConversationThread] header avatar load failed '
                      'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
                      'error=$error',
                    );
                  }
                : null,`;

            const bubbleOld = `      onForegroundImageError: (error, stackTrace) {
        debugPrint(
          '[ConversationThread] bubble avatar load failed '
          'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
          'error=$error',
        );
      },`;
            const bubbleNew = `      onForegroundImageError: _otherParticipantPhotoUrl.isNotEmpty
          ? (error, stackTrace) {
              debugPrint(
                '[ConversationThread] bubble avatar load failed '
                'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
                'error=$error',
              );
            }
          : null,`;

            if (!source.includes(headerNew)) {
              if (!source.includes(headerOld)) throw new Error('Header avatar callback not found');
              source = source.replace(headerOld, headerNew);
            }
            if (!source.includes(bubbleNew)) {
              if (!source.includes(bubbleOld)) throw new Error('Bubble avatar callback not found');
              source = source.replace(bubbleOld, bubbleNew);
            }
            await writeFile(
              sourcePath,
              source,
              'fix(messages): guard empty conversation avatars',
            );

            const testPath = 'test/pages/messages/conversation_thread_page_shell_test.dart';
            let test = (await readFile(testPath)).text;
            const helper = `void _drainExpectedConversationThreadExceptions(WidgetTester tester) {
  Object? exception;
  while ((exception = tester.takeException()) != null) {
    final message = exception.toString();
    final isExpectedCircleAvatarAssertion =
        message.contains('circle_avatar.dart') &&
        message.contains(
          'foregroundImage != null || onForegroundImageError == null',
        );
    if (!isExpectedCircleAvatarAssertion) {
      throw exception!;
    }
  }
}

`;
            test = test.replace(helper, '');
            test = test.split('  _drainExpectedConversationThreadExceptions(tester);\n').join('');
            await writeFile(
              testPath,
              test,
              'test(messages): remove CircleAvatar exception workaround',
            );

            for (const path of [
              '.github/pr459-repair.trigger',
              '.github/pr459-native-sync-final.trigger',
              '.github/repair-pr459-main.trigger',
              '.github/repair-pr459-native-trigger-2',
            ]) {
              await deleteFile(path);
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 459,
              body: '### Réparation PR459 appliquée\n\nLes deux avatars sans URL sont protégés et le contournement d’exception a été supprimé. Les contrôles LCOV peuvent reprendre.',
            });
