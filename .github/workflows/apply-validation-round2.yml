name: Apply validation round 2 fixes

on:
  push:
    branches:
      - audit/prod-hardening-p0-p11
    paths:
      - tools/apply_validation_round2.mjs
      - .github/workflows/apply-validation-round2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-validation-round2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/prod-hardening-p0-p11
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply validation fixes
        run: node tools/apply_validation_round2.mjs

      - name: Commit generated corrections
        run: |
          if git diff --quiet; then
            echo "Validation round 2 already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/subscriptions/subscription_widgets.dart \
            lib/pages/toolbox_je_me_lance_page.dart \
            functions/scripts/test_user_authority_rules.mjs
          git commit -m "fix: corrige les derniers défauts UI et Rules"
          git push origin HEAD:audit/prod-hardening-p0-p11
