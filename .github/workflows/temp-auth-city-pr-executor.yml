name: Temporary auth city PR executor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  implement-and-test:
    if: github.head_ref == 'coverage/auth-city-search-wave' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Apply testability seam
        run: python3 tools/temp_auth_city_patch.py

      - name: Format
        run: dart format lib/services/account_social_auth_actions.dart test/services/account_social_auth_actions_web_coverage_test.dart test/services/city_search_coverage_test.dart

      - name: Dependencies
        run: flutter pub get

      - name: Test auth wave
        run: flutter test test/services/account_social_auth_actions_web_coverage_test.dart

      - name: Test city wave
        run: flutter test test/services/city_search_coverage_test.dart

      - name: Commit validated implementation
        shell: bash
        run: |
          rm -f .github/workflows/temp-auth-city-coverage-executor.yml
          rm -f .github/workflows/temp-auth-city-pr-executor.yml
          rm -f tools/temp_auth_city_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(coverage): cover social auth web and city search edges"
          git push origin HEAD:${{ github.head_ref }}
