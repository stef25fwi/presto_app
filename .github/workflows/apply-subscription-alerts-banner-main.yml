name: Apply subscription alerts banner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/subscription-alerts-banner.trigger

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Restore clean source files from main
        run: |
          git fetch origin main
          git show origin/main:lib/pages/account_page.dart > lib/pages/account_page.dart
          git show origin/main:lib/pages/admin/ad_placeholder_images_admin_page.dart > lib/pages/admin/ad_placeholder_images_admin_page.dart
          rm -f assets/images/subscription_alerts_banner.png

      - name: Generate banner and patch code
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/apply_subscription_alerts_banner.py

      - name: Validate targeted files
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/pages/account_page.dart lib/pages/admin/ad_placeholder_images_admin_page.dart

      - name: Commit integration to pull request branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/account_page.dart lib/pages/admin/ad_placeholder_images_admin_page.dart assets/images/subscription_alerts_banner.png
          git commit -m 'fix: apply subscription alerts banner with minimal diff' || exit 0
          git push origin HEAD:${{ github.head_ref }}
