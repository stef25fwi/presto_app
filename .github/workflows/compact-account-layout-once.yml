name: Compact account layout once

on:
  push:
    paths:
      - '.github/workflows/compact-account-layout-once.yml'

permissions:
  contents: write

jobs:
  compact-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reduce account and subscription horizontal spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          subscription = Path('lib/features/subscriptions/subscription_widgets.dart')
          text = subscription.read_text(encoding='utf-8')
          original = text
          text = text.replace(
              "padding: const EdgeInsets.fromLTRB(16, 8, 16, 32),",
              "padding: const EdgeInsets.fromLTRB(6, 8, 6, 32),",
          )
          text = text.replace(
              "padding: const EdgeInsets.all(18),",
              "padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 16),",
          )
          text = text.replace(
              "padding: const EdgeInsets.all(14),",
              "padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 14),",
          )
          if text == original:
              raise SystemExit('Aucun espacement abonnement correspondant trouvé')
          subscription.write_text(text, encoding='utf-8')

          account = Path('lib/pages/account_page.dart')
          text = account.read_text(encoding='utf-8')
          original = text
          replacements = {
              "padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 16),":
                  "padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 16),",
              "padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 14),":
                  "padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 14),",
              "padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 16),":
                  "padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 16),",
              "padding: const EdgeInsets.fromLTRB(20, 0, 20, 24),":
                  "padding: const EdgeInsets.fromLTRB(8, 0, 8, 24),",
              "padding: const EdgeInsets.fromLTRB(16, 0, 16, 24),":
                  "padding: const EdgeInsets.fromLTRB(8, 0, 8, 24),",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          if text == original:
              raise SystemExit('Aucun espacement compte correspondant trouvé')
          account.write_text(text, encoding='utf-8')
          PY

      - name: Format changed Dart files
        uses: dart-lang/setup-dart@v1
      - run: dart format lib/features/subscriptions/subscription_widgets.dart lib/pages/account_page.dart

      - name: Commit compact layout and remove one-shot workflow
        run: |
          rm .github/workflows/compact-account-layout-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/subscriptions/subscription_widgets.dart lib/pages/account_page.dart .github/workflows/compact-account-layout-once.yml
          git commit -m "fix: élargit les tuiles des pages compte et abonnement"
          git push origin main
