name: Android API 36 certification

on:
  pull_request:
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tools/android/ensure_api36_sdk.sh'
      - '.github/workflows/android-api36-certification.yml'
      - '.github/workflows/release_android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-api36-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'
  ANDROID_API_LEVEL: '36'

jobs:
  android36-build-test:
    name: Build + tests + manifest API 36
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Capture Flutter and Android environment
        run: |
          set -euo pipefail
          mkdir -p evidence/android-api36
          flutter --version | tee evidence/android-api36/flutter-version.txt
          flutter doctor -v | tee evidence/android-api36/flutter-doctor.txt
          java -version 2>&1 | tee evidence/android-api36/java-version.txt
          cat android/gradle/wrapper/gradle-wrapper.properties \
            | tee evidence/android-api36/gradle-wrapper-properties.txt
          grep -E 'com.android.application.*version' android/settings.gradle.kts \
            | tee evidence/android-api36/android-gradle-plugin.txt

      - name: Ensure Android 16 / API 36 SDK
        run: bash tools/android/ensure_api36_sdk.sh platform

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Assert explicit Gradle API 36 configuration
        run: |
          set -euo pipefail
          grep -Eq '^\s*compileSdk\s*=\s*36\s*$' android/app/build.gradle.kts
          grep -Eq '^\s*targetSdk\s*=\s*36\s*$' android/app/build.gradle.kts
          echo 'compileSdk=36 and targetSdk=36 are explicit.' \
            | tee evidence/android-api36/gradle-api36.txt

      - name: Build Android debug APK for merged-manifest proof
        run: flutter build apk --debug

      - name: Verify packaged APK targetSdk and permissions
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-debug.apk'
          APKA="$(command -v apkanalyzer || true)"
          if [[ -z "${APKA}" ]]; then
            APKA="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -type f -name apkanalyzer -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "${APKA}" || ! -x "${APKA}" ]]; then
            echo '::error::apkanalyzer introuvable dans Android SDK.'
            exit 1
          fi

          TARGET_SDK="$(${APKA} manifest target-sdk "${APK}" | tr -d '\r[:space:]')"
          echo "targetSdkVersion=${TARGET_SDK}" | tee evidence/android-api36/apk-target-sdk.txt
          test "${TARGET_SDK}" = '36'

          ${APKA} manifest print "${APK}" > evidence/android-api36/apk-manifest.xml
          ${APKA} manifest permissions "${APK}" > evidence/android-api36/apk-permissions.txt

          for permission in \
            android.permission.POST_NOTIFICATIONS \
            android.permission.CAMERA \
            android.permission.RECORD_AUDIO; do
            grep -q "${permission}" evidence/android-api36/apk-permissions.txt || {
              echo "::error::Permission attendue absente: ${permission}"
              exit 1
            }
          done

          if grep -q 'android.permission.MANAGE_EXTERNAL_STORAGE' \
              evidence/android-api36/apk-permissions.txt; then
            echo '::error::MANAGE_EXTERNAL_STORAGE est inattendue pour iliprestō.'
            exit 1
          fi

      - name: Upload build certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-api36-build-evidence-${{ github.sha }}
          path: evidence/android-api36/
          retention-days: 90
          if-no-files-found: warn

  android16-runtime-smoke:
    name: Android 16 emulator smoke
    runs-on: ubuntu-latest
    needs: android36-build-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Android 16 emulator image
        run: bash tools/android/ensure_api36_sdk.sh emulator

      - name: Install Android emulator runtime libraries
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          # GitHub-hosted Ubuntu runners may point APT at an Azure mirror that
          # occasionally stalls. Replace it with Ubuntu's canonical archive.
          mapfile -t AZURE_APT_FILES < <(
            sudo grep -RIl 'azure\.archive\.ubuntu\.com' /etc/apt 2>/dev/null || true
          )
          if (( ${#AZURE_APT_FILES[@]} > 0 )); then
            printf '%s\n' "${AZURE_APT_FILES[@]}" \
              | tee evidence-apt-files.txt
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              "${AZURE_APT_FILES[@]}"
          fi

          APT_OPTS=(
            -o Acquire::Retries=5
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            -o Acquire::ForceIPv4=true
          )

          sudo timeout 180s apt-get "${APT_OPTS[@]}" update
          sudo timeout 180s apt-get "${APT_OPTS[@]}" install \
            -y --no-install-recommends \
            libpulse0 \
            libglu1-mesa

          ldconfig -p | grep -E 'libpulse\.so\.0|libGLU\.so\.1'
          if sudo grep -Rqs 'azure\.archive\.ubuntu\.com' /etc/apt; then
            echo '::error::Azure Ubuntu mirror is still configured after fallback rewrite.'
            exit 1
          fi

      - name: Build debug APK
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Boot Android 16 emulator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p evidence/android-api36-runtime
          AVDMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -type f -name avdmanager -print -quit)"
          EMULATOR="${ANDROID_SDK_ROOT}/emulator/emulator"
          ADB="${ANDROID_SDK_ROOT}/platform-tools/adb"
          test -x "${AVDMANAGER}"
          test -x "${EMULATOR}"
          test -x "${ADB}"

          {
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
            echo "ANDROID_API_LEVEL=${ANDROID_API_LEVEL}"
            uname -a
            ls -l /dev/kvm 2>&1 || true
          } | tee evidence/android-api36-runtime/runner-environment.txt
          "${EMULATOR}" -version 2>&1 \
            | tee evidence/android-api36-runtime/emulator-version.txt
          "${ADB}" version 2>&1 \
            | tee evidence/android-api36-runtime/adb-version.txt

          sudo chmod 666 /dev/kvm || true
          echo no | "${AVDMANAGER}" create avd \
            --force \
            --name ilipresto-api36 \
            --package "system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64" \
            --device pixel_7
          "${AVDMANAGER}" list avd \
            | tee evidence/android-api36-runtime/avd-list.txt

          "${ADB}" kill-server || true
          "${ADB}" start-server

          "${EMULATOR}" \
            -avd ilipresto-api36 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -accel auto \
            -gpu swiftshader_indirect \
            > evidence/android-api36-runtime/emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "${EMULATOR_PID}" | tee evidence/android-api36-runtime/emulator-pid.txt

          SERIAL=''
          for i in {1..90}; do
            if ! kill -0 "${EMULATOR_PID}" 2>/dev/null; then
              echo '::error::Android emulator process exited before ADB became ready.'
              cat evidence/android-api36-runtime/emulator.log || true
              exit 1
            fi

            "${ADB}" devices -l > evidence/android-api36-runtime/adb-devices.txt || true
            SERIAL="$(awk '/^emulator-[0-9]+[[:space:]]+device([[:space:]]|$)/ {print $1; exit}' evidence/android-api36-runtime/adb-devices.txt)"
            if [[ -n "${SERIAL}" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "${SERIAL}" ]]; then
            echo '::error::Android emulator did not become an ADB device within 180 seconds.'
            cat evidence/android-api36-runtime/adb-devices.txt || true
            cat evidence/android-api36-runtime/emulator.log || true
            kill "${EMULATOR_PID}" 2>/dev/null || true
            exit 1
          fi
          echo "${SERIAL}" | tee evidence/android-api36-runtime/adb-serial.txt

          BOOT_COMPLETED=''
          for i in {1..100}; do
            if ! kill -0 "${EMULATOR_PID}" 2>/dev/null; then
              echo '::error::Android emulator process exited during boot.'
              cat evidence/android-api36-runtime/emulator.log || true
              exit 1
            fi

            BOOT_COMPLETED="$("${ADB}" -s "${SERIAL}" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r[:space:]' || true)"
            echo "attempt=${i} boot_completed=${BOOT_COMPLETED}" \
              > evidence/android-api36-runtime/boot-status.txt
            if [[ "${BOOT_COMPLETED}" == '1' ]]; then
              break
            fi
            sleep 3
          done

          if [[ "${BOOT_COMPLETED}" != '1' ]]; then
            echo '::error::Android 16 emulator did not finish booting within 300 seconds.'
            "${ADB}" -s "${SERIAL}" shell getprop \
              > evidence/android-api36-runtime/getprop.txt 2>&1 || true
            cat evidence/android-api36-runtime/emulator.log || true
            exit 1
          fi

          "${ADB}" -s "${SERIAL}" shell input keyevent 82 || true
          "${ADB}" -s "${SERIAL}" shell getprop ro.build.version.release \
            | tee evidence/android-api36-runtime/android-release.txt
          "${ADB}" -s "${SERIAL}" shell getprop ro.build.version.sdk \
            | tee evidence/android-api36-runtime/android-sdk.txt
          test "$(tr -d '\r[:space:]' < evidence/android-api36-runtime/android-sdk.txt)" = '36'

      - name: Install and launch app on Android 16
        run: |
          set -euo pipefail
          ADB="${ANDROID_SDK_ROOT}/platform-tools/adb"
          SERIAL="$(cat evidence/android-api36-runtime/adb-serial.txt)"
          "${ADB}" -s "${SERIAL}" install -r build/app/outputs/flutter-apk/app-debug.apk
          "${ADB}" -s "${SERIAL}" shell am force-stop fr.ilipresto.app
          "${ADB}" -s "${SERIAL}" shell am start -W -n fr.ilipresto.app/.MainActivity \
            | tee evidence/android-api36-runtime/app-launch.txt
          grep -Eq 'Status: ok|Complete' evidence/android-api36-runtime/app-launch.txt
          sleep 5
          if "${ADB}" -s "${SERIAL}" shell dumpsys activity exit-info fr.ilipresto.app 2>/dev/null \
              | grep -Eq 'REASON_CRASH|REASON_ANR'; then
            echo '::error::Crash/ANR detected after startup.'
            exit 1
          fi

      - name: Exercise Android 16 permissions and deep links
        run: |
          set -euo pipefail
          ADB="${ANDROID_SDK_ROOT}/platform-tools/adb"
          SERIAL="$(cat evidence/android-api36-runtime/adb-serial.txt)"
          for permission in \
            android.permission.POST_NOTIFICATIONS \
            android.permission.CAMERA \
            android.permission.RECORD_AUDIO; do
            "${ADB}" -s "${SERIAL}" shell pm grant fr.ilipresto.app "${permission}"
          done
          "${ADB}" -s "${SERIAL}" shell dumpsys package fr.ilipresto.app \
            > evidence/android-api36-runtime/package-dump.txt

          "${ADB}" -s "${SERIAL}" shell am start -W \
            -a android.intent.action.VIEW \
            -c android.intent.category.BROWSABLE \
            -d 'ilipresto://home' \
            fr.ilipresto.app \
            | tee evidence/android-api36-runtime/deeplink-custom.txt
          "${ADB}" -s "${SERIAL}" shell am start -W \
            -a android.intent.action.VIEW \
            -c android.intent.category.BROWSABLE \
            -d 'https://ilipresto.fr/app' \
            fr.ilipresto.app \
            | tee evidence/android-api36-runtime/deeplink-https.txt
          grep -Eq 'Status: ok|Complete' evidence/android-api36-runtime/deeplink-custom.txt
          grep -Eq 'Status: ok|Complete' evidence/android-api36-runtime/deeplink-https.txt

      - name: Capture logcat
        if: always()
        run: |
          mkdir -p evidence/android-api36-runtime
          ADB="${ANDROID_SDK_ROOT}/platform-tools/adb"
          if [[ -f evidence/android-api36-runtime/adb-serial.txt ]]; then
            SERIAL="$(cat evidence/android-api36-runtime/adb-serial.txt)"
            "${ADB}" -s "${SERIAL}" logcat -d \
              > evidence/android-api36-runtime/logcat.txt 2>&1 || true
          else
            "${ADB}" devices -l \
              > evidence/android-api36-runtime/adb-devices-final.txt 2>&1 || true
          fi
          pkill -f "emulator.*ilipresto-api36" || true

      - name: Upload Android 16 runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android16-runtime-smoke-${{ github.sha }}
          path: evidence/android-api36-runtime/
          retention-days: 90
          if-no-files-found: warn
