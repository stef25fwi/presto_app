name: Production readiness evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'quality/production_readiness.json'
      - 'tools/quality/check_production_readiness.mjs'
      - 'tools/quality/check_production_readiness.test.mjs'
      - 'docs/**'
      - 'quality_reports/**'
      - '.github/workflows/production-readiness.yml'
  workflow_dispatch:
    inputs:
      enforce_go_live:
        description: 'Bloquer si une preuve des phases 8 à 16 manque'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test readiness checker
        run: node --test tools/quality/check_production_readiness.test.mjs

      - name: Generate readiness inventory
        run: node tools/quality/check_production_readiness.mjs

      - name: Enforce go-live evidence
        if: github.event_name == 'workflow_dispatch' && inputs.enforce_go_live
        run: node tools/quality/check_production_readiness.mjs --enforce

      - name: Upload readiness report
        uses: actions/upload-artifact@v7
        with:
          name: production-readiness-${{ github.sha }}
          path: quality_reports/production-readiness/report.json
          if-no-files-found: error
          retention-days: 30
