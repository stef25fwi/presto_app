name: Stripe readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-stripe-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Stripe readiness checker
        run: node tools/quality/check_stripe_readiness.test.mjs
      - name: Build Stripe readiness inventory
        run: node tools/quality/check_stripe_readiness.mjs
      - name: Upload Stripe readiness report
        uses: actions/upload-artifact@v7
        with:
          name: stripe-readiness-report
          path: quality_reports/stripe-readiness/report.json
          retention-days: 30
