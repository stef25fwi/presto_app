name: Temporary patch preview project safety

on:
  push:
    branches:
      - agent/phase-3-preview-project-safety

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3-preview-project-safety
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply preview safety patch
        run: node tools/temporary_patch_preview_project_safety.mjs

      - name: Run preview safety unit tests
        run: node --test tools/quality/check_firebase_preview_project.test.mjs

      - name: Commit targeted workflow change
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pr-validation.yml
          git commit -m 'ci: interdit les previews sur le projet Firebase production'
          git push origin HEAD:agent/phase-3-preview-project-safety
