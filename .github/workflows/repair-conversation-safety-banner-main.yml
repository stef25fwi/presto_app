name: One-time repair conversation safety banner

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - .github/repair-triggers/conversation-safety-banner.txt

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair pull request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Apply and verify focused UI repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/pages/messages/conversation_thread_page.dart')
          content = path.read_text(encoding='utf-8')

          start_marker = '  Widget buildSafetyReminderBanner()'
          end_marker = '  Widget buildTypingIndicator()'
          start = content.index(start_marker)
          end = content.index(end_marker, start)
          segment = content[start:end]

          if 'Icons.warning_amber_rounded' not in segment:
              segment, count = re.subn(
                  r'Icons\.shield_outlined',
                  'Icons.warning_amber_rounded',
                  segment,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('Could not replace the safety-banner shield icon')

          segment, count = re.subn(
              r'(Icons\.warning_amber_rounded,\s*\n\s*color:\s*Color\(0xFFFF0000\),\s*\n\s*size:\s*)20',
              r'\g<1>22',
              segment,
              count=1,
          )
          if count == 0 and 'size: 22' not in segment:
              raise SystemExit('Could not set the warning icon size to 22')

          if 'fontSize: 15' not in segment or 'height: 1.25' not in segment:
              segment, count = re.subn(
                  r'(style:\s*kPrestoMetaTextStyle\.copyWith\(\s*\n\s*color:\s*const Color\(0xFFFF0000\),\s*\n)(\s*fontWeight:)',
                  r'\1                  fontSize: 15,\n                  height: 1.25,\n\2',
                  segment,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('Could not add the readable text sizing')

          if 'Icons.shield_outlined' in segment:
              raise SystemExit('Old shield icon remains in safety banner')
          if segment.count('Icons.warning_amber_rounded') != 1:
              raise SystemExit('Warning icon is missing or duplicated')
          if 'size: 22' not in segment:
              raise SystemExit('Warning icon size 22 is missing')
          if 'fontSize: 15' not in segment or 'height: 1.25' not in segment:
              raise SystemExit('Readable text sizing was not applied')

          path.write_text(content[:start] + segment + content[end:], encoding='utf-8')
          print('Safety banner repair applied and verified.')
          PY

          rm -f .github/repair-triggers/conversation-safety-banner.txt
          git diff --check
          git diff -- lib/pages/messages/conversation_thread_page.dart

      - name: Commit repair to pull request branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/messages/conversation_thread_page.dart
          git add -u .github/repair-triggers/conversation-safety-banner.txt
          if git diff --cached --quiet; then
            echo "Repair already present; nothing to commit."
            exit 0
          fi
          git commit -m "fix(messages): improve safety banner readability"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
