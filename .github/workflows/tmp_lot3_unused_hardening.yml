name: tmp lot3 unused hardening

on:
  push:
    branches:
      - refactor/lot3-unused-hardening-final-20260808

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/lot3-unused-hardening-final-20260808
      - name: Remove unused suppressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          analysis = Path('analysis_options.yaml')
          text = analysis.read_text()
          text = text.replace('    unused_field: ignore\n', '')
          text = text.replace('    unused_element: ignore\n', '')
          analysis.write_text(text)

          unused = {
              'unused_element',
              'unused_field',
              'unused_local_variable',
              'unused_element_parameter',
          }
          changed = []
          for path in Path('lib').rglob('*.dart'):
              lines = path.read_text().splitlines(keepends=True)
              out = []
              touched = False
              for line in lines:
                  stripped = line.strip()
                  if stripped.startswith('// ignore_for_file:'):
                      prefix, values = line.split(':', 1)
                      tokens = [v.strip() for v in values.strip().split(',') if v.strip()]
                      kept = [v for v in tokens if v not in unused]
                      if kept != tokens:
                          touched = True
                          if kept:
                              newline = '\n' if line.endswith('\n') else ''
                              out.append(f'{prefix}: {", ".join(kept)}{newline}')
                          continue
                  out.append(line)
              if touched:
                  path.write_text(''.join(out))
                  changed.append(str(path))

          print('Files with local unused suppressions removed:')
          for p in changed:
              print(p)
          PY
      - name: Commit hardening patch
        shell: bash
        run: |
          rm .github/workflows/tmp_lot3_unused_hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_options.yaml lib .github/workflows/tmp_lot3_unused_hardening.yml
          git commit -m 'refactor(lot3): expose all unused code to analyzer'
          git push origin HEAD:refactor/lot3-unused-hardening-final-20260808
