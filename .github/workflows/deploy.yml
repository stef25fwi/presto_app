name: Validate and Deploy Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Déployer aussi les Cloud Functions'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    # Les secrets de production sont actuellement stockés dans cet environnement.
    # Renommer l'environnement seulement après migration explicite des secrets.
    environment: recaptcha
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Verify generated hardening patches are committed
        run: |
          node tools/apply_prod_hardening_patches.mjs
          node tools/apply_startup_hardening.mjs
          node tools/apply_auth_client_hardening.mjs
          node tools/apply_account_cleanup_patch.mjs
          node tools/normalize_cursor_patch_script.mjs
          node tools/fix_cursor_query_signature_patch.mjs
          node tools/apply_cursor_pagination.mjs
          node tools/apply_validation_fixes.mjs
          node tools/apply_identity_authority_hardening.mjs
          node tools/apply_dependency_security_upgrades.mjs
          node tools/apply_stripe_ordering_hardening.mjs
          node tools/apply_function_resource_limits.mjs
          node tools/apply_release_validation_fixes.mjs
          node tools/apply_validation_round2_fixes.mjs
          npm --prefix functions install --package-lock-only --ignore-scripts
          git diff --exit-code
          node tools/check_production_guardrails.mjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --fatal-infos

      - name: Test Flutter with coverage
        run: flutter test --coverage --reporter expanded

      - name: Enforce repository quality gates
        run: |
          python3 tools/quality/audit_repository.py \
            --output-dir quality_reports/production \
            --git-ref '${{ github.sha }}' \
            --enforce

      - name: Generate programmatic local SEO pages
        run: node tools/seo/generate_programmatic_local_pages.mjs

      - name: Validate programmatic local SEO
        run: node tools/quality/check_programmatic_local_seo.mjs

      - name: Validate public marketplace SEO
        run: node tools/quality/check_public_marketplace_seo.mjs

      - name: Validate every public page
        run: node tools/quality/check_public_page_seo.mjs

      - name: Validate production smoke contract
        run: node tools/quality/check_production_smoke_contract.mjs

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Aggregate production SEO signals
        run: |
          node functions/scripts/generate_programmatic_seo_signals.mjs \
            --project=presto-app-74abe \
            --output=quality/seo-programmatic-local-signals.json

      - name: Regenerate local SEO from production signals
        run: |
          node tools/seo/generate_programmatic_local_pages.mjs
          node tools/quality/check_programmatic_local_seo.mjs

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Test Functions
        run: npm --prefix functions test

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Test Firestore rules in Emulator
        run: npm --prefix functions run test:firestore

      - name: Build Web for Firebase Hosting
        env:
          APPCHECK_RECAPTCHA_SITE_KEY: ${{ secrets.APPCHECK_RECAPTCHA_SITE_KEY }}
        run: |
          bash tools/flutter_with_build_stamp.sh build web --release --no-wasm-dry-run

      - name: Enforce Web bundle budgets
        run: node tools/check_web_bundle_size.mjs

      - name: Archive validated release before deployment
        uses: actions/upload-artifact@v7
        with:
          name: production-release-${{ github.sha }}
          path: |
            build/web
            functions/lib
            firebase.json
            firestore.indexes.json
            firestore.rules
            storage.rules
            quality_reports/production
            quality/seo-programmatic-local-signals.json
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 90

      - name: Detect Functions changes
        id: functions_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          DEPLOY_FUNCTIONS_INPUT: ${{ inputs.deploy_functions }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "${DEPLOY_FUNCTIONS_INPUT:-false}" = "true" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Déploiement manuel : Functions demandées explicitement." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Déploiement manuel Web : Functions non demandées, étape ignorée." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          if [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Référence précédente indisponible : Functions déployées par sécurité." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- functions firebase.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Functions inchangées : déploiement Functions ignoré." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changements Functions détectés : déploiement requis." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy Hosting, Firestore indexes and Storage
        run: |
          firebase deploy --project presto-app-74abe \
            --only hosting,firestore:indexes,storage \
            --force

      - name: Deploy Functions with exit 130 retry
        if: steps.functions_changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -uo pipefail
          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            echo "🚀 Déploiement Functions — tentative $attempt/$max_attempts"
            set +e
            firebase deploy --project presto-app-74abe \
              --only functions \
              --force
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "✅ Functions déployées"
              exit 0
            fi

            if [ "$status" -ne 130 ]; then
              echo "❌ Firebase a échoué avec le code $status. Aucun retry automatique."
              exit "$status"
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "⚠️ Firebase a été interrompu avec le code 130. Nouvelle tentative dans 30 secondes."
              sleep 30
            fi
          done

          echo "❌ Firebase a renvoyé le code 130 après $max_attempts tentatives."
          exit 130

      - name: Deploy Firestore rules (ignore 409 if rules unchanged)
        run: |
          output=$(firebase deploy --project presto-app-74abe --only firestore:rules --force 2>&1) && echo "$output" || {
            echo "$output"
            if echo "$output" | grep -q "409"; then
              echo "ℹ️ Firestore rules inchangées — release déjà existante, on continue."
              exit 0
            fi
            exit 1
          }

      - name: Production smoke tests
        shell: bash
        run: |
          set -euo pipefail

          fetch_url() {
            curl --fail --silent --show-error \
              --retry 6 --retry-delay 5 --retry-all-errors "$1"
          }

          assert_contains() {
            local haystack="$1"
            local needle="$2"
            local label="$3"
            if [[ "$haystack" != *"$needle"* ]]; then
              echo "❌ $label — contenu attendu absent: $needle"
              return 1
            fi
          }

          assert_not_contains() {
            local haystack="$1"
            local needle="$2"
            local label="$3"
            if [[ "$haystack" == *"$needle"* ]]; then
              echo "❌ $label — contenu interdit détecté: $needle"
              return 1
            fi
          }

          fetch_url https://ilipresto.fr/manifest.json >/dev/null

          public_urls=(
            https://ilipresto.fr/
            https://ilipresto.fr/guadeloupe
            https://ilipresto.fr/martinique
            https://ilipresto.fr/guyane
            https://ilipresto.fr/mentions-legales
            https://ilipresto.fr/confidentialite
            https://ilipresto.fr/cgu
            https://ilipresto.fr/suppression-compte
          )

          for url in "${public_urls[@]}"; do
            page="$(fetch_url "$url")"
            assert_contains "$page" '<title>' "$url title"
            assert_contains "$page" 'rel="canonical"' "$url canonical"
          done

          for slug in guadeloupe martinique guyane; do
            page="$(fetch_url "https://ilipresto.fr/$slug")"
            assert_contains "$page" "<link rel=\"canonical\" href=\"https://ilipresto.fr/$slug\">" "$slug canonical"
            assert_contains "$page" '<h1>' "$slug h1"
            assert_contains "$page" 'aria-label="Fil d’Ariane"' "$slug breadcrumb"
          done

          local_page="$(fetch_url https://ilipresto.fr/services/jardinage/les-abymes/)"
          assert_contains "$local_page" '<link rel="canonical" href="https://ilipresto.fr/services/jardinage/les-abymes/">' 'page locale canonical'
          assert_contains "$local_page" '<meta name="robots" content="' 'page locale robots'
          assert_not_contains "$local_page" 'JobPosting' 'page locale service'

          legal_registry="$(fetch_url https://ilipresto.fr/public-route-seo.js)"
          for route in /mentions-legales /confidentialite /cgu /suppression-compte; do
            assert_contains "$legal_registry" "'$route'" "registre juridique $route"
          done

          sitemap="$(fetch_url https://ilipresto.fr/sitemap.xml)"
          for route in /guadeloupe /martinique /guyane /mentions-legales /confidentialite /cgu /suppression-compte; do
            assert_contains "$sitemap" "<loc>https://ilipresto.fr$route</loc>" "sitemap principal $route"
          done

          local_sitemap="$(fetch_url https://ilipresto.fr/sitemap-local.xml)"
          assert_contains "$local_sitemap" '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' 'sitemap local urlset'

          listings_sitemap="$(fetch_url https://ilipresto.fr/sitemap-annonces.xml)"
          assert_contains "$listings_sitemap" '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' 'sitemap annonces urlset'

          missing_listing_status="$(curl --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --output /tmp/ilipresto-missing-listing.html \
            --write-out '%{http_code}' \
            https://ilipresto.fr/annonces/seo-missing-000000/)"
          test "$missing_listing_status" = "404"
          grep -Fq 'noindex,follow' /tmp/ilipresto-missing-listing.html

          first_listing_url=''
          if [[ "$listings_sitemap" =~ https://ilipresto\.fr/annonces/[^\<]+ ]]; then
            first_listing_url="${BASH_REMATCH[0]}"
          fi

          if [ -n "$first_listing_url" ]; then
            listing_page="$(fetch_url "$first_listing_url")"
            assert_contains "$listing_page" "<link rel=\"canonical\" href=\"$first_listing_url\">" 'annonce canonical'
            assert_contains "$listing_page" '<meta name="robots" content="index,follow' 'annonce robots indexable'
            assert_not_contains "$listing_page" 'JobPosting' 'annonce publique'
          fi

          echo '✅ Smoke production validé sans pipeline grep -q vulnérable à SIGPIPE.'

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo '## Déploiement iliprestō'
            echo
            echo "- Commit : \`${{ github.sha }}\`"
            echo "- Workflow : \`${{ github.run_id }}\`"
            echo '- Cible : `presto-app-74abe`'
            echo '- URL contrôlée : `https://ilipresto.fr`'
            echo '- Pages publiques de base contrôlées : `8`'
            echo '- SEO programmatique local : signaux production agrégés, pages générées et contrôlées avant build'
            echo '- SEO annonces publiques : sitemap SSR et routage annonces contrôlés en production'
            echo "- Functions modifiées : \`${{ steps.functions_changes.outputs.changed || 'unknown' }}\`"
            echo '- Artefact de restauration : `production-release-${{ github.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"
