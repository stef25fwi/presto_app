name: Validate and Deploy Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Enable Flutter web
        run: flutter config --enable-web
      
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --fatal-infos

      - name: Test Flutter
        run: flutter test

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Test Functions
        run: npm --prefix functions test
      
      - name: Build Web for Firebase Hosting
        env:
          APPCHECK_RECAPTCHA_SITE_KEY: ${{ secrets.APPCHECK_RECAPTCHA_SITE_KEY }}
          MARKETPLACE_RECAPTCHA_WEB_SITE_KEY: ${{ secrets.MARKETPLACE_RECAPTCHA_WEB_SITE_KEY }}
        run: |
          bash tools/flutter_with_build_stamp.sh build web --release --no-wasm-dry-run \
            --dart-define=APPCHECK_RECAPTCHA_SITE_KEY="$APPCHECK_RECAPTCHA_SITE_KEY" \
            --dart-define=MARKETPLACE_RECAPTCHA_WEB_SITE_KEY="$MARKETPLACE_RECAPTCHA_WEB_SITE_KEY"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Hosting, Functions, Firestore and Storage
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --project presto-app-74abe \
            --only hosting,functions,firestore:rules,firestore:indexes,storage \
            --token "$FIREBASE_TOKEN"
