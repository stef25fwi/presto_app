name: Lot3 account dead field patch

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lot3-unused-masks-final-20260807
          fetch-depth: 0
      - name: Remove proven-dead profile load flag
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/pages/account_page.dart')
          text = p.read_text()
          targets = {
              '  bool _profileLoadRequested = false;\n': 1,
              '    _profileLoadRequested = false;\n': 1,
              '      _profileLoadRequested = true;\n': 1,
              '          _profileLoadRequested = true;\n': 2,
          }
          for needle, expected in targets.items():
              actual = text.count(needle)
              if actual != expected:
                  raise SystemExit(f'fail-fast: expected {expected}, got {actual}: {needle!r}')
              text = text.replace(needle, '')
          p.write_text(text)
          Path('.github/workflows/lot3-account-dead-field-patch.yml').unlink()
      - name: Verify symbol is gone
        run: |
          ! grep -R "_profileLoadRequested" lib/pages/account_page.dart
          git diff --check
      - name: Commit atomic cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(lot3): supprimer le flag profil jamais lu"
          git push origin HEAD:refactor/lot3-unused-masks-final-20260807
