name: Temporary format admin space navigation

on:
  push:
    branches:
      - agent/phase-5-admin-listings-management-ui-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-5-admin-listings-management-ui-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply targeted format fix
        run: node tools/temporary_format_admin_space_navigation.mjs

      - name: Commit targeted change
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/admin_space_page.dart
          git commit -m 'style: formate la navigation vers les annonces admin'
          git push origin HEAD:agent/phase-5-admin-listings-management-ui-v2
