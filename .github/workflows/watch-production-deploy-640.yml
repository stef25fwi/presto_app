name: Agent - Watch production deployment 640

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  actions: read
  contents: read

jobs:
  discover-production:
    if: github.head_ref == 'agent/deploy-watch-640'
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find-run.outputs.run_id }}
      run_url: ${{ steps.find-run.outputs.run_url }}
    steps:
      - name: Find Firebase production workflow
        id: find-run
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetSha = 'b4db52a15df5862c091f65c4a0af9c872faf73d8';
            const workflowName = 'Validate and Deploy Firebase';
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            let deploymentRun;
            for (let attempt = 1; attempt <= 60; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: targetSha,
                event: 'push',
                per_page: 100,
              });
              deploymentRun = response.data.workflow_runs.find(
                (run) => run.name === workflowName,
              );
              if (deploymentRun) break;
              core.info(`Run de déploiement non visible, tentative ${attempt}/60.`);
              await sleep(10000);
            }

            if (!deploymentRun) {
              core.setFailed(`Aucun run ${workflowName} trouvé pour ${targetSha}.`);
              return;
            }

            core.setOutput('run_id', String(deploymentRun.id));
            core.setOutput('run_url', deploymentRun.html_url);
            core.info(`DEPLOY_RUN_ID=${deploymentRun.id}`);
            core.info(`DEPLOY_RUN_URL=${deploymentRun.html_url}`);

  watch-production:
    needs: discover-production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Follow Firebase production workflow
        uses: actions/github-script@v8
        env:
          DEPLOY_RUN_ID: ${{ needs.discover-production.outputs.run_id }}
          DEPLOY_RUN_URL: ${{ needs.discover-production.outputs.run_url }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetSha = 'b4db52a15df5862c091f65c4a0af9c872faf73d8';
            const deploymentRunId = Number(process.env.DEPLOY_RUN_ID);
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            if (!deploymentRunId) {
              core.setFailed('Identifiant du run Firebase absent.');
              return;
            }

            let deploymentRun;
            for (let attempt = 1; attempt <= 165; attempt += 1) {
              const response = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: deploymentRunId,
              });
              deploymentRun = response.data;
              core.info(
                `État ${attempt}/165 : ${deploymentRun.status} / ${deploymentRun.conclusion ?? 'en cours'}`,
              );
              if (deploymentRun.status === 'completed') break;
              await sleep(20000);
            }

            const success =
              deploymentRun?.status === 'completed' &&
              deploymentRun?.conclusion === 'success';

            if (!success) {
              core.setFailed(
                `Déploiement ${deploymentRun?.status ?? 'inconnu'}/${deploymentRun?.conclusion ?? 'inconnu'} — ${process.env.DEPLOY_RUN_URL}`,
              );
              return;
            }

            core.info(
              `Déploiement Firebase réussi pour ${targetSha} — ${process.env.DEPLOY_RUN_URL}`,
            );
