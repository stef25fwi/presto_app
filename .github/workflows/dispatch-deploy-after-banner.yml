name: Dispatch Firebase deploy after banner

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  dispatch-and-wait:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'agent/deploy-subscription-banner'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Dispatch and resolve production deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          main_sha=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          echo "Déploiement demandé pour main=$main_sha à $dispatched_at"
          gh workflow run deploy.yml --repo "$REPOSITORY" --ref main

          for attempt in $(seq 1 60); do
            runs=$(gh run list \
              --repo "$REPOSITORY" \
              --workflow deploy.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha,createdAt,status)

            run_id=$(printf '%s' "$runs" | jq -r \
              --arg sha "$main_sha" \
              --arg since "$dispatched_at" \
              '[.[] | select(.headSha == $sha and .createdAt >= $since)]
               | sort_by(.createdAt)
               | last
               | .databaseId // empty')

            if [ -n "$run_id" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
              echo "Run Firebase détecté : $run_id"
              exit 0
            fi

            sleep 5
          done

          echo "Déploiement workflow_dispatch introuvable pour main=$main_sha après $dispatched_at."
          exit 1

      - name: Wait for Firebase deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.deployment.outputs.run_id }}
        run: gh run watch "$RUN_ID" --repo "$REPOSITORY" --exit-status --interval 15

      - name: Confirm deployment on pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ steps.deployment.outputs.run_id }}
          MAIN_SHA: ${{ steps.deployment.outputs.main_sha }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "✅ DEPLOYMENT_SUCCESS — Firebase production déployé et contrôlé. Run: $RUN_ID — main: $MAIN_SHA"

      - name: Report deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ steps.deployment.outputs.run_id }}
          MAIN_SHA: ${{ steps.deployment.outputs.main_sha }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "❌ DEPLOYMENT_FAILED — le déploiement Firebase a échoué. Run: ${RUN_ID:-introuvable} — main: ${MAIN_SHA:-inconnu}"
