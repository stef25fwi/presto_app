name: Temporary remove unused imports for analyzer 9

on:
  push:
    branches:
      - agent/phase-0-analyzer-ignore-9

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-analyzer-ignore-9
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove unused imports
        run: node tools/temporary_remove_unused_imports_for_analyzer_9.mjs

      - name: Commit targeted changes
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/admin/messaging/admin_conversation_detail_page.dart \
            lib/admin/messaging/admin_messaging_center_page.dart \
            lib/pages/account/mes_projets_fiche_page.dart \
            lib/pages/fiche_pro_page.dart
          git commit -m 'fix: retire cinq imports inutilisés'
          git push origin HEAD:agent/phase-0-analyzer-ignore-9
