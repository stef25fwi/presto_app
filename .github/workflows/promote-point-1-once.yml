name: Promote point 1 once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/promote-point-1-once.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Valider le point 1 et préparer le point 2
        run: |
          node tools/quality/check_18_point_completion.mjs \
            --promote \
            --json \
            --report-path /tmp/promotion-report.md \
            > /tmp/promotion-state.json
          cat /tmp/promotion-state.json
          cat /tmp/promotion-report.md
      - name: Créer la PR de promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="agent/18-point-promote-1-${GITHUB_RUN_ID}"
          git config user.name "ilipresto-18-point-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git rm .github/workflows/promote-point-1-once.yml
          git add quality/18-point-completion.json
          git commit -m "chore(quality): valider le point 1 et activer le point 2"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Valider le point 1 et activer le point 2" \
            --body "## Promotion séquentielle\n\n- Point 1 — Cadrage produit : verified\n- Point 2 — UX/UI et design system : active\n- Promotion produite après validation des preuves, contrôles et commandes du superviseur.\n- Ce PR supprime également le déclencheur temporaire de promotion."
