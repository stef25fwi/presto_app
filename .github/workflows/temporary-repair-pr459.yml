name: Temporary repair PR459

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-repair-pr459
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.number == 459 &&
       github.event.comment.body == '/repair-pr459-20260716')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: repair/pr451-complete
          fetch-depth: 0

      - name: Apply exact messaging repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main repair/pr451-complete
          git switch -C repair/pr451-complete origin/repair/pr451-complete

          python3 - <<'PY'
          from pathlib import Path

          source = Path('lib/pages/messages/conversation_thread_page.dart')
          text = source.read_text()

          header_old = """            onForegroundImageError: (error, stackTrace) {
              debugPrint(
                '[ConversationThread] header avatar load failed '
                'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
                'error=$error',
              );
            },
          """
          header_new = """            onForegroundImageError: _otherParticipantPhotoUrl.isNotEmpty
                ? (error, stackTrace) {
                    debugPrint(
                      '[ConversationThread] header avatar load failed '
                      'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
                      'error=$error',
                    );
                  }
                : null,
          """
          if header_new not in text:
              count = text.count(header_old)
              if count != 1:
                  raise SystemExit(
                      f'Expected one header avatar callback, found {count}'
                  )
              text = text.replace(header_old, header_new)

          bubble_old = """      onForegroundImageError: (error, stackTrace) {
        debugPrint(
          '[ConversationThread] bubble avatar load failed '
          'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
          'error=$error',
        );
      },
          """
          bubble_new = """      onForegroundImageError: _otherParticipantPhotoUrl.isNotEmpty
          ? (error, stackTrace) {
              debugPrint(
                '[ConversationThread] bubble avatar load failed '
                'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
                'error=$error',
              );
            }
          : null,
          """
          if bubble_new not in text:
              count = text.count(bubble_old)
              if count != 1:
                  raise SystemExit(
                      f'Expected one bubble avatar callback, found {count}'
                  )
              text = text.replace(bubble_old, bubble_new)
          source.write_text(text)

          test = Path('test/pages/messages/conversation_thread_page_shell_test.dart')
          test_text = test.read_text()
          drain = """void _drainExpectedConversationThreadExceptions(WidgetTester tester) {
  Object? exception;
  while ((exception = tester.takeException()) != null) {
    final message = exception.toString();
    final isExpectedCircleAvatarAssertion =
        message.contains('circle_avatar.dart') &&
        message.contains(
          'foregroundImage != null || onForegroundImageError == null',
        );
    if (!isExpectedCircleAvatarAssertion) {
      throw exception!;
    }
  }
}

          """
          test_text = test_text.replace(drain, '')
          test_text = test_text.replace(
              '  _drainExpectedConversationThreadExceptions(tester);\n',
              '',
          )
          test.write_text(test_text)
          PY

          git checkout origin/main -- \
            .github/workflows/dart-format-quality.yml \
            .github/workflows/pr-validation.yml
          git diff --check

          if git diff --quiet; then
            echo 'Repair already applied.'
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/pages/messages/conversation_thread_page.dart \
            test/pages/messages/conversation_thread_page_shell_test.dart \
            .github/workflows/dart-format-quality.yml \
            .github/workflows/pr-validation.yml
          git commit -m 'fix(messages): guard empty conversation avatars'
          git push origin HEAD:repair/pr451-complete
