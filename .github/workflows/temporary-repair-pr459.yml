name: Temporary repair PR459

on:
  push:
    branches: [main]
    paths:
      - tools/repair_pr459.py
      - .github/repair-pr459-run.trigger
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: temporary-repair-pr459
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.number == 459 &&
       github.event.comment.body == '/repair-pr459-20260716')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: repair/pr451-complete
          fetch-depth: 0

      - name: Apply deterministic repair
        id: repair_step
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            git fetch origin \
              +refs/heads/main:refs/remotes/origin/main \
              +refs/heads/repair/pr451-complete:refs/remotes/origin/repair/pr451-complete
            git switch -C repair/pr451-complete refs/remotes/origin/repair/pr451-complete

            git show origin/main:tools/repair_pr459.py > /tmp/repair_pr459.py
            python3 /tmp/repair_pr459.py

            git show ae64f4c081b4ee4b84a029c7d4c7a9dee9d98a4a:.github/workflows/dart-format-quality.yml \
              > .github/workflows/dart-format-quality.yml
            git show ae64f4c081b4ee4b84a029c7d4c7a9dee9d98a4a:.github/workflows/pr-validation.yml \
              > .github/workflows/pr-validation.yml

            rm -f \
              .github/pr459-repair.trigger \
              .github/pr459-native-sync-final.trigger \
              .github/repair-pr459-main.trigger \
              .github/repair-pr459-native-trigger-2 \
              .github/pr459-api-repair.trigger

            git diff --check
            if git diff --quiet; then
              echo 'Repair already applied.'
              exit 0
            fi

            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m 'fix(messages): guard empty conversation avatars'
            git push origin HEAD:repair/pr451-complete
          } 2>&1 | tee /tmp/pr459-repair.log

      - name: Report repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_OUTCOME: ${{ steps.repair_step.outcome }}
        shell: bash
        run: |
          {
            echo "### Réparation déterministe PR459 : ${REPAIR_OUTCOME}"
            echo
            echo '```text'
            tail -n 100 /tmp/pr459-repair.log 2>/dev/null || true
            echo '```'
          } > /tmp/pr459-repair-comment.md
          gh pr comment 459 --body-file /tmp/pr459-repair-comment.md
          test "$REPAIR_OUTCOME" = success

  repair_gratuit_pro:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 479 &&
       github.event.comment.body == '/repair-gratuit-pro-479-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Gratuit Pro correction
        id: gratuit_pro_step
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git switch -C fix/gratuit-pro-final-479 refs/remotes/origin/main

            python3 - <<'PY'
            from pathlib import Path

            def replace_once(text: str, old: str, new: str, label: str) -> str:
                count = text.count(old)
                if count != 1:
                    raise SystemExit(f'{label}: expected one match, found {count}')
                return text.replace(old, new)

            source = Path('lib/features/subscriptions/subscription_widgets_base.dart')
            text = source.read_text()

            text = replace_once(
                text,
                "          : plan.plan == SubscriptionPlan.ilipro;",
                "          : plan.plan == SubscriptionPlan.free ||\n"
                "              plan.plan == SubscriptionPlan.ilipro;",
                'Pro audience filter',
            )
            text = replace_once(
                text,
                """          _PlanCard(
              presentation: plans[i],
              currentPlan: userState.plan,
              config: config,
            ),""",
                """          _PlanCard(
              presentation: plans[i],
              currentPlan: userState.plan,
              config: config,
              audience: audience,
            ),""",
                'PlanCard audience argument',
            )
            text = replace_once(
                text,
                """class _PlanCard extends StatelessWidget {
  final _PlanPresentation presentation;
  final SubscriptionPlan currentPlan;
  final SubscriptionAppConfig config;

  const _PlanCard({
    required this.presentation,
    required this.currentPlan,
    required this.config,
  });""",
                """class _PlanCard extends StatelessWidget {
  final _PlanPresentation presentation;
  final SubscriptionPlan currentPlan;
  final SubscriptionAppConfig config;
  final OfferAudience audience;

  const _PlanCard({
    required this.presentation,
    required this.currentPlan,
    required this.config,
    required this.audience,
  });""",
                'PlanCard fields',
            )
            text = replace_once(
                text,
                """    final isCurrent = presentation.plan == currentPlan;
    final isFree = presentation.plan == SubscriptionPlan.free;""",
                """    final isCurrent = presentation.plan == currentPlan;
    final isFree = presentation.plan == SubscriptionPlan.free;
    final isProFree = isFree && audience == OfferAudience.pro;""",
                'Gratuit Pro state',
            )
            text = replace_once(
                text,
                "                          presentation.title,",
                "                          isProFree ? 'Gratuit Pro' : presentation.title,",
                'Gratuit Pro title',
            )
            text = replace_once(
                text,
                "                      presentation.summary,",
                """                      isProFree
                            ? 'L’essentiel pour commencer une activité professionnelle sur iliprestō.'
                            : presentation.summary,""",
                'Gratuit Pro summary',
            )
            text = replace_once(
                text,
                "                      _buttonLabel(presentation.plan),",
                """                      isProFree
                            ? 'Choisir Gratuit Pro'
                            : _buttonLabel(presentation.plan),""",
                'Gratuit Pro button',
            )
            source.write_text(text)

            test = Path('test/features/subscriptions/subscription_widgets_base_journey_test.dart')
            test_text = test.read_text()
            test_text = replace_once(
                test_text,
                """    expect(find.text('Choisir ilipro'), findsOneWidget);
    expect(find.text('Choisir iliprestō+'), findsNothing);""",
                """    expect(find.text('Gratuit Pro'), findsOneWidget);
    expect(find.text('ilipro'), findsOneWidget);
    expect(find.text('Choisir ilipro'), findsOneWidget);
    expect(find.text('Choisir iliprestō+'), findsNothing);""",
                'Pro offer assertions',
            )
            test.write_text(test_text)

            Path('.github/workflows/temporary-gratuit-pro-479.yml').unlink(missing_ok=True)
            PY

            git diff --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m 'fix(subscriptions): afficher l’offre Gratuit Pro'
            git push --force-with-lease origin HEAD:fix/gratuit-pro-final-479
          } 2>&1 | tee /tmp/gratuit-pro-479.log

      - name: Report Gratuit Pro repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_OUTCOME: ${{ steps.gratuit_pro_step.outcome }}
        shell: bash
        run: |
          {
            echo "### Réparation Gratuit Pro : ${REPAIR_OUTCOME}"
            echo
            echo '```text'
            tail -n 100 /tmp/gratuit-pro-479.log 2>/dev/null || true
            echo '```'
          } > /tmp/gratuit-pro-479-comment.md
          gh issue comment 479 --body-file /tmp/gratuit-pro-479-comment.md
          test "$REPAIR_OUTCOME" = success
