name: Temporary repair PR459

on:
  push:
    branches: [main]
    paths:
      - tools/repair_pr459.py
      - .github/repair-pr459-run.trigger
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: temporary-repair-pr459
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.number == 459 &&
       github.event.comment.body == '/repair-pr459-20260716')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: repair/pr451-complete
          fetch-depth: 0

      - name: Apply deterministic repair
        id: repair_step
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            git fetch origin \
              +refs/heads/main:refs/remotes/origin/main \
              +refs/heads/repair/pr451-complete:refs/remotes/origin/repair/pr451-complete
            git switch -C repair/pr451-complete refs/remotes/origin/repair/pr451-complete

            git show origin/main:tools/repair_pr459.py > /tmp/repair_pr459.py
            python3 /tmp/repair_pr459.py

            git show ae64f4c081b4ee4b84a029c7d4c7a9dee9d98a4a:.github/workflows/dart-format-quality.yml \
              > .github/workflows/dart-format-quality.yml
            git show ae64f4c081b4ee4b84a029c7d4c7a9dee9d98a4a:.github/workflows/pr-validation.yml \
              > .github/workflows/pr-validation.yml

            rm -f \
              .github/pr459-repair.trigger \
              .github/pr459-native-sync-final.trigger \
              .github/repair-pr459-main.trigger \
              .github/repair-pr459-native-trigger-2 \
              .github/pr459-api-repair.trigger

            git diff --check
            if git diff --quiet; then
              echo 'Repair already applied.'
              exit 0
            fi

            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m 'fix(messages): guard empty conversation avatars'
            git push origin HEAD:repair/pr451-complete
          } 2>&1 | tee /tmp/pr459-repair.log

      - name: Report repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_OUTCOME: ${{ steps.repair_step.outcome }}
        shell: bash
        run: |
          {
            echo "### Réparation déterministe PR459 : ${REPAIR_OUTCOME}"
            echo
            echo '```text'
            tail -n 100 /tmp/pr459-repair.log 2>/dev/null || true
            echo '```'
          } > /tmp/pr459-repair-comment.md
          gh pr comment 459 --body-file /tmp/pr459-repair-comment.md
          test "$REPAIR_OUTCOME" = success
