name: 18-Point Sequential Supervisor

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Surveiller ou demander la promotion du point actif"
        required: true
        default: monitor
        type: choice
        options:
          - monitor
          - advance
  schedule:
    - cron: "30 5 * * *"
  push:
    branches:
      - main
    paths:
      - "quality/**"
      - "docs/evidence/**"
      - "docs/product/**"
      - "docs/design/**"
      - "docs/governance/**"
      - "tools/quality/check_18_point_completion.mjs"
      - "tools/quality/check_18_point_completion.test.mjs"
      - ".github/workflows/18-point-supervisor.yml"
  pull_request:
    paths:
      - "quality/**"
      - "docs/evidence/**"
      - "docs/product/**"
      - "docs/design/**"
      - "docs/governance/**"
      - "tools/quality/check_18_point_completion.mjs"
      - "tools/quality/check_18_point_completion.test.mjs"
      - ".github/workflows/18-point-supervisor.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: 18-point-supervisor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    name: Contrôler la séquence et publier le rapport
    runs-on: ubuntu-latest
    outputs:
      active_id: ${{ steps.state.outputs.active_id }}
      active_name: ${{ steps.state.outputs.active_name }}
      profile: ${{ steps.state.outputs.profile }}
      all_verified: ${{ steps.state.outputs.all_verified }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Tester le moteur du superviseur
        run: node tools/quality/check_18_point_completion.test.mjs

      - name: Analyser le registre séquentiel
        run: |
          mkdir -p quality_reports/18-point
          node tools/quality/check_18_point_completion.mjs \
            --json \
            --report-path quality_reports/18-point/status.md \
            > quality_reports/18-point/state.json

      - name: Exposer le point actif
        id: state
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('quality_reports/18-point/state.json', 'utf8'));
          console.log(`active_id=${state.activePoint?.id ?? ''}`);
          console.log(`active_name=${state.activePoint?.name ?? ''}`);
          console.log(`profile=${state.activePoint?.environmentProfile ?? 'none'}`);
          console.log(`all_verified=${state.allVerified}`);
          NODE

      - name: Ajouter le rapport au résumé GitHub Actions
        run: cat quality_reports/18-point/status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Archiver le rapport de supervision
        uses: actions/upload-artifact@v7
        with:
          name: 18-point-status-${{ github.run_id }}
          path: quality_reports/18-point
          if-no-files-found: error
          retention-days: 90

      - name: Créer ou actualiser l issue de suivi
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "[Agent 18/18] Supervision séquentielle iliprestō"
        shell: bash
        run: |
          set -euo pipefail
          issue_number=$(
            gh issue list --state open --limit 100 --json number,title \
              | jq -r --arg title "$TITLE" '.[] | select(.title == $title) | .number' \
              | head -n 1
          )

          if [ -z "$issue_number" ]; then
            gh issue create \
              --title "$TITLE" \
              --body-file quality_reports/18-point/status.md \
              --assignee "${{ github.repository_owner }}"
          else
            gh issue edit "$issue_number" \
              --title "$TITLE" \
              --body-file quality_reports/18-point/status.md
          fi

  advance:
    name: Valider puis préparer le point suivant
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'advance' &&
      needs.monitor.outputs.all_verified != 'true'
    needs: monitor
    runs-on: ubuntu-latest
    environment: recaptcha
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Flutter 3.44.6
        if: >-
          needs.monitor.outputs.profile == 'flutter' ||
          needs.monitor.outputs.profile == 'full' ||
          needs.monitor.outputs.profile == 'mobile'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Préparer Flutter
        if: >-
          needs.monitor.outputs.profile == 'flutter' ||
          needs.monitor.outputs.profile == 'full' ||
          needs.monitor.outputs.profile == 'mobile'
        run: |
          flutter config --enable-web
          flutter pub get

      - name: Installer les dépendances Functions
        if: needs.monitor.outputs.profile == 'full'
        run: npm --prefix functions ci

      - name: Installer Firebase CLI pour les profils complets
        if: needs.monitor.outputs.profile == 'full'
        run: npm install -g firebase-tools@13

      - name: Valider toutes les preuves et promouvoir localement
        run: |
          mkdir -p quality_reports/18-point
          node tools/quality/check_18_point_completion.mjs \
            --promote \
            --json \
            --report-path quality_reports/18-point/promotion.md \
            > quality_reports/18-point/promotion-state.json

      - name: Créer la PR de promotion séquentielle
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_ID: ${{ needs.monitor.outputs.active_id }}
          ACTIVE_NAME: ${{ needs.monitor.outputs.active_name }}
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/18-point-promote-${ACTIVE_ID}-${GITHUB_RUN_ID}"
          next_id=$((ACTIVE_ID + 1))

          git config user.name "ilipresto-18-point-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add quality/18-point-completion.json
          git commit -m "chore(quality): valider le point ${ACTIVE_ID} et activer le suivant"
          git push origin "$branch"

          if [ "$ACTIVE_ID" -eq 18 ]; then
            title="Clore le programme 18/18 à 100 %"
            next_text="aucun : le programme est terminé"
          else
            title="Valider le point ${ACTIVE_ID} et activer le point ${next_id}"
            next_text="point ${next_id}"
          fi

          {
            echo "## Promotion produite par l’agent séquentiel"
            echo
            echo "- Point validé : **${ACTIVE_ID}. ${ACTIVE_NAME}**"
            echo "- Prochaine étape : **${next_text}**"
            echo "- Toutes les preuves, registres et commandes du point actif ont réussi."
            echo "- Le point suivant ne devient actif sur \`main\` qu’après fusion de cette PR."
            echo
            cat quality_reports/18-point/promotion.md
          } > /tmp/promotion-pr.md

          gh pr create \
            --base main \
            --head "$branch" \
            --title "$title" \
            --body-file /tmp/promotion-pr.md

  lot3-account-cleanup:
    name: Lot 3 — nettoyer account_page sans masque unused
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'refactor/lot3-account-unused-probe-20260807'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branche Lot 3
        uses: actions/checkout@v7
        with:
          ref: refactor/lot3-account-unused-probe-20260807
          fetch-depth: 0

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Appliquer et valider le nettoyage ciblé
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/pages/account_page.dart')
          text = path.read_text()
          header = '// ignore_for_file: unused_element, unused_field, unused_local_variable, unused_element_parameter\n\n'
          if not text.startswith(header):
              raise SystemExit('Unexpected account_page.dart unused ignore header')
          text = text[len(header):]
          dead = """    final visibleEmail = _profileEmail.trim().isNotEmpty
        ? _profileEmail.trim()
        : (user.email ?? '');
"""
          count = text.count(dead)
          if count != 1:
              raise SystemExit(f'visibleEmail block: expected exactly one occurrence, found {count}')
          path.write_text(text.replace(dead, '', 1))
          PY

          flutter pub get
          flutter analyze --fatal-infos lib/pages/account_page.dart
          flutter test \
            test/pages/account_page_auth_shell_test.dart \
            test/pages/account_page_signed_in_shell_test.dart
          dart format --output=none --set-exit-if-changed lib/pages/account_page.dart
          git diff --check

          if grep -q '^// ignore_for_file: .*unused_' lib/pages/account_page.dart; then
            echo 'unused_* file-level suppression still present in account_page.dart'
            exit 1
          fi

      - name: Nettoyer les outils temporaires et publier le patch validé
        shell: bash
        run: |
          set -euo pipefail

          rm -f .github/workflows/lot3-account-unused-probe.yml
          rm -f docs/quality/lot3-account-unused-probe.md
          rm -f docs/quality/lot3-account-unused-cascade-probe.md
          rm -f docs/quality/lot3-account-cleanup-validation.md

          python3 - <<'PY'
          from pathlib import Path
          Path('docs/quality/lot3-dead-code-tranche7-account-unused.md').write_text('''# Lot 3 — Code mort, tranche 7 — compte\n\nBase : `f873b0845f9ca691e9e7bba1ac23e5a938af9221`.\n\n## Cible\n\n`lib/pages/account_page.dart`\n\n## Preuve de code mort\n\nUne sonde Flutter 3.44.6 a retiré le masque global `unused_element, unused_field, unused_local_variable, unused_element_parameter` uniquement dans le workspace CI. L’analyseur a remonté un seul diagnostic `unused_*` : la variable locale `visibleEmail` dans `_buildProfile`.\n\n`_profileEmail` reste réellement lu lors de l’hydratation du profil (`fallbackValues`), donc la suppression de `visibleEmail` ne neutralise pas la gestion de l’adresse e-mail du profil.\n\nLe correctif supprime uniquement `visibleEmail` et retire le masque global `unused_*` de ce fichier.\n\n## Validation ciblée\n\n- `flutter analyze --fatal-infos lib/pages/account_page.dart` : succès ;\n- deux tests de shell compte : succès ;\n- `dart format --output=none --set-exit-if-changed lib/pages/account_page.dart` : succès ;\n- `git diff --check` : succès ;\n- absence de `ignore_for_file` contenant `unused_*` dans `account_page.dart` : confirmée.\n\n## Garde-fous\n\n- aucune route, Auth, App Check, Firebase, Firestore, Functions ou deep link modifiée ;\n- aucun seuil qualité abaissé ;\n- aucun skip/exclusion ajouté ;\n- aucune mission LCOV créée ou relancée.\n''')
          PY

          git checkout f873b0845f9ca691e9e7bba1ac23e5a938af9221 -- \
            .github/workflows/18-point-supervisor.yml \
            .github/workflows/dart-format-quality.yml

          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/18-point-supervisor.yml',
              '.github/workflows/dart-format-quality.yml',
              '.github/workflows/lot3-account-unused-probe.yml',
              'docs/quality/lot3-account-unused-probe.md',
              'docs/quality/lot3-account-unused-cascade-probe.md',
              'docs/quality/lot3-account-cleanup-validation.md',
              'docs/quality/lot3-dead-code-tranche7-account-unused.md',
              'lib/pages/account_page.dart',
          }
          changed = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()))
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected files in Lot 3 cleanup: {unexpected}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(lot3): retirer le masque unused du compte'
          git push origin HEAD:refactor/lot3-account-unused-probe-20260807
