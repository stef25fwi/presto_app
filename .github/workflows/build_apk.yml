name: Build APK Android (arm64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    environment: recaptcha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode Google Credentials
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
        run: |
          printf "%s" "$GOOGLE_CREDENTIALS_B64" \
            | tr -d '\r\n[:space:]' \
            | base64 -d > "$RUNNER_TEMP/google-credentials.json"
          python3 -m json.tool "$RUNNER_TEMP/google-credentials.json" >/dev/null
          echo "GOOGLE_CREDENTIALS_JSON<<HEREDOC_EOF" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/google-credentials.json" >> "$GITHUB_ENV"
          echo "HEREDOC_EOF" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ env.GOOGLE_CREDENTIALS_JSON }}'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --fatal-infos

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          printf "%s" "$KEYSTORE_B64" \
            | tr -d '\r\n[:space:]' \
            | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          SIZE=$(stat -c%s "$RUNNER_TEMP/upload-keystore.jks" 2>/dev/null || echo 0)
          if [[ "$SIZE" -lt 100 ]]; then
            echo "❌ Keystore trop petit (${SIZE} octets) — KEYSTORE_B64 vide ou invalide"
            exit 1
          fi
          echo "✅ Keystore décodé (${SIZE} octets)"

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storeType=JKS
          EOF
          echo "✅ key.properties écrit"

      - name: Verify keystore alias
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/upload-keystore.jks" \
            -storetype JKS \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" \
            -v 2>&1 | head -20
          echo "✅ Alias ${KEY_ALIAS} trouvé dans le keystore JKS"

      - name: Build APK arm64 release
        run: |
          STAMP=$(date -u +%Y%m%d_%H%M%S)
          SHA=$(git rev-parse --short=8 HEAD)
          APK_NAME="ilipresto_arm64_release_${STAMP}_${SHA}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          bash tools/flutter_with_build_stamp.sh build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi

      - name: Upload Gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs-failure
          path: |
            ~/.gradle/daemon/**/*.log
            build/app/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/${APK_NAME}.apk"
          echo "✅ APK : dist/${APK_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}.apk
          retention-days: 30
