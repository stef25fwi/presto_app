name: Build APK Android (arm64)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-apk:
    environment: recaptcha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          # Workload Identity Federation : aucune clé de service account
          # stockée. Le jeton OIDC GitHub est échangé contre un jeton GCP
          # de courte durée (permission id-token: write requise).
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --fatal-infos

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Diagnostic secrets
          echo "KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD}"
          echo "KEY_PASSWORD length: ${#KEY_PASSWORD}"
          echo "KEY_ALIAS: ${KEY_ALIAS}"
          echo "KEYSTORE_B64 length: ${#KEYSTORE_B64}"
          if [[ -z "${KEYSTORE_PASSWORD}" ]]; then
            echo "❌ KEYSTORE_PASSWORD vide — secret non configuré dans l'environnement recaptcha"
            exit 1
          fi
          if [[ "${#KEYSTORE_PASSWORD}" -lt 6 ]]; then
            echo "❌ KEYSTORE_PASSWORD trop court (${#KEYSTORE_PASSWORD} chars < 6)"
            exit 1
          fi

          # 1. Décode le keystore brut
          printf "%s" "$KEYSTORE_B64" \
            | tr -d '\r\n[:space:]' \
            | base64 -d > "$RUNNER_TEMP/upload-keystore-raw.jks"
          SIZE=$(stat -c%s "$RUNNER_TEMP/upload-keystore-raw.jks" 2>/dev/null || echo 0)
          if [[ "$SIZE" -lt 100 ]]; then
            echo "❌ Keystore trop petit (${SIZE} octets) — KEYSTORE_B64 vide ou invalide"
            exit 1
          fi
          MAGIC=$(xxd -l 4 -p "$RUNNER_TEMP/upload-keystore-raw.jks" | tr '[:upper:]' '[:lower:]')
          echo "📦 Keystore brut : ${SIZE} octets, magic=${MAGIC}"

          # 2. Convertit en JKS quel que soit le format source
          echo "🔄 Conversion en JKS..."
          keytool -importkeystore \
            -srckeystore  "$RUNNER_TEMP/upload-keystore-raw.jks" \
            -destkeystore "$RUNNER_TEMP/upload-keystore.jks" \
            -deststoretype JKS \
            -srcstorepass  "${KEYSTORE_PASSWORD}" \
            -deststorepass "${KEYSTORE_PASSWORD}" \
            -noprompt 2>&1
          if [[ $? -ne 0 ]]; then
            echo "❌ Conversion JKS échouée. Regénère le keystore avec : bash android/generate_keystore.sh"
            exit 1
          fi
          NEW_MAGIC=$(xxd -l 4 -p "$RUNNER_TEMP/upload-keystore.jks" | tr '[:upper:]' '[:lower:]')
          echo "✅ Keystore JKS prêt (magic=${NEW_MAGIC})"

          # 3. Vérifie l'alias
          keytool -list \
            -keystore "$RUNNER_TEMP/upload-keystore.jks" \
            -storetype JKS \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" \
            -v 2>&1 | head -10
          echo "✅ Alias ${KEY_ALIAS} vérifié"

          # 4. Écrit key.properties
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storeType=JKS
          EOF
          echo "✅ key.properties écrit (storeType=JKS)"

      - name: Build APK arm64 release
        run: |
          STAMP=$(date -u +%Y%m%d_%H%M%S)
          SHA=$(git rev-parse --short=8 HEAD)
          APK_NAME="ilipresto_arm64_release_${STAMP}_${SHA}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          bash tools/flutter_with_build_stamp.sh build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi

      - name: Upload Gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-logs-failure
          path: |
            ~/.gradle/daemon/**/*.log
            build/app/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/${APK_NAME}.apk"
          echo "✅ APK : dist/${APK_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}.apk
          retention-days: 30
