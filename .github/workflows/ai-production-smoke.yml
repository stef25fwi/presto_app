name: AI production smoke

on:
  workflow_run:
    workflows:
      - Validate and Deploy Firebase
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: recaptcha
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVIDENCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout the exact deployed SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Assert evidence SHA consistency
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EVIDENCE_SHA"
          printf 'Evidence will be generated for deployed SHA %s\n' "$actual_sha"

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Install synthetic speech dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng

      - name: Install and build Functions
        run: |
          npm --prefix functions ci
          npm --prefix functions run build

      - name: Verify production Functions, Auth, App Check, fallback and logs
        env:
          PROJECT_ID: presto-app-74abe
          FUNCTIONS_REGION: europe-west1
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quality_reports/ai-production
          npm --prefix functions run ai:smoke:production \
            | tee quality_reports/ai-production/smoke.json
          npm --prefix functions run ai:metrics:report -- 14 \
            | tee quality_reports/ai-production/metrics.json
          npm --prefix functions run ai:metrics:trend -- \
            --days 30 --output ../quality_reports/ai-production/metrics-trend.json
          printf '%s\n' "$EVIDENCE_SHA" \
            > quality_reports/ai-production/deployed-sha.txt

      - name: Verify Remote Config rollback and restoration
        env:
          PROJECT_ID: presto-app-74abe
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions run ai:smoke:rollback \
            | tee quality_reports/ai-production/remote-config-rollback.json

      - name: Archive production AI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-production-smoke-${{ env.EVIDENCE_SHA }}
          path: quality_reports/ai-production
          if-no-files-found: error
          retention-days: 90
