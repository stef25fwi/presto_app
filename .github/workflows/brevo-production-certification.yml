name: Certify Brevo Production

on:
  workflow_dispatch:
    inputs:
      canary_recipient:
        description: 'Adresse canari de livraison E2E'
        required: false
        default: 'contact@ilipresto.fr'
        type: string
  workflow_run:
    workflows:
      - Validate and Deploy Firebase
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: brevo-production-certification
  cancel-in-progress: false

jobs:
  certify:
    name: Brevo production 100%
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: recaptcha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOYED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      CANARY_RECIPIENT: ${{ github.event_name == 'workflow_dispatch' && inputs.canary_recipient || 'contact@ilipresto.fr' }}
      BREVO_STATUS_CONTEXT: quality/brevo-production

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOYED_SHA }}

      - name: Mark Brevo certification pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload="$(node -e 'console.log(JSON.stringify({state:"pending",context:process.env.BREVO_STATUS_CONTEXT,description:"Certification Brevo production en cours",target_url:process.env.RUN_URL}))')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${DEPLOYED_SHA}" \
            --data "$payload" >/dev/null

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: presto-app-74abe

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Build and test email backend
        run: |
          npm --prefix functions run build
          npm --prefix functions test

      - name: Test Brevo through deployed Firebase runtime
        id: runtime_canary
        continue-on-error: true
        env:
          GOOGLE_CLOUD_PROJECT: presto-app-74abe
          GCLOUD_PROJECT: presto-app-74abe
          RUNTIME_CANARY_TIMEOUT_MS: '90000'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p quality
          node functions/scripts/brevo_runtime_canary.mjs 2>&1 | tee quality/brevo-runtime-canary.log

      - name: Resolve and validate Brevo credentials from Secret Manager
        shell: bash
        run: |
          set -euo pipefail

          runtime_ok=false
          if grep -q 'BREVO_RUNTIME_CANARY_RESULT={"ok":true' quality/brevo-runtime-canary.log 2>/dev/null; then
            runtime_ok=true
            echo 'Le runtime Firebase a fait accepter le canari par Brevo.'
          else
            echo 'Le runtime Firebase n a pas obtenu un envoi accepté ; diagnostic direct des credentials.'
            grep 'BREVO_RUNTIME_CANARY_RESULT=' quality/brevo-runtime-canary.log 2>/dev/null || true
          fi

          primary_api_key="$(gcloud secrets versions access latest --secret=BREVO_API_KEY --project=presto-app-74abe 2>/dev/null || true)"
          legacy_api_key="$(gcloud secrets versions access latest --secret=EMAIL_PROVIDER_API_KEY --project=presto-app-74abe 2>/dev/null || true)"
          webhook_secret="$(gcloud secrets versions access latest --secret=BREVO_WEBHOOK_SECRET --project=presto-app-74abe)"

          test -n "$webhook_secret"
          echo "::add-mask::$webhook_secret"
          [ -z "$primary_api_key" ] || echo "::add-mask::$primary_api_key"
          [ -z "$legacy_api_key" ] || echo "::add-mask::$legacy_api_key"

          valid_api_key=""
          valid_source=""
          for source in BREVO_API_KEY EMAIL_PROVIDER_API_KEY; do
            if [ "$source" = "BREVO_API_KEY" ]; then
              candidate="$primary_api_key"
            else
              candidate="$legacy_api_key"
            fi
            [ -n "$candidate" ] || continue

            http_code="$(curl --silent --show-error \
              --output /tmp/brevo-account-response.json \
              --write-out '%{http_code}' \
              -H 'accept: application/json' \
              -H "api-key: $candidate" \
              'https://api.brevo.com/v3/account' || true)"
            rm -f /tmp/brevo-account-response.json

            if [ "$http_code" = "200" ]; then
              valid_api_key="$candidate"
              valid_source="$source"
              break
            fi
            echo "Credential $source rejetée par Brevo depuis GitHub (HTTP $http_code)."
          done

          if [ -z "$valid_api_key" ]; then
            if [ "$runtime_ok" = true ]; then
              echo "::error::La clé Brevo fonctionne depuis Firebase mais l API Brevo rejette le runner GitHub. Une restriction IP Brevo est la cause probable ; la certification API doit être déplacée vers un runtime à egress contrôlé." >&2
              exit 4
            fi
            echo "::error::Brevo rejette la clé depuis GitHub et le runtime Firebase n obtient pas non plus d envoi accepté. La credential de production doit être remplacée." >&2
            exit 3
          fi

          if [ "$valid_source" != "BREVO_API_KEY" ]; then
            echo "Une ancienne credential valide a été trouvée dans $valid_source ; migration vers BREVO_API_KEY."
            printf '%s' "$valid_api_key" | gcloud secrets versions add BREVO_API_KEY \
              --project=presto-app-74abe \
              --data-file=- >/dev/null
          fi

          echo "BREVO_API_KEY=$valid_api_key" >> "$GITHUB_ENV"
          echo "BREVO_WEBHOOK_SECRET=$webhook_secret" >> "$GITHUB_ENV"
          echo "WEBHOOK_URL=https://europe-west1-presto-app-74abe.cloudfunctions.net/handleEmailProviderWebhook" >> "$GITHUB_ENV"
          echo "EMAIL_FROM=iliprestō <noreply@ilipresto.fr>" >> "$GITHUB_ENV"
          echo "EMAIL_REPLY_TO=contact@ilipresto.fr" >> "$GITHUB_ENV"
          echo "Credential Brevo validée via /v3/account : $valid_source."

      - name: Ensure Brevo webhook configuration
        run: bash scripts/create_brevo_webhook.sh

      - name: Verify secured production webhook
        run: |
          node functions/scripts/brevo_webhook_smoke_test.mjs \
            --url "$WEBHOOK_URL" \
            --secret "$BREVO_WEBHOOK_SECRET"

      - name: Repair and certify Brevo domain, sender, webhook and real delivery
        env:
          GOOGLE_CLOUD_PROJECT: presto-app-74abe
          GCLOUD_PROJECT: presto-app-74abe
        run: |
          node functions/scripts/brevo_production_audit.mjs \
            --domain ilipresto.fr \
            --sender noreply@ilipresto.fr \
            --reply-to contact@ilipresto.fr \
            --webhook-url "$WEBHOOK_URL" \
            --canary "$CANARY_RECIPIENT" \
            --repair \
            --e2e \
            --timeout-ms 180000 \
            --output quality/brevo-production-certification.json

      - name: Archive certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brevo-production-certification-${{ env.DEPLOYED_SHA }}-${{ github.run_id }}
          path: |
            quality/brevo-production-certification.json
            quality/brevo-runtime-canary.log
          if-no-files-found: warn
          retention-days: 90

      - name: Publish certification summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Brevo production certification'
            echo
            echo "- Commit déployé contrôlé : \`$DEPLOYED_SHA\`"
            echo '- Domaine : `ilipresto.fr`'
            echo '- Expéditeur : `noreply@ilipresto.fr`'
            echo '- Reply-To : `contact@ilipresto.fr`'
            echo '- Webhook : Bearer + événements transactionnels complets'
            echo "- Canary E2E : \`$CANARY_RECIPIENT\`"
            if [ -f quality/brevo-runtime-canary.log ]; then
              grep 'BREVO_RUNTIME_CANARY_RESULT=' quality/brevo-runtime-canary.log | tail -1 | sed 's/^/- Runtime Firebase : `/' | sed 's/$/`/' || true
            fi
            if [ -f quality/brevo-production-certification.json ]; then
              node -e 'const r=require("./quality/brevo-production-certification.json"); console.log(`- Certifié : **${r.certified ? "OUI" : "NON"}**`); for (const a of r.repairActions || []) console.log(`- 🔧 réparation: ${a}`); for (const c of r.checks) console.log(`- ${c.ok ? "✅" : "❌"} ${c.name}`);'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Brevo certification commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          if [ "$STATUS_STATE" = "success" ]; then
            description="Brevo production certifié E2E"
          else
            description="Certification Brevo production en échec"
          fi
          export description
          payload="$(node -e 'console.log(JSON.stringify({state:process.env.STATUS_STATE,context:process.env.BREVO_STATUS_CONTEXT,description:process.env.description,target_url:process.env.RUN_URL}))')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${DEPLOYED_SHA}" \
            --data "$payload" >/dev/null
