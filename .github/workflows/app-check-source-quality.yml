name: App Check source quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-check-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app-check-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test App Check audit
        run: node --test tools/quality/check_functions_app_check.test.mjs

      - name: Audit callable Functions
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p quality_reports/app-check
          node tools/quality/check_functions_app_check.mjs functions/src \
            2>&1 | tee quality_reports/app-check/report.json

      - name: Upload App Check audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-check-source-audit-${{ github.sha }}
          path: quality_reports/app-check/report.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce App Check audit
        if: always()
        run: |
          if [ '${{ steps.audit.outcome }}' != 'success' ]; then
            echo 'App Check source audit failed. Download the audit artifact for details.'
            exit 1
          fi
