name: Parcours PDF visual QA

on:
  pull_request:
    paths:
      - 'lib/services/journey_pdf_export_service.dart'
      - 'test/services/journey_pdf_export_service_test.dart'
      - 'docs/menu_activite_statuts/**'
      - '.github/workflows/parcours-pdf-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate visual PDF sample
        id: pdf_test
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/quality
          set -o pipefail
          flutter test test/services/journey_pdf_export_service_test.dart --reporter expanded \
            2>&1 | tee build/quality/parcours-guide-visual-test.log
      - name: Install PDF renderer
        if: always() && hashFiles('build/quality/parcours-guide-visual-sample.pdf') != ''
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Inspect and render sample
        if: always() && hashFiles('build/quality/parcours-guide-visual-sample.pdf') != ''
        run: |
          mkdir -p build/quality/parcours-guide-pages
          pdfinfo build/quality/parcours-guide-visual-sample.pdf | tee build/quality/parcours-guide-pdfinfo.txt
          pdftoppm -png -f 1 -l 6 -r 120 \
            build/quality/parcours-guide-visual-sample.pdf \
            build/quality/parcours-guide-pages/page
          test -s build/quality/parcours-guide-pages/page-1.png
      - name: Upload PDF, rendered pages and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parcours-pdf-visual-qa
          if-no-files-found: error
          path: |
            build/quality/parcours-guide-visual-test.log
            build/quality/parcours-guide-visual-sample.pdf
            build/quality/parcours-guide-pdfinfo.txt
            build/quality/parcours-guide-pages/*.png
          retention-days: 30
      - name: Enforce visual sample generation
        if: always() && steps.pdf_test.outcome != 'success'
        run: exit 1
