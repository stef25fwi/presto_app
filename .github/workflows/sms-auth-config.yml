name: Firebase Phone Auth SMS Config

on:
  pull_request:
    paths:
      - 'tools/firebase/ensure_phone_auth_config.sh'
      - '.github/workflows/sms-auth-config.yml'
      - 'lib/services/phone_verification_service.dart'
      - 'lib/services/auth_error_mapper.dart'
      - 'test/services/phone_verification_service_test.dart'
      - 'test/services/auth_error_mapper_test.dart'
  push:
    branches:
      - main
    paths:
      - 'tools/firebase/ensure_phone_auth_config.sh'
      - '.github/workflows/sms-auth-config.yml'
      - 'android/app/google-services.json'
      - 'lib/services/phone_verification_service.dart'
      - 'lib/services/auth_error_mapper.dart'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-phone-auth-config
  cancel-in-progress: false

jobs:
  validate-script:
    name: Validate SMS config guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell syntax
        run: bash -n tools/firebase/ensure_phone_auth_config.sh

  apply-production:
    name: Apply production Phone Auth config
    if: github.event_name != 'pull_request'
    needs: validate-script
    environment: recaptcha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve release signing fingerprints
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          if [[ -z "${KEYSTORE_B64:-}" || -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" ]]; then
            echo "::error::Secrets KEYSTORE_B64 / KEYSTORE_PASSWORD / KEY_ALIAS manquants dans l'environnement recaptcha."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" \
            | tr -d '\r\n[:space:]' \
            | base64 -d > "$RUNNER_TEMP/ilipresto-release-keystore"

          fingerprints="$(keytool -list -v \
            -keystore "$RUNNER_TEMP/ilipresto-release-keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS")"

          sha1="$(printf '%s\n' "$fingerprints" \
            | awk -F': ' '/^[[:space:]]*SHA1:/{print $2; exit}')"
          sha256="$(printf '%s\n' "$fingerprints" \
            | awk -F': ' '/^[[:space:]]*SHA256:/{print $2; exit}')"

          if [[ -z "$sha1" || -z "$sha256" ]]; then
            echo "::error::Impossible d'extraire SHA-1/SHA-256 de la clé Android release."
            exit 1
          fi

          echo "ANDROID_RELEASE_SHA1=$sha1" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_SHA256=$sha256" >> "$GITHUB_ENV"
          echo "✅ Empreintes de la clé release résolues sans exposer le keystore."

      - name: Enable required Google APIs
        run: |
          gcloud services enable \
            identitytoolkit.googleapis.com \
            firebase.googleapis.com \
            --project=presto-app-74abe

      - name: Repair and certify Firebase Phone Auth
        run: bash tools/firebase/ensure_phone_auth_config.sh --apply

      - name: Summary
        if: always()
        run: |
          {
            echo '## Firebase Phone Auth SMS'
            echo
            echo '- Projet : `presto-app-74abe`'
            echo '- App Android : `fr.ilipresto.app`'
            echo '- Provider Phone : contrôle + réparation automatique'
            echo '- Régions SMS : France + territoires couverts par les indicatifs de l’app'
            echo '- SHA Android : migration des empreintes historiques + clé release actuelle'
            echo '- Objectif : Play Integrity (SHA-256) + fallback reCAPTCHA (SHA-1) opérationnels'
          } >> "$GITHUB_STEP_SUMMARY"
