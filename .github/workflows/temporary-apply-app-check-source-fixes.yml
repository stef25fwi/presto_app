name: Temporary apply App Check source fixes

on:
  push:
    branches:
      - agent/phase-8-app-check-source-gate

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-8-app-check-source-gate
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply central App Check policy
        run: node tools/temporary_apply_app_check_source_fixes.mjs

      - name: Run App Check source tests and audit
        run: |
          node --test tools/quality/check_functions_app_check.test.mjs
          node tools/quality/check_functions_app_check.mjs functions/src

      - name: Commit targeted source changes
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            functions/src/modules/auth/account_deletion.ts \
            functions/src/modules/messaging/callables.ts \
            functions/src/modules/monitoring/callables.ts \
            functions/src/modules/pro/preVerifySiret.ts \
            functions/src/modules/pro/verifySiret.ts
          git commit -m 'security: applique la policy App Check centrale aux callables'
          git push origin HEAD:agent/phase-8-app-check-source-gate
