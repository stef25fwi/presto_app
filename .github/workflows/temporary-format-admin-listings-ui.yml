name: Temporary format admin listings UI

on:
  push:
    branches:
      - agent/phase-5-admin-listings-management-ui-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-5-admin-listings-management-ui-v2
          fetch-depth: 0

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format new admin listing files
        run: |
          dart format \
            lib/admin/listings/admin_listing_record.dart \
            lib/admin/listings/admin_listings_management_page.dart \
            lib/admin/listings/admin_listings_repository.dart \
            test/admin/listings/admin_listing_record_test.dart \
            test/admin/listings/admin_listings_management_page_test.dart

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo 'No formatting change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/admin/listings/admin_listing_record.dart \
            lib/admin/listings/admin_listings_management_page.dart \
            lib/admin/listings/admin_listings_repository.dart \
            test/admin/listings/admin_listing_record_test.dart \
            test/admin/listings/admin_listings_management_page_test.dart
          git commit -m 'style: formate la gestion des annonces admin'
          git push origin HEAD:agent/phase-5-admin-listings-management-ui-v2
