name: Temporary fix curly braces analyzer 6

on:
  push:
    branches:
      - agent/phase-0-analyzer-ignore-6

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-analyzer-ignore-6
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply targeted curly-brace fixes
        run: node tools/temporary_fix_curly_braces_analyzer_6.mjs

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format targeted Dart files
        run: |
          dart format \
            lib/features/subscriptions/subscription_widgets.dart \
            lib/pages/fiche_pro_page.dart \
            lib/services/hero_slides_service.dart \
            lib/services/journey_pdf_export_service.dart \
            lib/services/value_analysis_service.dart

      - name: Commit targeted fixes
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/subscriptions/subscription_widgets.dart \
            lib/pages/fiche_pro_page.dart \
            lib/services/hero_slides_service.dart \
            lib/services/journey_pdf_export_service.dart \
            lib/services/value_analysis_service.dart
          git commit -m 'style: ajoute les accolades de contrôle manquantes'
          git push origin HEAD:agent/phase-0-analyzer-ignore-6
