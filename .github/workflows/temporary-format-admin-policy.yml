name: Temporary format admin policy

on:
  push:
    branches:
      - agent/phase-2-admin-bulk-deletion-policy

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-2-admin-bulk-deletion-policy
          fetch-depth: 0

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format admin policy files
        run: |
          dart format \
            lib/admin/shared/admin_bulk_deletion_policy.dart \
            test/admin/shared/admin_bulk_deletion_policy_test.dart

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo 'No formatting change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/admin/shared/admin_bulk_deletion_policy.dart \
            test/admin/shared/admin_bulk_deletion_policy_test.dart
          git commit -m 'style: formate la policy de suppression admin'
          git push origin HEAD:agent/phase-2-admin-bulk-deletion-policy
