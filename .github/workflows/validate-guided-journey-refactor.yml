name: Apply guided journey architecture fixes

on:
  push:
    branches:
      - feat/guided-personal-journey

permissions:
  contents: write

concurrency:
  group: validate-guided-personal-journey
  cancel-in-progress: true

jobs:
  apply-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[guided-refactor-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/guided-personal-journey
          fetch-depth: 0

      - name: Apply final type fixes
        run: python3 tools/fix_guided_journey_refactor.py

      - name: Enforce architecture budgets
        run: |
          python3 tools/quality/check_flutter_architecture_size.py \
            --changed-only \
            --base-ref main \
            --enforce

      - name: Commit architecture fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[guided-refactor-fixed] refactor(toolbox): split guided journey architecture"
          git push origin HEAD:feat/guided-personal-journey
