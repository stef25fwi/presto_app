name: Temporary account spacing cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup-spacing:
    if: github.head_ref == 'fix/account-header-profile-spacing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/account-header-profile-spacing
          fetch-depth: 0

      - name: Keep only the requested spacing changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/pages/account_page.dart')
          source = path.read_text(encoding='utf-8')

          completeness_start = source.find('Widget _buildProfileCompletenessBanner()')
          completeness_end = source.find('Future<bool> _saveProfile', completeness_start)
          if completeness_start < 0 or completeness_end < 0:
              raise SystemExit('Profile completeness section was not found')
          completeness = source[completeness_start:completeness_end]
          completeness = completeness.replace(
              'const SizedBox(height: 16),',
              'const SizedBox(height: 8),',
              1,
          )
          source = (
              source[:completeness_start]
              + completeness
              + source[completeness_end:]
          )

          top_old = 'padding: const EdgeInsets.fromLTRB(4, 0, 4, 6),'
          top_new = 'padding: const EdgeInsets.fromLTRB(4, 16, 4, 6),'
          if top_old in source:
              source = source.replace(top_old, top_new, 1)
          elif top_new not in source:
              raise SystemExit('Target top padding was not found')

          profile_marker = source.find("title: 'Mon profil'")
          if profile_marker < 0:
              raise SystemExit('Mon profil marker was not found')
          card_anchor = source.rfind('_buildAccountSectionCard(', 0, profile_marker)
          if card_anchor < 0:
              raise SystemExit('Mon profil card anchor was not found')
          matches = list(
              re.finditer(
                  r'const SizedBox\(height: (8|16)\),',
                  source[:card_anchor],
              )
          )
          if not matches:
              raise SystemExit('Spacing before Mon profil was not found')
          gap = matches[-1]
          source = source[:gap.start()] + 'const SizedBox(height: 16),' + source[gap.end():]

          path.write_text(source, encoding='utf-8')
          PY

          git diff --check
          if git diff --quiet -- lib/pages/account_page.dart; then
            echo 'Requested spacing is already clean.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/account_page.dart
          git commit -m 'fix(account): limite le correctif aux espacements demandés'
          git push origin HEAD:fix/account-header-profile-spacing
