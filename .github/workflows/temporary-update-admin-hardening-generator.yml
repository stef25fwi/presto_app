name: Temporary update admin hardening generator

on:
  push:
    branches:
      - agent/phase-1-format-admin-space-page

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-1-format-admin-space-page
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update hardening generator
        run: node tools/temporary_make_admin_hardening_format_tolerant.mjs

      - name: Verify hardening generator is idempotent
        run: |
          node tools/apply_prod_hardening_patches.mjs
          git diff -- lib/pages/admin_space_page.dart --exit-code

      - name: Commit generator update
        run: |
          git checkout -- lib/pages/admin_space_page.dart
          if git diff --quiet tools/apply_prod_hardening_patches.mjs; then
            echo 'No generator change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/apply_prod_hardening_patches.mjs
          git commit -m 'fix: rend le durcissement admin tolérant au formatage'
          git push origin HEAD:agent/phase-1-format-admin-space-page
