name: One-time Flutter dependency upgrade
# trigger: dependency-upgrade-2026-07-28

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-flutter-dependencies-once.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: one-time-flutter-dependency-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TRACKING_ISSUE: '1035'
    steps:
      - name: Report workflow start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "🚀 Mise à jour démarrée sur le commit $GITHUB_SHA. Installation de Flutter 3.44.6 et résolution des dépendances en cours."

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Report Flutter setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "✅ Flutter 3.44.6 installé. Audit et résolution avec \`flutter pub upgrade --major-versions\`."

      - name: Prepare dependency branch
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C chore/flutter-dependencies-2026-07 origin/main

      - name: Audit current dependencies
        run: flutter pub outdated || true

      - name: Upgrade Flutter dependencies
        run: |
          set -euo pipefail
          flutter pub upgrade --major-versions
          flutter pub get

      - name: Restrict generated changes
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if [ -z "$changed" ]; then
            echo 'No dependency update was produced.'
            exit 1
          fi
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(pubspec\.yaml|pubspec\.lock)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Report dependency resolution
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body '✅ Résolution terminée. Les changements générés sont limités à `pubspec.yaml` et `pubspec.lock`. Publication de la branche et de la PR.'

      - name: Publish draft dependency PR
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml pubspec.lock
          git commit -m 'chore: update Flutter dependencies'
          git push --force origin HEAD:chore/flutter-dependencies-2026-07

          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head chore/flutter-dependencies-2026-07 --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head chore/flutter-dependencies-2026-07 \
              --draft \
              --title 'chore: mettre à jour les dépendances Flutter' \
              --body $'## Mise à jour\n\n- résolution réelle avec `flutter pub upgrade --major-versions` sous Flutter 3.44.6 ;\n- modifications limitées à `pubspec.yaml` et `pubspec.lock` ;\n- analyse, tests complets et build Web exécutés après publication de cette PR.\n\nLa PR restera en brouillon tant que les validations ne sont pas toutes vertes.')"
            pr_number="${pr_url##*/}"
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "📦 PR #$pr_number publiée en brouillon. Analyse Flutter, tests complets et build Web en cours."

      - name: Analyze Flutter
        run: flutter analyze --fatal-infos

      - name: Test Flutter
        run: flutter test --reporter expanded

      - name: Build Flutter Web
        run: flutter build web --release --no-wasm-dry-run

      - name: Mark PR ready after successful validation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
        run: |
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body '✅ Dépendances résolues et validations terminées : analyse Flutter, tests complets et build Web réussis.'
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "✅ Mise à jour validée. La PR #$PR_NUMBER est prête à être fusionnée après les contrôles CI de branche."

      - name: Report validation failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
        run: |
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body '❌ La résolution des dépendances a été publiée, mais au moins une validation (analyse, tests ou build Web) a échoué. La PR reste en brouillon pour correction.'
          fi
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "❌ La mise à jour automatisée a échoué sur le commit $GITHUB_SHA. Consultez le workflow One-time Flutter dependency upgrade pour l’étape exacte."
