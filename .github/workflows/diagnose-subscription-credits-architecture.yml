name: Diagnose subscription credits architecture

on:
  push:
    branches:
      - agent/subscription-credits-dashboard

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, 'record subscription credits architecture') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/subscription-credits-dashboard
          fetch-depth: 0
      - name: Run architecture checker
        run: |
          python tools/quality/check_flutter_architecture_size.py \
            --changed-only --base-ref main \
            > quality/subscription_credits_architecture_report.txt || true
          cat quality/subscription_credits_architecture_report.txt
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality/subscription_credits_architecture_report.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record subscription credits architecture"
          git push origin HEAD:agent/subscription-credits-dashboard
