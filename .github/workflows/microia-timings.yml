name: Micro IA Timings (Cloud Logging)

# Lit les logs [microIaProcessAudio] TIMINGS depuis Cloud Logging pour
# diagnostiquer la latence du pipeline audio (downloadMs/ffmpegMs/sttMs/draftMs).
# Déclenchement manuel uniquement.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Fenêtre de recherche (heures)"
        required: false
        default: "6"
      limit:
        description: "Nombre max d'entrées"
        required: false
        default: "20"

permissions:
  contents: read
  id-token: write

jobs:
  read-timings:
    environment: recaptcha
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          # Workload Identity Federation : aucune clé de service account
          # stockée. Le jeton OIDC GitHub est échangé contre un jeton GCP
          # de courte durée (permission id-token: write requise).
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Read TIMINGS logs
        env:
          HOURS: ${{ inputs.hours }}
          LIMIT: ${{ inputs.limit }}
        run: |
          echo "═══ [microIaProcessAudio] TIMINGS (dernières ${HOURS}h, max ${LIMIT}) ═══"
          gcloud logging read \
            '"[microIaProcessAudio] TIMINGS"' \
            --project=presto-app-74abe \
            --freshness="${HOURS}h" \
            --limit="${LIMIT}" \
            --order=desc \
            --format='value(timestamp, textPayload, jsonPayload.message)'

          echo ""
          echo "═══ Entrées brutes JSON (pour les champs structurés) ═══"
          gcloud logging read \
            '"[microIaProcessAudio] TIMINGS"' \
            --project=presto-app-74abe \
            --freshness="${HOURS}h" \
            --limit="${LIMIT}" \
            --order=desc \
            --format=json
