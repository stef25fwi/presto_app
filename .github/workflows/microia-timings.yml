name: Micro IA Timings (Cloud Logging)

# Lit les logs [microIaProcessAudio] TIMINGS depuis Cloud Logging pour
# diagnostiquer la latence du pipeline audio (downloadMs/ffmpegMs/sttMs/draftMs).
# Déclenchement manuel uniquement.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Fenêtre de recherche (heures)"
        required: false
        default: "6"
      limit:
        description: "Nombre max d'entrées"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  read-timings:
    environment: recaptcha
    runs-on: ubuntu-latest
    steps:
      - name: Decode Google Credentials
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_B64" ]; then
            echo "❌ GOOGLE_CREDENTIALS_B64 est vide."
            exit 1
          fi

          printf "%s" "$GOOGLE_CREDENTIALS_B64" \
            | tr -d '\r\n[:space:]' \
            | base64 -d > "$RUNNER_TEMP/google-credentials.json"

          python3 -m json.tool "$RUNNER_TEMP/google-credentials.json" >/dev/null
          echo "✅ Google credentials JSON décodé et validé"

          # Masque chaque ligne du JSON décodé : sans cela, la valeur exportée
          # dans GITHUB_ENV est imprimée en clair dans les dumps env: des logs.
          while IFS= read -r credentials_line; do
            if [ -n "$credentials_line" ]; then
              echo "::add-mask::$credentials_line"
            fi
          done < "$RUNNER_TEMP/google-credentials.json"

          echo "GOOGLE_CREDENTIALS_JSON<<HEREDOC_EOF" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/google-credentials.json" >> "$GITHUB_ENV"
          echo "HEREDOC_EOF" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ env.GOOGLE_CREDENTIALS_JSON }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Read TIMINGS logs
        env:
          HOURS: ${{ inputs.hours }}
          LIMIT: ${{ inputs.limit }}
        run: |
          echo "═══ [microIaProcessAudio] TIMINGS (dernières ${HOURS}h, max ${LIMIT}) ═══"
          gcloud logging read \
            '"[microIaProcessAudio] TIMINGS"' \
            --project=presto-app-74abe \
            --freshness="${HOURS}h" \
            --limit="${LIMIT}" \
            --order=desc \
            --format='value(timestamp, textPayload, jsonPayload.message)'

          echo ""
          echo "═══ Entrées brutes JSON (pour les champs structurés) ═══"
          gcloud logging read \
            '"[microIaProcessAudio] TIMINGS"' \
            --project=presto-app-74abe \
            --freshness="${HOURS}h" \
            --limit="${LIMIT}" \
            --order=desc \
            --format=json
