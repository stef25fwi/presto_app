name: Temporary wire admin messaging pagination

on:
  push:
    branches:
      - agent/phase-4-admin-messaging-pagination

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-4-admin-messaging-pagination
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Wire pagination
        run: node tools/temporary_wire_admin_messaging_pagination.mjs

      - name: Format changed Dart files
        run: |
          dart format \
            lib/admin/messaging/admin_messaging_pagination_policy.dart \
            lib/admin/messaging/services/admin_messaging_service.dart \
            test/admin/messaging/admin_messaging_pagination_policy_test.dart

      - name: Commit functional changes
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/admin/messaging/admin_messaging_pagination_policy.dart \
            lib/admin/messaging/services/admin_messaging_service.dart \
            test/admin/messaging/admin_messaging_pagination_policy_test.dart
          git commit -m 'perf: branche la pagination fiable de la messagerie admin'
          git push origin HEAD:agent/phase-4-admin-messaging-pagination
