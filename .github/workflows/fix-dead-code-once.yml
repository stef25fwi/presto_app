name: Fix dead code once

on:
  push:
    branches:
      - agent/phase-0-analyzer-ignore-5
    paths:
      - '.github/workflows/fix-dead-code-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-analyzer-ignore-5
          fetch-depth: 0

      - name: Remove unreachable return and temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/main.dart')
          content = path.read_text(encoding='utf-8')
          old = """    if (webPath == '/account') {
              pendingPostAuthRoute = null;
              return const HomePage(initialIndex: 4);
              return const HomePage();
            }
          """
          new = """    if (webPath == '/account') {
              pendingPostAuthRoute = null;
              return const HomePage(initialIndex: 4);
            }
          """
          if content.count(old) != 1:
              raise SystemExit(f'Expected exactly one dead-code block, found {content.count(old)}')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-dead-code-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart .github/workflows/fix-dead-code-once.yml
          git commit -m 'fix: supprime le retour inatteignable de account'
          git push origin HEAD:agent/phase-0-analyzer-ignore-5
