name: Reviews V2 legacy size fix

on:
  push:
    branches:
      - agent/reviews-v2-complete-mutual-flow

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reviews-v2-complete-mutual-flow
      - name: Remove obsolete debug-only lines from legacy offer screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/pages/user_offers_section.dart')
          text = p.read_text()
          removals = [
              "      debugPrint('Suppression offre ${item.offerId} avec motif: $reason');\n\n",
              "      debugPrint(\n          'Erreur callable suppression offre ${item.offerId}: ${e.code} ${e.message}');\n",
              "      debugPrint('Erreur suppression offre ${item.offerId}: $e');\n",
              "      debugPrint(\n        'Erreur clôture offre ${item.offerId}: ${e.code} ${e.message}',\n      );\n",
              "      debugPrint('Erreur clôture offre ${item.offerId}: $e');\n",
          ]
          for old in removals:
              if old not in text:
                  raise SystemExit(f'missing size-fix anchor: {old!r}')
              text = text.replace(old, '', 1)
          p.write_text(text)
          PY
          test "$(wc -l < lib/pages/user_offers_section.dart)" -le 3429
          git diff --check
      - name: Commit size fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/user_offers_section.dart
          git commit -m "fix(reviews): keep legacy offer screen within size budget"
          git push origin HEAD:agent/reviews-v2-complete-mutual-flow
