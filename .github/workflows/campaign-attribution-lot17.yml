name: Campaign attribution and deep links lot 17

on:
  workflow_run:
    workflows:
      - Validate and Deploy Firebase
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: SHA main à certifier, vide pour le SHA courant
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write
  issues: write
  statuses: write

concurrency:
  group: campaign-attribution-lot17
  cancel-in-progress: true

jobs:
  certify-campaign-links:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: recaptcha
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEPLOYED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha || github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOYED_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate lot 17 contract
        run: node tools/seo/campaign_attribution_lot17_contract.test.mjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Validate campaign attribution in Flutter
        run: |
          flutter test test/campaign_attribution_service_test.dart test/app_route_parser_test.dart
          flutter analyze --fatal-infos

      - name: Build Web for campaign links
        env:
          APPCHECK_RECAPTCHA_SITE_KEY: ${{ secrets.APPCHECK_RECAPTCHA_SITE_KEY }}
        run: bash tools/flutter_with_build_stamp.sh build web --release --no-wasm-dry-run

      - name: Generate signed Android and iOS associations
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret lot 17 manquant : $name"
              exit 1
            fi
          done

          RESOLVED_IOS_TEAM_ID="${IOS_TEAM_ID:-}"
          PROFILE_PATH=''
          PROFILE_PLIST=''

          if [[ -z "$RESOLVED_IOS_TEAM_ID" ]]; then
            if [[ -z "${IOS_PROVISIONING_PROFILE_B64:-}" ]]; then
              echo '::error::IOS_TEAM_ID absent et IOS_PROVISIONING_PROFILE_B64 indisponible.'
              exit 1
            fi

            PROFILE_PATH="$RUNNER_TEMP/lot17-profile.mobileprovision"
            PROFILE_PLIST="$RUNNER_TEMP/lot17-profile.plist"
            printf '%s' "$IOS_PROVISIONING_PROFILE_B64" \
              | tr -d '\r\n[:space:]' \
              | base64 -d > "$PROFILE_PATH"

            openssl smime -inform der -verify -noverify \
              -in "$PROFILE_PATH" \
              -out "$PROFILE_PLIST" >/dev/null 2>&1

            RESOLVED_IOS_TEAM_ID=$(python3 - "$PROFILE_PLIST" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], 'rb') as handle:
              profile = plistlib.load(handle)

          candidates = profile.get('TeamIdentifier') or profile.get('ApplicationIdentifierPrefix') or []
          team_id = candidates[0].strip() if candidates else ''
          if not team_id:
              raise SystemExit('Team ID iOS introuvable dans le profil de provisioning.')
          print(team_id)
          PY
            )
          fi

          if [[ ! "$RESOLVED_IOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo '::error::Team ID iOS invalide après résolution.'
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/lot17-upload-keystore"
          printf '%s' "$KEYSTORE_B64" \
            | tr -d '\r\n[:space:]' \
            | base64 -d > "$KEYSTORE_PATH"

          FINGERPRINT=$(keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | sed -n -E 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | head -n1)

          if [[ -z "$FINGERPRINT" ]]; then
            echo '::error::Empreinte SHA-256 Android introuvable.'
            exit 1
          fi

          node tools/seo/build_campaign_link_associations.mjs \
            --output-dir build/web/.well-known \
            --android-package fr.ilipresto.app \
            --android-sha256 "$FINGERPRINT" \
            --ios-app-id "$RESOLVED_IOS_TEAM_ID.fr.ilipresto.app"

          node tools/seo/prepare_campaign_attribution_hosting.mjs
          rm -f "$KEYSTORE_PATH" "$PROFILE_PATH" "$PROFILE_PLIST"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy signed association files to Hosting
        run: |
          firebase deploy \
            --project presto-app-74abe \
            --only hosting \
            --force

      - name: Verify lot 17 in production
        id: verify
        continue-on-error: true
        run: |
          node tools/seo/verify_campaign_attribution_lot17.mjs \
            --base-url https://ilipresto.fr \
            --commit-sha "$DEPLOYED_SHA" \
            --output build/seo/campaign-attribution-lot17-report.json \
            --markdown build/seo/campaign-attribution-lot17-report.md \
            --enforce

      - name: Publish report summary
        if: always()
        run: |
          if [[ -f build/seo/campaign-attribution-lot17-report.md ]]; then
            cat build/seo/campaign-attribution-lot17-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload lot 17 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: campaign-attribution-lot17-${{ env.DEPLOYED_SHA }}
          path: |
            build/seo/campaign-attribution-lot17-report.*
            build/web/.well-known/assetlinks.json
            build/web/.well-known/apple-app-site-association
          if-no-files-found: error
          retention-days: 90

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ steps.verify.outputs.state }}
          STATUS_DESCRIPTION: ${{ steps.verify.outputs.description }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE' > /tmp/lot17-status.json
          const payload = {
            state: process.env.STATUS_STATE || 'error',
            target_url: process.env.TARGET_URL,
            description: String(process.env.STATUS_DESCRIPTION || 'Lot 17 indisponible').slice(0, 140),
            context: 'quality/campaign-attribution-lot17',
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/lot17-status.json \
            "https://api.github.com/repos/$REPOSITORY/statuses/$DEPLOYED_SHA"

      - name: Open, update or close lot 17 issue
        if: always()
        uses: actions/github-script@v9
        env:
          DEPLOYED_SHA: ${{ env.DEPLOYED_SHA }}
        with:
          script: |
            const fs = require('fs');
            const title = '[SEO lot 17] Attribution UTM et deep links';
            const jsonPath = 'build/seo/campaign-attribution-lot17-report.json';
            const markdownPath = 'build/seo/campaign-attribution-lot17-report.md';
            const report = fs.existsSync(jsonPath)
              ? JSON.parse(fs.readFileSync(jsonPath, 'utf8'))
              : null;
            const markdown = fs.existsSync(markdownPath)
              ? fs.readFileSync(markdownPath, 'utf8')
              : '# Lot 17\n\nRapport absent.';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${markdown}\n---\nSHA : ${process.env.DEPLOYED_SHA}\nWorkflow : ${runUrl}\n`;
            const healthy = report?.status === 'available';
            if (!healthy && existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else if (!healthy) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Lot 17 validé : ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }

      - name: Enforce lot 17 certification
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'build/seo/campaign-attribution-lot17-report.json';
          if (!fs.existsSync(file)) process.exit(1);
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (report.status !== 'available') process.exit(1);
          console.log('Lot 17 Web, Android et iOS disponible.');
          NODE
