name: Temporary account header spacing

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  apply-spacing:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'fix/account-header-profile-spacing') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 478 &&
       github.event.comment.body == '/apply-account-header-spacing')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/account-header-profile-spacing
          fetch-depth: 0

      - name: Apply targeted spacing changes
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/pages/account_page.dart')
          source = path.read_text(encoding='utf-8')

          top_old = 'padding: const EdgeInsets.fromLTRB(4, 0, 4, 6),'
          top_new = 'padding: const EdgeInsets.fromLTRB(4, 16, 4, 6),'
          if top_old in source:
              source = source.replace(top_old, top_new, 1)
          elif top_new not in source:
              raise SystemExit('Target top padding was not found')

          profile_marker = "title: 'Mon profil'"
          marker_index = source.find(profile_marker)
          if marker_index < 0:
              raise SystemExit('Mon profil marker was not found')

          gap_old = 'const SizedBox(height: 8),'
          gap_new = 'const SizedBox(height: 16),'
          gap_index = source.rfind(gap_old, 0, marker_index)
          if gap_index >= 0:
              source = source[:gap_index] + gap_new + source[gap_index + len(gap_old):]
          elif source.rfind(gap_new, 0, marker_index) < 0:
              raise SystemExit('Target profile-to-card spacing was not found')

          path.write_text(source, encoding='utf-8')
          PY

            git diff --check
            if git diff --quiet -- lib/pages/account_page.dart; then
              echo 'Spacing already applied.'
              exit 0
            fi

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/pages/account_page.dart
            git commit -m 'fix(account): espace le profil sous le header'
            git push origin HEAD:fix/account-header-profile-spacing
          } 2>&1 | tee /tmp/account-spacing.log

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        shell: bash
        run: |
          {
            echo "### Correction espacement compte : ${APPLY_OUTCOME}"
            echo
            echo '```text'
            tail -n 120 /tmp/account-spacing.log 2>/dev/null || true
            echo '```'
          } > /tmp/account-spacing-comment.md
          gh pr comment 530 --body-file /tmp/account-spacing-comment.md
          test "$APPLY_OUTCOME" = success
