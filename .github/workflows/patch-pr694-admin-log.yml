name: Patch PR 694 admin log

on:
  push:
    branches:
      - coverage/w1-messaging-next-20260723
    paths:
      - .github/workflows/patch-pr694-admin-log.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: coverage/w1-messaging-next-20260723
          fetch-depth: 0
      - name: Defer admin log UI update safely
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('lib/pages/messages/conversations_list_page.dart')
          text = source.read_text()
          old = '''    final maxLines = _diagPanelVisible ? 40 : 12;
              setState(() {
                _adminConversationLoadLogs.insert(0, line);
                if (_adminConversationLoadLogs.length > maxLines) {
                  _adminConversationLoadLogs.removeRange(
                    maxLines,
                    _adminConversationLoadLogs.length,
                  );
                }
              });'''
          new = '''    final maxLines = _diagPanelVisible ? 40 : 12;
              WidgetsBinding.instance.addPostFrameCallback((_) {
                if (!mounted || !_diagPanelVisible) return;
                setState(() {
                  _adminConversationLoadLogs.insert(0, line);
                  if (_adminConversationLoadLogs.length > maxLines) {
                    _adminConversationLoadLogs.removeRange(
                      maxLines,
                      _adminConversationLoadLogs.length,
                    );
                  }
                });
              });'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one admin log block, found {text.count(old)}')
          source.write_text(text.replace(old, new))
          Path('.github/workflows/patch-pr694-admin-log.yml').unlink()
          PY
          dart format lib/pages/messages/conversations_list_page.dart test/pages/messages/conversations_list_admin_coverage_test.dart
      - name: Commit branch correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/messages/conversations_list_page.dart test/pages/messages/conversations_list_admin_coverage_test.dart .github/workflows/patch-pr694-admin-log.yml
          git commit -m "fix(messages): defer admin log updates after build"
          git push origin HEAD:coverage/w1-messaging-next-20260723
