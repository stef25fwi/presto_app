name: Firestore Emulator load test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-load-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  load-1000:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Prepare diagnostics
        run: mkdir -p load-tests/results

      - name: Run 1000 virtual sessions against Firestore Emulator
        id: load_test
        continue-on-error: true
        env:
          LOAD_VIRTUAL_USERS: '1000'
          LOAD_CONCURRENCY: '100'
          LOAD_PAGE_SIZE: '20'
          LOAD_MAX_ERROR_RATE: '0.01'
          LOAD_MAX_P95_MS: '2500'
        run: |
          set -o pipefail
          npm --prefix functions run test:load:1000 \
            2>&1 | tee load-tests/results/firestore-emulator-1000-users.log

      - name: Upload load-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firestore-emulator-load-${{ github.sha }}
          path: load-tests/results/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce load-test thresholds
        if: always()
        run: |
          if [ "${{ steps.load_test.outcome }}" != "success" ]; then
            echo "The Firestore Emulator load test failed. See the uploaded diagnostics."
            exit 1
          fi
