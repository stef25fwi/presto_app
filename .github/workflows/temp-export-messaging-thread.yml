name: Temporary export messaging thread

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'coverage/messaging-thread-massive-wave'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/upload-artifact@v7
        with:
          name: messaging-thread-source-${{ github.run_id }}
          path: |
            lib/pages/messages/conversation_thread_page.dart
            test/pages/messages/conversation_thread_page_smoke_test.dart
            test/pages/messages/conversation_thread_page_interactions_test.dart
            test/pages/messages/conversation_thread_page_shell_test.dart
            test/pages/messages/conversation_thread_page_confirmation_test.dart
            test/pages/messages/conversation_thread_avatar_source_test.dart
          retention-days: 1
