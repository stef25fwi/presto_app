name: Temporary patch parcours information preservation

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-patch-parcours-information-preservation.yml'
      - 'tools/temporary_patch_parcours_information_preservation.py'

permissions:
  contents: write

jobs:
  patch-information:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Apply information preservation patch
        run: python3 tools/temporary_patch_parcours_information_preservation.py
      - name: Format and commit
        run: |
          dart format lib/services/parcours_fiches_service.dart lib/services/journey_pdf_export_service.dart
          python3 -m json.tool docs/menu_activite_statuts/pack_fiches_fonctionnaire_firebase/json/fonctionnaire_aide_demenagement.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/services/parcours_fiches_service.dart \
            lib/services/journey_pdf_export_service.dart \
            docs/menu_activite_statuts/pack_fiches_fonctionnaire_firebase/json/fonctionnaire_aide_demenagement.json \
            docs/menu_activite_statuts/pack_fiches_fonctionnaire_firebase/markdown/fonctionnaire_aide_demenagement.md
          git diff --cached --quiet && exit 0
          git commit -m 'Préserve les informations et précise les risques du parcours'
          git push origin HEAD:agent/guide-parcours-pas-a-pas
