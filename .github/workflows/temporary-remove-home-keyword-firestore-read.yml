name: Temporary remove home keyword Firestore read

on:
  push:
    branches:
      - agent/phase-4-home-keywords-no-extra-read

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-4-home-keywords-no-extra-read
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply targeted optimization
        run: |
          node tools/temporary_remove_home_keyword_firestore_read.mjs
          dart format lib/pages/home_page.dart \
            lib/features/offers/home_offer_keywords.dart \
            test/features/offers/home_offer_keywords_test.dart

      - name: Commit targeted optimization
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/home_page.dart \
            lib/features/offers/home_offer_keywords.dart \
            test/features/offers/home_offer_keywords_test.dart
          git commit -m 'perf: dérive les mots-clés des offres déjà chargées'
          git push origin HEAD:agent/phase-4-home-keywords-no-extra-read
