name: Lot 3 consult offers unmask

on:
  push:
    branches:
      - refactor/lot3-consult-offers-unused-20260808

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/lot3-consult-offers-unused-20260808
          fetch-depth: 0

      - name: Remove local unused mask and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/pages/consult_offers_page.dart')
          text = path.read_text()
          needle = '// ignore_for_file: unused_element, unused_field, unused_local_variable\n\n'
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'Expected exactly one consult unused mask, found {count}')
          path.write_text(text.replace(needle, '', 1))
          PY
          rm .github/workflows/lot3-consult-offers-unmask.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/consult_offers_page.dart .github/workflows/lot3-consult-offers-unmask.yml
          git commit -m 'refactor(lot3): expose consult offers unused diagnostics'
          git push origin HEAD:refactor/lot3-consult-offers-unused-20260808
