name: Retry Firebase production deployment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/firebase-deploy-retry.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: firebase-production-retry
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for push-triggered deployment registration
        if: github.event_name == 'push'
        run: sleep 60

      - name: Dispatch clean Firebase deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "deploy_functions": "false"
            }
          }
          JSON
          echo 'Déploiement Firebase manuel propre déclenché sur main.' >> "$GITHUB_STEP_SUMMARY"
