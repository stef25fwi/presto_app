name: Recover guided journey

on:
  push:
    branches:
      - fix/guided-journey-clean

permissions:
  contents: write

concurrency:
  group: recover-guided-journey
  cancel-in-progress: true

jobs:
  recover:
    if: ${{ !contains(github.event.head_commit.message, '[guided-clean-recovered]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guided-journey-clean
          fetch-depth: 0

      - name: Fetch source branch
        run: git fetch origin feat/guided-personal-journey

      - name: Recover only guided journey files
        run: python3 tools/recover_guided_journey.py

      - name: Format recovered Dart files
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable

      - name: Apply Dart format
        run: dart format lib/features/guided_journey lib/pages/account/guided_journey_page.dart lib/pages/account/saved_journey_summary_page.dart test/guided_journey_page_test.dart test/guided_journey_visible_content_test.dart lib/pages/toolbox_je_me_lance_page.dart lib/services/journey_pdf_export_service.dart

      - name: Commit clean recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[guided-clean-recovered] feat(toolbox): restore guided journey on current main"
          git push origin HEAD:fix/guided-journey-clean
