name: Repair conversation safety banner

on:
  push:
    branches:
      - automation/repair-safety-banner-1017
    paths:
      - .github/workflows/repair-conversation-safety-banner.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the focused UI repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/pages/messages/conversation_thread_page.dart')
          content = path.read_text(encoding='utf-8')

          start_marker = '  Widget buildSafetyReminderBanner()'
          end_marker = '  Widget buildTypingIndicator()'
          start = content.index(start_marker)
          end = content.index(end_marker, start)
          segment = content[start:end]

          old_icon = '''            const Icon(
              Icons.shield_outlined,
              color: Color(0xFFFF0000),
              size: 20,
            ),'''
          new_icon = '''            const Icon(
              Icons.warning_amber_rounded,
              color: Color(0xFFFF0000),
              size: 22,
            ),'''

          old_style = '''                style: kPrestoMetaTextStyle.copyWith(
                  color: const Color(0xFFFF0000),
                  fontWeight: FontWeight.w900,
                ),'''
          new_style = '''                style: kPrestoMetaTextStyle.copyWith(
                  color: const Color(0xFFFF0000),
                  fontSize: 15,
                  height: 1.25,
                  fontWeight: FontWeight.w900,
                ),'''

          if old_icon in segment:
              segment = segment.replace(old_icon, new_icon, 1)
          elif new_icon not in segment:
              raise SystemExit('Expected safety-banner icon block not found')

          if old_style in segment:
              segment = segment.replace(old_style, new_style, 1)
          elif new_style not in segment:
              raise SystemExit('Expected safety-banner text style block not found')

          if 'Icons.shield_outlined' in segment:
              raise SystemExit('Old shield icon remains in safety banner')
          if segment.count('Icons.warning_amber_rounded') != 1:
              raise SystemExit('Warning icon is missing or duplicated')
          if 'fontSize: 15' not in segment or 'height: 1.25' not in segment:
              raise SystemExit('Readable text sizing was not applied')

          updated = content[:start] + segment + content[end:]
          path.write_text(updated, encoding='utf-8')
          print('Safety banner repair applied and verified.')
          PY

          git diff --check
          git diff -- lib/pages/messages/conversation_thread_page.dart

      - name: Commit repair to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/messages/conversation_thread_page.dart
          if git diff --cached --quiet; then
            echo "Repair already present; nothing to commit."
            exit 0
          fi
          git commit -m "fix(messages): improve safety banner readability"
          git push origin HEAD:"${GITHUB_REF_NAME}"
