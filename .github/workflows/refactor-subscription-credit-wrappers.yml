name: Refactor subscription credit wrappers

on:
  push:
    branches:
      - agent/subscription-credits-dashboard

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, 'apply subscription credit wrappers') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/subscription-credits-dashboard
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/refactor_subscription_credit_wrappers.py
      - name: Commit refactor
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/account_page.dart lib/pages/publish_offer_page.dart lib/widgets/ai_publish_control.dart
          git commit -m "refactor: apply subscription credit wrappers"
          git push origin HEAD:agent/subscription-credits-dashboard
