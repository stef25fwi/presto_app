name: Temporary apply unused shown name fix

on:
  push:
    branches:
      - agent/phase-0-analyzer-ignore-18

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-analyzer-ignore-18
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply targeted import cleanup
        run: node tools/temporary_remove_unused_shown_name.mjs

      - name: Commit targeted change
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/consult_offers_page.dart
          git commit -m 'fix: retire le symbole inutilisé de la consultation'
          git push origin HEAD:agent/phase-0-analyzer-ignore-18
