name: Firestore query quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tools/quality/audit_firestore_queries.py'
      - '.github/workflows/firestore-quality.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tools/quality/audit_firestore_queries.py'
      - '.github/workflows/firestore-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Generate Firestore query catalog
        run: |
          python3 tools/quality/audit_firestore_queries.py \
            --output-dir quality_reports/firestore

      - name: Publish summary
        run: cat quality_reports/firestore/firestore-query-catalog.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload catalog
        uses: actions/upload-artifact@v7
        with:
          name: firestore-query-catalog-${{ github.sha }}
          path: quality_reports/firestore
          if-no-files-found: error
          retention-days: 30
