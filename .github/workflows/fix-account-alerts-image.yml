name: Fix account alerts image

on:
  push:
    branches:
      - agent/fix-account-alerts-image
    paths:
      - .github/workflows/fix-account-alerts-image.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch alert image loading
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('lib/services/ad_placeholder_image_service.dart')
          text = service.read_text()
          old_watch_all = """    return _collection
              .where('target', isEqualTo: target)
              .orderBy('sortOrder')
              .snapshots()
              .map(
                (snapshot) => snapshot.docs.map(AdPlaceholderImage.fromDoc).toList(),
              );"""
          new_watch_all = """    return _collection
              .where('target', isEqualTo: target)
              .snapshots()
              .map((snapshot) {
                final images = snapshot.docs.map(AdPlaceholderImage.fromDoc).toList()
                  ..sort((a, b) => a.sortOrder.compareTo(b.sortOrder));
                return images;
              });"""
          old_watch_visible = """    return _collection
              .where('target', isEqualTo: target)
              .where('isVisible', isEqualTo: true)
              .orderBy('sortOrder')
              .snapshots()
              .map(
                (snapshot) => snapshot.docs.map(AdPlaceholderImage.fromDoc).toList(),
              );"""
          new_watch_visible = """    return _collection
              .where('target', isEqualTo: target)
              .where('isVisible', isEqualTo: true)
              .snapshots()
              .map((snapshot) {
                final images = snapshot.docs.map(AdPlaceholderImage.fromDoc).toList()
                  ..sort((a, b) => a.sortOrder.compareTo(b.sortOrder));
                return images;
              });"""
          if old_watch_all not in text or old_watch_visible not in text:
              raise SystemExit('Requêtes AdPlaceholderImageService introuvables')
          text = text.replace(old_watch_all, new_watch_all, 1)
          text = text.replace(old_watch_visible, new_watch_visible, 1)
          service.write_text(text)

          admin = Path('lib/pages/admin/ad_placeholder_images_admin_page.dart')
          text = admin.read_text()
          text = text.replace(
              "'subscription_alerts_banner': 'Page abonnement — alertes nouvelle annonce',",
              "'subscription_alerts_banner': 'Page Mon compte — Mes alertes nouvelles annonces',",
              1,
          )
          text = text.replace(
              "  String _target = 'consult_offers';",
              "  String _target = 'subscription_alerts_banner';",
              1,
          )
          admin.write_text(text)

          account = Path('lib/pages/account_page.dart')
          text = account.read_text()
          old_builder = """          builder: (context, snapshot) {
                final activeImages = (snapshot.data ?? const <AdPlaceholderImage>[])
                    .where((image) => image.isVisible)
                    .toList();
                if (activeImages.isEmpty) return fallback();

                return Image.network("""
          new_builder = """          builder: (context, snapshot) {
                if (snapshot.hasError) {
                  debugPrint(
                    '[AccountAlertsBanner] loading failed: ${snapshot.error}',
                  );
                  return fallback();
                }

                final activeImages = (snapshot.data ?? const <AdPlaceholderImage>[])
                    .where((image) => image.isVisible && image.imageUrl.isNotEmpty)
                    .toList();
                if (activeImages.isEmpty) return fallback();

                return Image.network("""
          if old_builder not in text:
              raise SystemExit('Builder bannière alertes introuvable')
          text = text.replace(old_builder, new_builder, 1)
          account.write_text(text)
          PY

      - name: Format and validate
        run: |
          dart format lib/services/ad_placeholder_image_service.dart lib/pages/admin/ad_placeholder_images_admin_page.dart lib/pages/account_page.dart
          flutter pub get
          flutter analyze lib/services/ad_placeholder_image_service.dart lib/pages/admin/ad_placeholder_images_admin_page.dart lib/pages/account_page.dart

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/ad_placeholder_image_service.dart lib/pages/admin/ad_placeholder_images_admin_page.dart lib/pages/account_page.dart
          git commit -m 'fix: display selected account alerts image' || exit 0
          git push
