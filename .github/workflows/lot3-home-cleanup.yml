name: Lot 3 home dead-code patch

on:
  push:
    branches:
      - refactor/lot3-home-dead-responsive-20260807

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove proven-dead home responsive helpers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/pages/home_page.dart')
          text = path.read_text(encoding='utf-8')
          block = """  // Taille de police de référence pour les titres des slides (alignée sur le slide 1)\n  static const double _homeSlideTitleFontSize = 30;\n\n  double _responsiveHeroTitleFontSize(BuildContext context) {\n    final width = MediaQuery.sizeOf(context).width;\n    if (width < 360) return 21;\n    if (width < 430) return 24;\n    if (width < 700) return 26;\n    return 30;\n  }\n\n  double _responsiveHeroSubtitleFontSize(BuildContext context) {\n    final width = MediaQuery.sizeOf(context).width;\n    if (width < 360) return 13;\n    if (width < 430) return 14;\n    return 15;\n  }\n\n"""
          count = text.count(block)
          if count != 1:
              raise SystemExit(f'expected one dead-helper block, found {count}')
          path.write_text(text.replace(block, '', 1), encoding='utf-8')
          Path('.github/workflows/lot3-home-cleanup.yml').unlink()
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/home_page.dart .github/workflows/lot3-home-cleanup.yml
          git diff --cached --check
          git commit -m "refactor(lot3): supprimer helpers responsive morts de home"
          git push origin HEAD:refactor/lot3-home-dead-responsive-20260807
