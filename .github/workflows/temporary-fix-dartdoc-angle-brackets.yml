name: Temporary fix Dartdoc angle brackets

on:
  push:
    branches:
      - agent/phase-0-analyzer-ignore-16

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-analyzer-ignore-16
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply Dartdoc corrections
        run: |
          node tools/temporary_fix_dartdoc_angle_brackets.mjs
          dart format bin/convert_cities_by_dept.dart lib/data/trade_category_lookup.dart

      - name: Commit targeted corrections
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bin/convert_cities_by_dept.dart lib/data/trade_category_lookup.dart
          git commit -m 'fix: échappe les chevrons dans les commentaires Dartdoc'
          git push origin HEAD:agent/phase-0-analyzer-ignore-16
