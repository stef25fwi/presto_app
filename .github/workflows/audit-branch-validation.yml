name: Audit branch validation report

on:
  push:
    branches:
      - audit/prod-hardening-p0-p11
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-branch-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/prod-hardening-p0-p11
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Prepare logs
        run: mkdir -p audit_validation_logs

      - name: Verify generated patches
        id: patches
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/apply_prod_hardening_patches.mjs 2>&1 | tee audit_validation_logs/patches.log
          node tools/apply_startup_hardening.mjs 2>&1 | tee -a audit_validation_logs/patches.log
          node tools/apply_auth_client_hardening.mjs 2>&1 | tee -a audit_validation_logs/patches.log
          node tools/apply_account_cleanup_patch.mjs 2>&1 | tee -a audit_validation_logs/patches.log
          node tools/normalize_cursor_patch_script.mjs 2>&1 | tee -a audit_validation_logs/patches.log
          node tools/fix_cursor_query_signature_patch.mjs 2>&1 | tee -a audit_validation_logs/patches.log
          node tools/apply_cursor_pagination.mjs 2>&1 | tee -a audit_validation_logs/patches.log
          node tools/apply_validation_fixes.mjs 2>&1 | tee -a audit_validation_logs/patches.log
          node tools/apply_identity_authority_hardening.mjs 2>&1 | tee -a audit_validation_logs/patches.log
          node tools/apply_dependency_security_upgrades.mjs 2>&1 | tee -a audit_validation_logs/patches.log
          node tools/apply_stripe_ordering_hardening.mjs 2>&1 | tee -a audit_validation_logs/patches.log
          node tools/apply_function_resource_limits.mjs 2>&1 | tee -a audit_validation_logs/patches.log
          git diff --exit-code 2>&1 | tee -a audit_validation_logs/patches.log
          node tools/check_production_guardrails.mjs 2>&1 | tee -a audit_validation_logs/patches.log

      - name: Flutter dependencies
        id: flutter_deps
        continue-on-error: true
        run: |
          set -o pipefail
          flutter config --enable-web 2>&1 | tee audit_validation_logs/flutter_deps.log
          flutter pub get 2>&1 | tee -a audit_validation_logs/flutter_deps.log

      - name: Flutter analyze
        id: flutter_analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee audit_validation_logs/flutter_analyze.log

      - name: Flutter tests
        id: flutter_test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee audit_validation_logs/flutter_test.log

      - name: Functions dependencies
        id: functions_deps
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions ci 2>&1 | tee audit_validation_logs/functions_deps.log

      - name: Functions build
        id: functions_build
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions run build 2>&1 | tee audit_validation_logs/functions_build.log

      - name: Functions tests
        id: functions_test
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions test 2>&1 | tee audit_validation_logs/functions_test.log

      - name: Install Firebase CLI
        id: firebase_cli
        continue-on-error: true
        run: |
          set -o pipefail
          npm install -g firebase-tools@13 2>&1 | tee audit_validation_logs/firebase_cli.log

      - name: Firestore rules tests
        id: firestore_rules
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions run test:firestore 2>&1 | tee audit_validation_logs/firestore_rules.log

      - name: Web release build
        id: web_build
        continue-on-error: true
        env:
          APPCHECK_RECAPTCHA_SITE_KEY: ci-audit-placeholder
        run: |
          set -o pipefail
          bash tools/flutter_with_build_stamp.sh build web --release --no-wasm-dry-run 2>&1 | tee audit_validation_logs/web_build.log

      - name: Web bundle budget
        id: bundle_budget
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/check_web_bundle_size.mjs 2>&1 | tee audit_validation_logs/bundle_budget.log

      - name: Generate validation summary
        if: always()
        run: |
          cat > audit_validation_logs/STATUS.md <<'REPORT'
          # Validation automatique — branche audit/prod-hardening-p0-p11

          | Contrôle | Résultat |
          |---|---|
          | Patchs idempotents et garde-fous | `${{ steps.patches.outcome }}` |
          | Dépendances Flutter | `${{ steps.flutter_deps.outcome }}` |
          | Flutter analyze | `${{ steps.flutter_analyze.outcome }}` |
          | Tests Flutter | `${{ steps.flutter_test.outcome }}` |
          | Dépendances Functions | `${{ steps.functions_deps.outcome }}` |
          | Build Functions | `${{ steps.functions_build.outcome }}` |
          | Tests Functions | `${{ steps.functions_test.outcome }}` |
          | Firebase CLI | `${{ steps.firebase_cli.outcome }}` |
          | Tests Firestore Rules | `${{ steps.firestore_rules.outcome }}` |
          | Build Web release | `${{ steps.web_build.outcome }}` |
          | Budget bundle Web | `${{ steps.bundle_budget.outcome }}` |
          REPORT

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-validation-${{ github.sha }}
          path: audit_validation_logs
          retention-days: 14

      - name: Enforce successful validation
        if: always()
        run: |
          outcomes='${{ steps.patches.outcome }} ${{ steps.flutter_deps.outcome }} ${{ steps.flutter_analyze.outcome }} ${{ steps.flutter_test.outcome }} ${{ steps.functions_deps.outcome }} ${{ steps.functions_build.outcome }} ${{ steps.functions_test.outcome }} ${{ steps.firebase_cli.outcome }} ${{ steps.firestore_rules.outcome }} ${{ steps.web_build.outcome }} ${{ steps.bundle_budget.outcome }}'
          if echo "$outcomes" | grep -Eq 'failure|cancelled'; then
            echo "Validation failed: $outcomes"
            exit 1
          fi
          echo "Validation succeeded: $outcomes"
