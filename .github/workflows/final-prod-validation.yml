name: Final production validation

on:
  push:
    branches:
      - audit/prod-hardening-p0-p11
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-production-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Validate production guardrails
        run: node tools/check_production_guardrails.mjs

      - name: Install Flutter dependencies
        run: |
          flutter config --enable-web
          flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --fatal-infos

      - name: Test Flutter
        run: flutter test --reporter expanded

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Test Functions
        run: npm --prefix functions test

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Test Firestore rules
        run: npm --prefix functions run test:firestore

      - name: Build Web release
        env:
          APPCHECK_RECAPTCHA_SITE_KEY: ci-final-validation-placeholder
        run: bash tools/flutter_with_build_stamp.sh build web --release --no-wasm-dry-run

      - name: Check Web bundle budgets
        run: node tools/check_web_bundle_size.mjs
