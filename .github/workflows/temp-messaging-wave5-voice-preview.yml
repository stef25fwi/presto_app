name: Temporary messaging wave 5 voice preview executor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  implement-and-test:
    if: github.head_ref == 'coverage/messaging-thread-actions-wave-5'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Apply voice preview coverage wave
        run: python3 tools/temp_messaging_wave5_voice_preview.py
      - name: Format changed Dart files
        run: dart format lib/pages/messages/conversation_thread_page.dart test/pages/messages/conversation_thread_voice_preview_coverage_test.dart
      - name: Enforce legacy page line budget
        run: |
          lines=$(wc -l < lib/pages/messages/conversation_thread_page.dart)
          test "$lines" -le 5167
      - name: Dependencies
        run: flutter pub get
      - name: Targeted voice preview tests
        run: flutter test test/pages/messages/conversation_thread_voice_preview_coverage_test.dart
      - name: Targeted analyzer
        run: flutter analyze lib/pages/messages/conversation_thread_page.dart test/pages/messages/conversation_thread_voice_preview_coverage_test.dart
      - name: Commit validated wave and clean temporary files
        run: |
          rm -f .github/workflows/temp-export-messaging-wave-5.yml
          rm -f .github/workflows/temp-messaging-wave5-voice-preview.yml
          rm -f tools/temp_messaging_wave5_voice_preview.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(coverage): cover messaging voice preview" || exit 0
          git push origin HEAD:${{ github.head_ref }}
