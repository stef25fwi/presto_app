name: GA4 Organic Search lot 16

on:
  schedule:
    - cron: '12 8 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ga4-organic-lot16.yml'
      - 'tools/seo/fetch_ga4_metrics.mjs'
      - 'tools/seo/build_ga4_lot16_report.mjs'
      - 'tools/seo/ga4_lot16_contract.test.mjs'
      - 'tools/seo/google_service_account_auth.mjs'
      - 'config/seo-monitoring.json'
  workflow_dispatch:
    inputs:
      property_id:
        description: 'Property ID GA4 numérique à privilégier'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write
  issues: write
  statuses: write

concurrency:
  group: ga4-organic-lot16
  cancel-in-progress: true

jobs:
  ga4-organic-report:
    environment: recaptcha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate lot 16 contract
        run: node tools/seo/ga4_lot16_contract.test.mjs

      - name: Authenticate with Workload Identity Federation
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 1800s
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly

      - name: Build GA4 Organic Search report
        id: report
        continue-on-error: true
        env:
          SEO_GOOGLE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          SEO_GA4_PROPERTY_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.property_id || vars.SEO_GA4_PROPERTY_ID }}
        run: |
          node tools/seo/build_ga4_lot16_report.mjs \
            --output build/seo/ga4-organic-lot16-report.json \
            --markdown build/seo/ga4-organic-lot16-report.md \
            --enforce

      - name: Publish report summary
        if: always()
        run: |
          if [ -f build/seo/ga4-organic-lot16-report.md ]; then
            cat build/seo/ga4-organic-lot16-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# GA4 Organic Search — lot 16' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'Le rapport n’a pas pu être généré.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload GA4 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ga4-organic-lot16-${{ github.sha }}
          path: build/seo/ga4-organic-lot16-report.*
          if-no-files-found: warn
          retention-days: 90

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ steps.report.outputs.state }}
          STATUS_DESCRIPTION: ${{ steps.report.outputs.description }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE' > /tmp/ga4-organic-status.json
          const payload = {
            state: process.env.STATUS_STATE || 'error',
            target_url: process.env.TARGET_URL,
            description: String(process.env.STATUS_DESCRIPTION || 'Rapport GA4 indisponible').slice(0, 140),
            context: 'quality/ga4-organic-lot16',
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/ga4-organic-status.json \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"

      - name: Open, update or close lot 16 issue
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const title = '[SEO lot 16] GA4 Organic Search';
            const jsonPath = 'build/seo/ga4-organic-lot16-report.json';
            const markdownPath = 'build/seo/ga4-organic-lot16-report.md';
            const report = fs.existsSync(jsonPath)
              ? JSON.parse(fs.readFileSync(jsonPath, 'utf8'))
              : null;
            const markdown = fs.existsSync(markdownPath)
              ? fs.readFileSync(markdownPath, 'utf8')
              : '# GA4 Organic Search — lot 16\n\nRapport absent.';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${markdown}\n---\nWorkflow : ${runUrl}\n`;
            const healthy = report?.status === 'available';
            if (!healthy && existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else if (!healthy) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Accès GA4 validé : ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }

      - name: Enforce GA4 availability
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'build/seo/ga4-organic-lot16-report.json';
          if (!fs.existsSync(path)) process.exit(1);
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (report.status !== 'available') process.exit(1);
          console.log(`GA4 Organic Search available for property ${report.propertyId}`);
          NODE
