name: Temporary fix admin listings UI v3

on:
  push:
    branches:
      - agent/phase-5-admin-listings-management-ui-v3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-5-admin-listings-management-ui-v3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply admin listings fixes
        run: node tools/temporary_fix_admin_listings_ui_v3.mjs

      - name: Format updated files
        run: |
          dart format \
            lib/admin/listings/admin_listing_record.dart \
            lib/admin/listings/admin_listings_management_page.dart

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/admin/listings/admin_listing_record.dart \
            lib/admin/listings/admin_listings_management_page.dart
          git commit -m 'fix: stabilise le dialogue de suppression admin'
          git push origin HEAD:agent/phase-5-admin-listings-management-ui-v3
