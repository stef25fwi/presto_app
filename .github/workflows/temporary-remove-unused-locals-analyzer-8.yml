name: Temporary remove unused locals analyzer 8

on:
  push:
    branches:
      - agent/phase-0-analyzer-ignore-8

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-analyzer-ignore-8
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove unused locals
        run: node tools/temporary_remove_unused_locals_analyzer_8.mjs

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            lib/dev/page_capture_catalog_page.dart \
            lib/pages/admin_space_page.dart \
            lib/pages/messages/conversation_thread_page.dart \
            lib/pages/messages/conversations_list_page.dart \
            lib/pages/offers/offer_details_page.dart \
            lib/pages/toolbox_je_me_lance_page.dart \
            lib/services/value_analysis_service.dart \
            lib/widgets/ad_banner.dart

      - name: Commit targeted changes
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/dev/page_capture_catalog_page.dart \
            lib/pages/admin_space_page.dart \
            lib/pages/messages/conversation_thread_page.dart \
            lib/pages/messages/conversations_list_page.dart \
            lib/pages/offers/offer_details_page.dart \
            lib/pages/toolbox_je_me_lance_page.dart \
            lib/services/value_analysis_service.dart \
            lib/widgets/ad_banner.dart
          git commit -m 'fix: retire douze variables locales inutilisées'
          git push origin HEAD:agent/phase-0-analyzer-ignore-8
