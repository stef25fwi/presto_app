name: Pull request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Capture exact Git tree
        run: git rev-parse HEAD^{tree} > /tmp/tree-sha.txt
      - name: Upload exact Git tree SHA
        uses: actions/upload-artifact@v7
        with:
          name: pr451-tree-${{ github.sha }}
          path: /tmp/tree-sha.txt
          if-no-files-found: error
          retention-days: 1
