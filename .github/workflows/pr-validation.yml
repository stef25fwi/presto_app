name: Pull request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Prepare validation logs
        run: mkdir -p pr_validation_logs

      - name: Apply generated hardening patches
        id: patches
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/apply_prod_hardening_patches.mjs 2>&1 | tee pr_validation_logs/patches.log
          node tools/apply_startup_hardening.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_auth_client_hardening.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_account_cleanup_patch.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/normalize_cursor_patch_script.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/fix_cursor_query_signature_patch.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_cursor_pagination.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_validation_fixes.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_identity_authority_hardening.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_dependency_security_upgrades.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_stripe_ordering_hardening.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_function_resource_limits.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_release_validation_fixes.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_validation_round2_fixes.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_account_compact_spacing_bootstrap.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          npm --prefix functions install --package-lock-only --ignore-scripts 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/check_production_guardrails.mjs 2>&1 | tee -a pr_validation_logs/patches.log

      - name: Commit generated source changes
        if: steps.patches.outcome == 'success'
        run: |
          if git diff --quiet; then
            echo "No generated source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: applique les correctifs générés préproduction"
          git push origin HEAD:${{ github.head_ref }}

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Flutter dependencies
        id: flutter_deps
        continue-on-error: true
        run: |
          set -o pipefail
          flutter config --enable-web 2>&1 | tee pr_validation_logs/flutter_deps.log
          flutter pub get 2>&1 | tee -a pr_validation_logs/flutter_deps.log

      - name: Flutter analyze
        id: flutter_analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee pr_validation_logs/flutter_analyze.log

      - name: Flutter tests
        id: flutter_test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee pr_validation_logs/flutter_test.log

      - name: Functions dependencies
        id: functions_deps
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions ci 2>&1 | tee pr_validation_logs/functions_deps.log

      - name: Functions build
        id: functions_build
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions run build 2>&1 | tee pr_validation_logs/functions_build.log

      - name: Functions tests
        id: functions_test
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions test 2>&1 | tee pr_validation_logs/functions_test.log

      - name: Install Firebase CLI
        id: firebase_cli
        continue-on-error: true
        run: |
          set -o pipefail
          npm install -g firebase-tools@13 2>&1 | tee pr_validation_logs/firebase_cli.log

      - name: Test Firestore rules
        id: firestore_rules
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions run test:firestore 2>&1 | tee pr_validation_logs/firestore_rules.log

      - name: Build web
        id: web_build
        continue-on-error: true
        env:
          APPCHECK_RECAPTCHA_SITE_KEY: ci-pr-placeholder
        run: |
          set -o pipefail
          bash tools/flutter_with_build_stamp.sh build web --release --no-wasm-dry-run 2>&1 | tee pr_validation_logs/web_build.log

      - name: Check bundle size
        id: bundle_budget
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/check_web_bundle_size.mjs 2>&1 | tee pr_validation_logs/bundle_budget.log

      - name: Write validation summary
        if: always()
        run: |
          cat > pr_validation_logs/STATUS.md <<'REPORT'
          # Résultats de validation PR

          | Contrôle | Résultat |
          |---|---|
          | Patchs et garde-fous | `${{ steps.patches.outcome }}` |
          | Dépendances Flutter | `${{ steps.flutter_deps.outcome }}` |
          | Flutter analyze | `${{ steps.flutter_analyze.outcome }}` |
          | Tests Flutter | `${{ steps.flutter_test.outcome }}` |
          | Dépendances Functions | `${{ steps.functions_deps.outcome }}` |
          | Build Functions | `${{ steps.functions_build.outcome }}` |
          | Tests Functions | `${{ steps.functions_test.outcome }}` |
          | Firebase CLI | `${{ steps.firebase_cli.outcome }}` |
          | Tests Firestore Rules | `${{ steps.firestore_rules.outcome }}` |
          | Build Web | `${{ steps.web_build.outcome }}` |
          | Budget bundle | `${{ steps.bundle_budget.outcome }}` |
          REPORT

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-validation-${{ github.sha }}
          path: pr_validation_logs
          retention-days: 14

      - name: Enforce validation result
        if: always()
        run: |
          outcomes='${{ steps.patches.outcome }} ${{ steps.flutter_deps.outcome }} ${{ steps.flutter_analyze.outcome }} ${{ steps.flutter_test.outcome }} ${{ steps.functions_deps.outcome }} ${{ steps.functions_build.outcome }} ${{ steps.functions_test.outcome }} ${{ steps.firebase_cli.outcome }} ${{ steps.firestore_rules.outcome }} ${{ steps.web_build.outcome }} ${{ steps.bundle_budget.outcome }}'
          if echo "$outcomes" | grep -Eq 'failure|cancelled'; then
            echo "Validation failed: $outcomes"
            exit 1
          fi
          echo "Validation succeeded: $outcomes"
