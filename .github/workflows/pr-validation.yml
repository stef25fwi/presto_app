name: Pull request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Prepare validation logs
        run: mkdir -p pr_validation_logs quality_reports/pr

      - name: Verify generated hardening patches are committed
        id: generated_check
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/apply_prod_hardening_patches.mjs 2>&1 | tee pr_validation_logs/patches.log
          node tools/apply_startup_hardening.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_auth_client_hardening.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_account_cleanup_patch.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/normalize_cursor_patch_script.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/fix_cursor_query_signature_patch.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_cursor_pagination.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_validation_fixes.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_identity_authority_hardening.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_dependency_security_upgrades.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_stripe_ordering_hardening.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_function_resource_limits.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_release_validation_fixes.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/apply_validation_round2_fixes.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          npm --prefix functions install --package-lock-only --ignore-scripts 2>&1 | tee -a pr_validation_logs/patches.log
          node tools/check_production_guardrails.mjs 2>&1 | tee -a pr_validation_logs/patches.log
          if ! git diff --quiet; then
            echo 'Generated changes are missing from this branch.' | tee -a pr_validation_logs/patches.log
            git status --short | tee -a pr_validation_logs/patches.log
            git diff --stat | tee -a pr_validation_logs/patches.log
            exit 1
          fi

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Flutter dependencies
        id: flutter_deps
        continue-on-error: true
        run: |
          set -o pipefail
          flutter config --enable-web 2>&1 | tee pr_validation_logs/flutter_deps.log
          flutter pub get 2>&1 | tee -a pr_validation_logs/flutter_deps.log

      - name: Flutter analyze
        id: flutter_analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee pr_validation_logs/flutter_analyze.log

      - name: Flutter tests with coverage
        id: flutter_test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --coverage --reporter expanded 2>&1 | tee pr_validation_logs/flutter_test.log

      - name: Enforce global coverage target
        id: global_coverage
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/coverage/coverage_agent.py \
            --lcov coverage/lcov.info \
            --json-output quality_reports/pr/coverage-agent/target.json \
            --markdown-output quality_reports/pr/coverage-agent/issue.md \
            --global-target 80 \
            --enforce-global-target 2>&1 | tee pr_validation_logs/global_coverage.log

      - name: Enforce repository quality gates
        id: quality_gate
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/quality/audit_repository.py \
            --output-dir quality_reports/pr \
            --git-ref '${{ github.sha }}' \
            --enforce 2>&1 | tee pr_validation_logs/quality_gate.log

      - name: Measure critical module coverage
        id: critical_coverage
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/quality/check_critical_coverage.py \
            --output-dir quality_reports/pr/critical-coverage \
            --enforce 2>&1 | tee pr_validation_logs/critical_coverage.log

      - name: Functions dependencies
        id: functions_deps
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions ci 2>&1 | tee pr_validation_logs/functions_deps.log

      - name: Functions build
        id: functions_build
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions run build 2>&1 | tee pr_validation_logs/functions_build.log

      - name: Functions tests
        id: functions_test
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions test 2>&1 | tee pr_validation_logs/functions_test.log

      - name: Install Firebase CLI
        id: firebase_cli
        continue-on-error: true
        run: |
          set -o pipefail
          npm install -g firebase-tools@13 2>&1 | tee pr_validation_logs/firebase_cli.log

      - name: Test Firestore rules
        id: firestore_rules
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix functions run test:firestore 2>&1 | tee pr_validation_logs/firestore_rules.log

      - name: Build web
        id: web_build
        continue-on-error: true
        env:
          APPCHECK_RECAPTCHA_SITE_KEY: ci-pr-placeholder
        run: |
          set -o pipefail
          bash tools/flutter_with_build_stamp.sh build web --release --no-wasm-dry-run 2>&1 | tee pr_validation_logs/web_build.log

      - name: Check bundle size
        id: bundle_budget
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/check_web_bundle_size.mjs 2>&1 | tee pr_validation_logs/bundle_budget.log

      - name: Upload web preview artifact
        if: steps.web_build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: web-preview-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 7

      - name: Write validation summary
        if: always()
        run: |
          cat > pr_validation_logs/STATUS.md <<'REPORT'
          # Résultats de validation PR

          | Contrôle | Résultat |
          |---|---|
          | Correctifs générés déjà commités | `${{ steps.generated_check.outcome }}` |
          | Dépendances Flutter | `${{ steps.flutter_deps.outcome }}` |
          | Flutter analyze | `${{ steps.flutter_analyze.outcome }}` |
          | Tests Flutter + couverture | `${{ steps.flutter_test.outcome }}` |
          | Couverture globale 80% | `${{ steps.global_coverage.outcome }}` |
          | Seuils qualité | `${{ steps.quality_gate.outcome }}` |
          | Couverture modules critiques | `${{ steps.critical_coverage.outcome }}` |
          | Dépendances Functions | `${{ steps.functions_deps.outcome }}` |
          | Build Functions | `${{ steps.functions_build.outcome }}` |
          | Tests Functions | `${{ steps.functions_test.outcome }}` |
          | Firebase CLI | `${{ steps.firebase_cli.outcome }}` |
          | Tests Firestore Rules | `${{ steps.firestore_rules.outcome }}` |
          | Build Web | `${{ steps.web_build.outcome }}` |
          | Budget bundle | `${{ steps.bundle_budget.outcome }}` |
          REPORT

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-validation-${{ github.sha }}
          path: |
            pr_validation_logs
            quality_reports/pr
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce validation result
        if: always()
        run: |
          outcomes='${{ steps.generated_check.outcome }} ${{ steps.flutter_deps.outcome }} ${{ steps.flutter_analyze.outcome }} ${{ steps.flutter_test.outcome }} ${{ steps.global_coverage.outcome }} ${{ steps.quality_gate.outcome }} ${{ steps.critical_coverage.outcome }} ${{ steps.functions_deps.outcome }} ${{ steps.functions_build.outcome }} ${{ steps.functions_test.outcome }} ${{ steps.firebase_cli.outcome }} ${{ steps.firestore_rules.outcome }} ${{ steps.web_build.outcome }} ${{ steps.bundle_budget.outcome }}'
          if echo "$outcomes" | grep -Eq 'failure|cancelled'; then
            echo "Validation failed: $outcomes"
            exit 1
          fi
          echo "Validation succeeded: $outcomes"

  preview:
    name: Firebase Hosting preview
    needs: validate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: web-preview-${{ github.sha }}
          path: build/web

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check preview credentials and project safety
        id: preview_config
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Firebase preview skipped: FIREBASE_TOKEN is missing.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          result=$(node tools/quality/check_firebase_preview_project.mjs)
          enabled=$(node -e "const value=JSON.parse(process.argv[1]); process.stdout.write(String(value.enabled));" "$result")
          message=$(node -e "const value=JSON.parse(process.argv[1]); process.stdout.write(value.message);" "$result")
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Install Firebase CLI
        if: steps.preview_config.outputs.enabled == 'true'
        run: npm install -g firebase-tools@13

      - name: Deploy isolated preview channel
        if: steps.preview_config.outputs.enabled == 'true'
        id: preview_deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -o pipefail
          firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --expires 7d \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive 2>&1 | tee preview-deploy.log
          preview_url=$(grep -Eo 'https://[^ ]+\.web\.app' preview-deploy.log | tail -1 || true)
          if [ -n "$preview_url" ]; then
            echo "url=$preview_url" >> "$GITHUB_OUTPUT"
            curl --fail --silent --show-error --retry 4 --retry-delay 4 "$preview_url" >/dev/null
            echo "Preview: $preview_url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Preview deployed but URL could not be parsed.' >> "$GITHUB_STEP_SUMMARY"
          fi
