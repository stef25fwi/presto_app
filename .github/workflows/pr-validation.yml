name: Pull request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Build exact repository tarball
        run: tar --exclude=.git -czf /tmp/pr451-repository.tar.gz .
      - name: Upload exact repository snapshot
        uses: actions/upload-artifact@v7
        with:
          name: pr451-repository-${{ github.sha }}
          path: /tmp/pr451-repository.tar.gz
          if-no-files-found: error
          retention-days: 1
