name: Temporary fix monitoring hardening generator

on:
  push:
    branches:
      - agent/phase-0-analyzer-ignore-17-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-analyzer-ignore-17-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply generator correction
        run: node tools/temporary_fix_monitoring_hardening_generator.mjs

      - name: Commit generator correction
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/apply_prod_hardening_patches.mjs
          git commit -m 'fix: garde le générateur monitoring sans imports inutiles'
          git push origin HEAD:agent/phase-0-analyzer-ignore-17-v2
