name: Temporary export admin deletion sources

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Collect relevant sources
        run: |
          set -euo pipefail
          mkdir -p admin-deletion-audit/export
          roots=(lib)
          for candidate in functions/src functions/test functions/tests; do
            if [ -d "$candidate" ]; then
              roots+=("$candidate")
            fi
          done
          pattern='delete|deletedAt|deleted_entities|admin_actions|audit|histor|commune|bulk'
          grep -RInE "$pattern" "${roots[@]}" \
            > admin-deletion-audit/locations.txt 2>/dev/null || true
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            mkdir -p "admin-deletion-audit/export/$(dirname "$path")"
            cp "$path" "admin-deletion-audit/export/$path"
          done < <(grep -RIlE "$pattern" "${roots[@]}" 2>/dev/null | sort -u || true)
          if [ -f lib/pages/admin_space_page.dart ]; then
            mkdir -p admin-deletion-audit/export/lib/pages
            cp lib/pages/admin_space_page.dart admin-deletion-audit/export/lib/pages/
          fi

      - name: Upload audit sources
        uses: actions/upload-artifact@v4
        with:
          name: admin-deletion-sources-${{ github.sha }}
          path: admin-deletion-audit
          if-no-files-found: error
          retention-days: 3
