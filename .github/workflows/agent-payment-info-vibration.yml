name: Agent - Payment info vibration

on:
  push:
    branches:
      - agent/payment-info-vibration

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.event.head_commit.message == 'chore: add payment info vibration patch workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/payment-info-vibration
          fetch-depth: 0

      - name: Apply focused Flutter patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/pages/offers/offer_details_page.dart')
          text = path.read_text(encoding='utf-8')
          start_marker = 'class _AnimatedPaymentInfoPill extends StatefulWidget {'
          end_marker = 'class _AdvertiserMetaLine extends StatelessWidget {'

          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Payment info pill markers not found')

          replacement = r'''class _AnimatedPaymentInfoPill extends StatefulWidget {
            final VoidCallback onTap;

            const _AnimatedPaymentInfoPill({required this.onTap});

            @override
            State<_AnimatedPaymentInfoPill> createState() =>
                _AnimatedPaymentInfoPillState();
          }

          class _AnimatedPaymentInfoPillState extends State<_AnimatedPaymentInfoPill>
              with SingleTickerProviderStateMixin {
            late final AnimationController _controller;
            late final Animation<double> _scale;
            late final Animation<double> _shake;
            late final Animation<double> _glow;
            late final Animation<double> _shine;
            bool _animationsDisabled = false;

            @override
            void initState() {
              super.initState();
              _controller = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 2200),
              );
              _scale = TweenSequence<double>([
                TweenSequenceItem(
                  tween: Tween<double>(begin: 1, end: 1.075)
                      .chain(CurveTween(curve: Curves.easeOutBack)),
                  weight: 8,
                ),
                TweenSequenceItem(
                  tween: Tween<double>(begin: 1.075, end: 0.985),
                  weight: 6,
                ),
                TweenSequenceItem(
                  tween: Tween<double>(begin: 0.985, end: 1.045),
                  weight: 6,
                ),
                TweenSequenceItem(
                  tween: Tween<double>(begin: 1.045, end: 1),
                  weight: 10,
                ),
                TweenSequenceItem(
                  tween: Tween<double>(begin: 1, end: 1.018)
                      .chain(CurveTween(curve: Curves.easeInOut)),
                  weight: 35,
                ),
                TweenSequenceItem(
                  tween: Tween<double>(begin: 1.018, end: 1)
                      .chain(CurveTween(curve: Curves.easeInOut)),
                  weight: 35,
                ),
              ]).animate(_controller);
              _shake = TweenSequence<double>([
                TweenSequenceItem(tween: Tween(begin: 0, end: -1.7), weight: 4),
                TweenSequenceItem(tween: Tween(begin: -1.7, end: 1.7), weight: 4),
                TweenSequenceItem(tween: Tween(begin: 1.7, end: -1.2), weight: 4),
                TweenSequenceItem(tween: Tween(begin: -1.2, end: 1.2), weight: 4),
                TweenSequenceItem(tween: Tween(begin: 1.2, end: 0), weight: 6),
                TweenSequenceItem(tween: ConstantTween<double>(0), weight: 78),
              ]).animate(CurvedAnimation(
                parent: _controller,
                curve: Curves.easeInOut,
              ));
              _glow = TweenSequence<double>([
                TweenSequenceItem(tween: Tween(begin: 0.28, end: 0.66), weight: 15),
                TweenSequenceItem(tween: Tween(begin: 0.66, end: 0.36), weight: 15),
                TweenSequenceItem(tween: Tween(begin: 0.36, end: 0.48), weight: 35),
                TweenSequenceItem(tween: Tween(begin: 0.48, end: 0.28), weight: 35),
              ]).animate(CurvedAnimation(
                parent: _controller,
                curve: Curves.easeInOut,
              ));
              _shine = Tween<double>(begin: -2.4, end: 2.4).animate(
                CurvedAnimation(
                  parent: _controller,
                  curve: const Interval(0, 0.62, curve: Curves.easeInOutCubic),
                ),
              );
            }

            @override
            void didChangeDependencies() {
              super.didChangeDependencies();
              final animationsDisabled =
                  MediaQuery.maybeOf(context)?.disableAnimations ?? false;
              if (animationsDisabled == _animationsDisabled &&
                  (_controller.isAnimating || animationsDisabled)) {
                return;
              }
              _animationsDisabled = animationsDisabled;
              if (_animationsDisabled) {
                _controller
                  ..stop()
                  ..value = 0;
              } else {
                _controller.repeat();
              }
            }

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return RepaintBoundary(
                child: AnimatedBuilder(
                  animation: _controller,
                  builder: (context, child) {
                    return Semantics(
                      button: true,
                      label: 'Informations sur le paiement',
                      child: Transform.translate(
                        offset: Offset(_shake.value, 0),
                        child: Transform.scale(
                          scale: _scale.value,
                          child: Material(
                            color: Colors.transparent,
                            borderRadius: BorderRadius.circular(999),
                            child: Ink(
                              decoration: BoxDecoration(
                                gradient: const LinearGradient(
                                  colors: [Color(0xFF1A73E8), Color(0xFF0D5FD1)],
                                  begin: Alignment.topLeft,
                                  end: Alignment.bottomRight,
                                ),
                                borderRadius: BorderRadius.circular(999),
                                border: Border.all(
                                  color: Colors.white.withValues(alpha: 0.22),
                                  width: 0.8,
                                ),
                                boxShadow: [
                                  BoxShadow(
                                    color: const Color(0xFF1A73E8)
                                        .withValues(alpha: _glow.value),
                                    blurRadius: 12 + (_glow.value * 8),
                                    spreadRadius: 0.5 + (_glow.value * 0.8),
                                    offset: const Offset(0, 3),
                                  ),
                                ],
                              ),
                              child: ClipRRect(
                                borderRadius: BorderRadius.circular(999),
                                child: InkWell(
                                  borderRadius: BorderRadius.circular(999),
                                  onTap: widget.onTap,
                                  child: Stack(
                                    alignment: Alignment.center,
                                    children: [
                                      const Padding(
                                        padding: EdgeInsets.symmetric(
                                          horizontal: 11,
                                          vertical: 5,
                                        ),
                                        child: SizedBox(
                                          width: 44,
                                          child: Center(
                                            child: Text(
                                              'Infos',
                                              textAlign: TextAlign.center,
                                              style: TextStyle(
                                                color: Colors.white,
                                                fontSize: 13,
                                                fontWeight: FontWeight.w900,
                                                letterSpacing: 0,
                                              ),
                                            ),
                                          ),
                                        ),
                                      ),
                                      Positioned.fill(
                                        child: IgnorePointer(
                                          child: DecoratedBox(
                                            decoration: BoxDecoration(
                                              gradient: LinearGradient(
                                                begin: Alignment(
                                                  _shine.value - 1.2,
                                                  -0.3,
                                                ),
                                                end: Alignment(
                                                  _shine.value + 1.2,
                                                  0.3,
                                                ),
                                                colors: const [
                                                  Colors.transparent,
                                                  Color(0x66FFFFFF),
                                                  Colors.transparent,
                                                ],
                                                stops: const [0.35, 0.5, 0.65],
                                              ),
                                            ),
                                          ),
                                        ),
                                      ),
                                    ],
                                  ),
                                ),
                              ),
                            ),
                          ),
                        ),
                      ),
                    );
                  },
                ),
              );
            }
          }'''

          updated = text[:start] + replacement + '\n\n' + text[end:]
          if updated.count(start_marker) != 1:
              raise SystemExit('Unexpected duplicate payment info pill class')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -q "Informations sur le paiement" lib/pages/offers/offer_details_page.dart
          grep -q "duration: const Duration(milliseconds: 2200)" lib/pages/offers/offer_details_page.dart

      - name: Commit focused change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/offers/offer_details_page.dart
          git commit -m "feat: animate payment info chip"
          git push origin HEAD:agent/payment-info-vibration
