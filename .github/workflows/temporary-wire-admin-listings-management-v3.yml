name: Temporary wire admin listings management v3

on:
  push:
    branches:
      - agent/phase-5-admin-listings-management-ui-v3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-5-admin-listings-management-ui-v3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Wire admin listings management
        run: node tools/temporary_wire_admin_listings_management_v3.mjs

      - name: Format changed Dart files
        run: |
          dart format \
            lib/pages/admin_space_page.dart \
            lib/admin/listings/admin_listing_record.dart \
            lib/admin/listings/admin_listings_repository.dart \
            lib/admin/listings/admin_listings_management_page.dart \
            test/admin/listings/admin_listing_record_test.dart \
            test/admin/listings/admin_listings_management_page_test.dart

      - name: Commit functional changes
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/pages/admin_space_page.dart \
            lib/admin/listings/admin_listing_record.dart \
            lib/admin/listings/admin_listings_repository.dart \
            lib/admin/listings/admin_listings_management_page.dart \
            test/admin/listings/admin_listing_record_test.dart \
            test/admin/listings/admin_listings_management_page_test.dart
          git commit -m 'feat: branche la gestion multiple des annonces admin'
          git push origin HEAD:agent/phase-5-admin-listings-management-ui-v3
