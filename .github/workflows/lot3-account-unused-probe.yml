name: Lot 3 account unused cascade probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lot3-account-unused-probe.yml
      - lib/pages/account_page.dart

permissions:
  contents: read

concurrency:
  group: lot3-account-unused-cascade-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Probe cascade after removing visibleEmail
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/pages/account_page.dart')
          text = path.read_text()
          header = '// ignore_for_file: unused_element, unused_field, unused_local_variable, unused_element_parameter\n\n'
          if not text.startswith(header):
              raise SystemExit('Unexpected account_page.dart ignore header')
          text = text[len(header):]
          dead = """    final visibleEmail = _profileEmail.trim().isNotEmpty
        ? _profileEmail.trim()
        : (user.email ?? '');
"""
          count = text.count(dead)
          if count != 1:
              raise SystemExit(f'visibleEmail block: expected 1 occurrence, found {count}')
          text = text.replace(dead, '', 1)
          path.write_text(text)
          PY

          set +e
          flutter analyze --fatal-infos lib/pages/account_page.dart 2>&1 | tee /tmp/account-cascade-analyze.log
          analyze_status=${PIPESTATUS[0]}
          set -e

          echo '--- LOT3_UNUSED_CASCADE_BEGIN ---'
          grep -E 'unused_(element|field|local_variable|element_parameter)' /tmp/account-cascade-analyze.log || true
          echo '--- LOT3_UNUSED_CASCADE_END ---'
          echo "Analyzer exit status: ${analyze_status}"

          git checkout -- lib/pages/account_page.dart
          git diff --exit-code
