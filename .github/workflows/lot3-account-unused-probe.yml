name: Lot 3 account unused cascade probe

on:
  push:
    branches:
      - refactor/lot3-account-unused-probe-20260807
    paths:
      - .github/workflows/lot3-account-unused-probe.yml

permissions:
  contents: write

concurrency:
  group: lot3-account-unused-cascade-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/lot3-account-unused-probe-20260807

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Probe cascade after removing visibleEmail
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/pages/account_page.dart')
          text = path.read_text()
          header = '// ignore_for_file: unused_element, unused_field, unused_local_variable, unused_element_parameter\n\n'
          if not text.startswith(header):
              raise SystemExit('Unexpected account_page.dart ignore header')
          text = text[len(header):]
          dead = """    final visibleEmail = _profileEmail.trim().isNotEmpty
        ? _profileEmail.trim()
        : (user.email ?? '');
"""
          count = text.count(dead)
          if count != 1:
              raise SystemExit(f'visibleEmail block: expected 1 occurrence, found {count}')
          text = text.replace(dead, '', 1)
          path.write_text(text)
          PY

          set +e
          flutter analyze --fatal-infos lib/pages/account_page.dart 2>&1 | tee /tmp/account-cascade-analyze.log
          analyze_status=${PIPESTATUS[0]}
          set -e

          mkdir -p docs/quality
          {
            echo '# Lot 3 — account_page.dart unused cascade probe'
            echo
            echo 'Base: f873b0845f9ca691e9e7bba1ac23e5a938af9221'
            echo
            echo 'Workspace simulation: file-level unused ignore removed and visibleEmail deleted.'
            echo
            echo '```text'
            grep -E 'unused_(element|field|local_variable|element_parameter)' /tmp/account-cascade-analyze.log || true
            echo '```'
            echo
            echo "Analyzer exit status: ${analyze_status}"
          } > docs/quality/lot3-account-unused-cascade-probe.md

          git checkout -- lib/pages/account_page.dart
          git diff -- lib/pages/account_page.dart --exit-code

      - name: Commit cascade probe report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/quality/lot3-account-unused-cascade-probe.md
          if git diff --cached --quiet; then
            echo 'Cascade probe report unchanged.'
            exit 0
          fi
          git commit -m 'chore(lot3): record account unused cascade probe'
          git push origin HEAD:refactor/lot3-account-unused-probe-20260807
