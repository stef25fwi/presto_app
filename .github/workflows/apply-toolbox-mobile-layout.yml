name: Apply toolbox mobile layout update

on:
  push:
    branches:
      - fix/toolbox-mobile-layout-buttons

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/toolbox-mobile-layout-buttons
          fetch-depth: 0

      - name: Improve smartphone layout and action buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/pages/toolbox_page.dart')
          text = path.read_text()

          replacements = {
              "const double kToolboxOuterPadding = 8;": "const double kToolboxOuterPadding = 6;",
              """      child: Column(
        crossAxisAlignment: CrossAxisAlignment.start,
        children: [""": """      child: Column(
        mainAxisSize: MainAxisSize.max,
        crossAxisAlignment: CrossAxisAlignment.start,
        children: [""",
              """          SizedBox(height: bottomGap),
          _GradientActionButton(""": """          const Spacer(),
          SizedBox(height: bottomGap),
          _GradientActionButton(""",
              "height: ultraTight ? 36 : (tight ? 44 : (compact ? 50 : 56)),": "height: ultraTight ? 44 : (tight ? 52 : (compact ? 58 : 62)),",
              """                fontSize:
                    ultraTight ? 12.5 : (tight ? 15 : (compact ? 17 : 20)),""": """                fontSize:
                    ultraTight ? 14 : (tight ? 16 : (compact ? 18 : 21)),""",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected source block not found: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-toolbox-mobile-layout.yml

      - name: Commit generated source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/toolbox_page.dart .github/workflows/apply-toolbox-mobile-layout.yml
          git commit -m "fix(toolbox): enlarge mobile buttons and balance cards"
          git push origin HEAD:fix/toolbox-mobile-layout-buttons
