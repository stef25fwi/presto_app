name: Temporary fix PR validation 794

on:
  push:
    branches:
      - coverage/apple-profile-clean-20260725
    paths:
      - .github/workflows/temp-fix-pr-validation-794.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: coverage/apple-profile-clean-20260725
          fetch-depth: 0

      - name: Fix conditional outcome aggregation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pr-validation.yml')
          text = path.read_text()
          old = """      - name: Enforce validation result
        if: always()
        run: |
          outcomes='${{ steps.generated_check.outcome }} ${{ steps.flutter_deps.outcome }} ${{ steps.flutter_analyze.outcome }} ${{ steps.flutter_test.outcome }} ${{ steps.quality_gate.outcome }} ${{ steps.critical_coverage.outcome }} ${{ steps.functions_deps.outcome }} ${{ steps.functions_build.outcome }} ${{ steps.functions_test.outcome }} ${{ steps.firebase_cli.outcome }} ${{ steps.firestore_rules.outcome }} ${{ steps.web_build.outcome }} ${{ steps.bundle_budget.outcome }}'
          if echo \"$outcomes\" | grep -Eq 'failure|cancelled'; then
            echo \"Validation failed: $outcomes\"
            exit 1
          fi
          echo \"Validation succeeded: $outcomes\"
"""
          new = """      - name: Enforce validation result
        if: always()
        env:
          FUNCTIONS_CHANGED: ${{ steps.scope.outputs.functions }}
          FIRESTORE_CHANGED: ${{ steps.scope.outputs.firestore }}
          WEB_CHANGED: ${{ steps.scope.outputs.web }}
        run: |
          set -euo pipefail
          required_outcomes='${{ steps.generated_check.outcome }} ${{ steps.flutter_deps.outcome }} ${{ steps.flutter_analyze.outcome }} ${{ steps.flutter_test.outcome }} ${{ steps.quality_gate.outcome }} ${{ steps.critical_coverage.outcome }}'

          if [ \"$FUNCTIONS_CHANGED\" = 'true' ]; then
            required_outcomes=\"$required_outcomes ${{ steps.functions_deps.outcome }} ${{ steps.functions_build.outcome }} ${{ steps.functions_test.outcome }}\"
          fi
          if [ \"$FIRESTORE_CHANGED\" = 'true' ]; then
            required_outcomes=\"$required_outcomes ${{ steps.firebase_cli.outcome }} ${{ steps.firestore_rules.outcome }}\"
          fi
          if [ \"$WEB_CHANGED\" = 'true' ]; then
            required_outcomes=\"$required_outcomes ${{ steps.web_build.outcome }} ${{ steps.bundle_budget.outcome }}\"
          fi

          if echo \"$required_outcomes\" | grep -Eq 'failure|cancelled|skipped'; then
            echo \"Validation failed: $required_outcomes\"
            exit 1
          fi
          echo \"Validation succeeded: $required_outcomes\"
"""
          if old not in text:
              raise SystemExit('validation aggregation block not found')
          path.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/workflows/temp-fix-pr-validation-794.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pr-validation.yml .github/workflows/temp-fix-pr-validation-794.yml
          git commit -m 'ci: enforce only required validation scopes'
          git push origin HEAD:coverage/apple-profile-clean-20260725
