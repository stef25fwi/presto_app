name: Production go-live readiness

on:
  pull_request:
    paths:
      - 'quality/production_go_live_readiness.json'
      - 'tools/quality/check_production_go_live_readiness.mjs'
      - 'tools/quality/check_production_go_live_readiness.test.mjs'
      - '.github/workflows/production-go-live-readiness.yml'
      - 'docs/production/PHASE_16_GO_LIVE_EVIDENCE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-go-live-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate go-live registry
        run: node tools/quality/check_production_go_live_readiness.mjs
      - name: Run go-live tests
        run: node --test tools/quality/check_production_go_live_readiness.test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: production-go-live-readiness-report
          path: build/quality/production-go-live-readiness-report.json
          retention-days: 30
