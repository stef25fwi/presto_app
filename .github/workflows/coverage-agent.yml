name: Coverage Autopilot

on:
  workflow_dispatch:
    inputs:
      global_target:
        description: Global LCOV target percentage
        required: false
        default: "80"
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "tools/coverage/**"
      - ".github/workflows/coverage-agent.yml"

concurrency:
  group: coverage-autopilot
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  measure-and-dispatch:
    name: Measure LCOV and dispatch one priority lane
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with real LCOV coverage
        run: flutter test --coverage

      - name: Select the highest-value priority target
        id: target
        env:
          INPUT_TARGET: ${{ inputs.global_target }}
          REPOSITORY_TARGET: ${{ vars.COVERAGE_GLOBAL_TARGET }}
        run: |
          set -euo pipefail
          target="${INPUT_TARGET:-${REPOSITORY_TARGET:-80}}"
          mkdir -p quality_reports/coverage-agent
          python3 tools/coverage/coverage_agent.py \
            --lcov coverage/lcov.info \
            --json-output quality_reports/coverage-agent/target.json \
            --markdown-output quality_reports/coverage-agent/issue.md \
            --global-target "$target"

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data = json.loads(
              Path("quality_reports/coverage-agent/target.json").read_text()
          )
          print(f"target_reached={str(data['global']['target_reached']).lower()}")
          print(f"global_percent={data['global']['percent']}")
          print(f"category={data['target']['category']}")
          print(f"path={data['target']['path']}")
          PY

      - name: Upload LCOV and selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-agent-${{ github.run_id }}
          path: |
            coverage/lcov.info
            quality_reports/coverage-agent/target.json
            quality_reports/coverage-agent/issue.md
          retention-days: 14

      - name: Detect an active coverage pull request
        if: steps.target.outputs.target_reached != 'true'
        id: active_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh pr list \
            --state open \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("coverage/"))] | length')
          echo "exists=$([[ "$count" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "active_count=$count" >> "$GITHUB_OUTPUT"

      - name: Ensure coverage labels exist
        if: steps.target.outputs.target_reached != 'true' && steps.active_pr.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create "coverage-agent" \
            --description "Task generated from real LCOV coverage" \
            --color "1D76DB" --force
          gh label create "coverage:${{ steps.target.outputs.category }}" \
            --description "Coverage priority domain" \
            --color "FBCA04" --force

      - name: Create one active coverage mission
        if: steps.target.outputs.target_reached != 'true' && steps.active_pr.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_ASSIGNEE: ${{ vars.COVERAGE_AGENT_ASSIGNEE }}
        run: |
          set -euo pipefail

          existing=$(gh issue list \
            --state open \
            --label coverage-agent \
            --json number \
            --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "An active coverage mission already exists; skipping."
            exit 0
          fi

          category='${{ steps.target.outputs.category }}'
          path='${{ steps.target.outputs.path }}'
          command=(gh issue create
            --title "[Coverage Agent] ${category} — ${path}"
            --body-file quality_reports/coverage-agent/issue.md
            --label coverage-agent
            --label "coverage:${category}")
          if [ -n "${AGENT_ASSIGNEE:-}" ]; then
            command+=(--assignee "$AGENT_ASSIGNEE")
          fi
          "${command[@]}"

      - name: Report active coverage work
        if: steps.target.outputs.target_reached != 'true' && steps.active_pr.outputs.exists == 'true'
        run: |
          echo "Coverage work already active in ${{ steps.active_pr.outputs.active_count }} pull request(s); no duplicate mission created."

      - name: Report target reached
        if: steps.target.outputs.target_reached == 'true'
        run: |
          echo "Global LCOV target reached: ${{ steps.target.outputs.global_percent }}%."
