name: Coverage Factory 5x2

on:
  workflow_dispatch:
    inputs:
      force_measure:
        description: Force a complete LCOV measurement
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "quality/critical-coverage.json"
      - "tools/coverage/**"
      - ".github/workflows/coverage-agent.yml"
  workflow_run:
    workflows: ["Pull request validation"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: coverage-factory-5x2
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
  checks: read

jobs:
  plan:
    name: Measure LCOV and fill two worker lanes
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Detect available worker slots
        id: slots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create coverage-worker --repo "$GITHUB_REPOSITORY" \
            --color 5319E7 --description "Coverage Factory parallel worker" --force
          active_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json headRefName --jq '[.[] | select(.headRefName | startswith("coverage/w"))] | length')"
          active_issues="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label coverage-worker --limit 100 --json number --jq 'length')"
          occupied="$active_prs"
          [ "$active_issues" -gt "$occupied" ] && occupied="$active_issues"
          [ "$occupied" -gt 2 ] && occupied=2
          available=$((2 - occupied))
          echo "active_prs=$active_prs" >> "$GITHUB_OUTPUT"
          echo "active_issues=$active_issues" >> "$GITHUB_OUTPUT"
          echo "occupied=$occupied" >> "$GITHUB_OUTPUT"
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "Worker slots available: $available"

      - name: Skip unchanged main when no slot exists
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_MEASURE: ${{ inputs.force_measure }}
          AVAILABLE: ${{ steps.slots.outputs.available }}
        run: |
          set -euo pipefail
          main_sha="$(git rev-parse HEAD)"
          previous_sha="$(gh issue view 553 --repo "$GITHUB_REPOSITORY" --comments \
            --json comments --jq '[.comments[].body | capture("<!-- coverage-factory-main-sha:(?<sha>[0-9a-f]{40}) -->")?.sha] | map(select(. != null)) | last // ""')"
          run=true
          if [ "$AVAILABLE" = "0" ]; then
            run=false
          elif [ "${FORCE_MEASURE:-false}" != "true" ] && [ "$main_sha" = "$previous_sha" ]; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter 3.44.6
        if: steps.dedupe.outputs.run == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.dedupe.outputs.run == 'true'
        run: flutter pub get

      - name: Measure real main LCOV
        if: steps.dedupe.outputs.run == 'true'
        run: flutter test --coverage

      - name: Select five critical targets
        if: steps.dedupe.outputs.run == 'true'
        run: |
          mkdir -p quality_reports/coverage-factory
          python3 tools/coverage/coverage_agent.py \
            --lcov coverage/lcov.info \
            --config quality/critical-coverage.json \
            --json-output quality_reports/coverage-factory/targets.json \
            --markdown-output quality_reports/coverage-factory/targets.md \
            --global-target "${{ vars.COVERAGE_GLOBAL_TARGET || '80' }}"

      - name: Build two independent worker missions
        if: steps.dedupe.outputs.run == 'true'
        id: factory
        env:
          AVAILABLE: ${{ steps.slots.outputs.available }}
        run: |
          python3 tools/coverage/coverage_factory.py \
            --input quality_reports/coverage-factory/targets.json \
            --output quality_reports/coverage-factory/workers.json \
            --markdown quality_reports/coverage-factory/workers.md \
            --limit "$AVAILABLE"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('quality_reports/coverage-factory/workers.json').read_text())
          print(f"count={len(data['workers'])}")
          print(f"global_percent={data.get('global', {}).get('percent', 0)}")
          PY

      - name: Create worker missions
        if: steps.dedupe.outputs.run == 'true' && steps.factory.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_ASSIGNEE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/workers.tsv
          import json
          from pathlib import Path
          data = json.loads(Path('quality_reports/coverage-factory/workers.json').read_text())
          for worker in data['workers']:
              print('\t'.join([
                  str(worker['worker']),
                  str(worker['category']),
                  str(worker['module_label']),
                  str(worker['path']),
                  str(worker['current_percent']),
                  str(worker['uncovered']),
                  str(worker['uncovered_ranges']),
                  str(worker['branch_prefix']),
              ]))
          PY

          while IFS=$'\t' read -r worker category label path percent uncovered ranges prefix; do
            [ -n "$worker" ] || continue
            existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label coverage-worker --search "worker-$worker $path" --json number --jq 'length')"
            [ "$existing" != "0" ] && continue
            branch="${prefix}-$(date -u +%Y%m%d-%H%M%S)"
            body="$(cat <<EOF
          ## Worker $worker — Coverage Factory 5×2

          - Parcours : **$label**
          - Fichier de production : \`$path\`
          - Couverture actuelle : **$percent %**
          - Objectif fichier : **100 % LCOV réel**
          - Lignes non couvertes : **$uncovered**
          - Plages : \`$ranges\`
          - Branche réservée : \`$branch\`

          ### Passe 1 — rendement rapide
          Couvrir les chemins publics, validations, retours anticipés, succès, erreurs, valeurs nulles et états vides jusqu’à environ 90–95 %.

          ### Passe 2 — fermeture à 100 %
          Relire le LCOV ciblé et ajouter uniquement les scénarios correspondant aux lignes encore à zéro.

          ### Boucle rapide obligatoire
          1. \`dart format <test-file>\`
          2. \`flutter test <test-file>\`
          3. \`flutter analyze $path <test-file>\`

          ### Validation finale avant PR
          1. \`dart format --set-exit-if-changed lib test\`
          2. \`flutter analyze --fatal-infos\`
          3. \`flutter test --coverage\`
          4. \`python3 tools/quality/check_critical_coverage.py --enforce\`

          ### Garde-fous
          - tests comportementaux déterministes uniquement ;
          - aucun skip, test vide, délai arbitraire ou exclusion LCOV ;
          - aucune baisse de seuil ;
          - une PR par worker ; fusion séquentielle ;
          - consigner le LCOV avant/après du fichier et du parcours.

          <!-- coverage-worker:$worker -->
          EOF
          )"
            args=()
            [ -n "${AGENT_ASSIGNEE:-}" ] && args=(--assignee "$AGENT_ASSIGNEE")
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "[Coverage worker-$worker] $category — $path vers 100 %" \
              --body "$body" --label coverage-agent --label coverage-worker "${args[@]}"
          done < /tmp/workers.tsv

      - name: Update central dashboard
        if: steps.dedupe.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.dedupe.outputs.main_sha }}
          COUNT: ${{ steps.factory.outputs.count }}
          GLOBAL_PERCENT: ${{ steps.factory.outputs.global_percent }}
        run: |
          gh issue comment 553 --repo "$GITHUB_REPOSITORY" --body "### Coverage Factory 5×2 — run $GITHUB_RUN_ID

          - Couverture globale : **${GLOBAL_PERCENT}%**
          - Nouveaux workers préparés : **${COUNT}**
          - Capacité maximale : **2 branches indépendantes**
          - Validation : ciblée pendant l’écriture, complète avant fusion

          <!-- coverage-factory-main-sha:${MAIN_SHA} -->"

      - name: Upload factory evidence
        if: always() && steps.dedupe.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-factory-${{ github.run_id }}
          path: |
            coverage/lcov.info
            quality_reports/coverage-factory/
          if-no-files-found: ignore
          retention-days: 14
