name: Coverage Autopilot

on:
  workflow_dispatch:
    inputs:
      global_target:
        description: Global LCOV target percentage
        required: false
        default: "80"
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "tools/coverage/**"
      - ".github/workflows/coverage-agent.yml"

concurrency:
  group: coverage-autopilot
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  measure-and-dispatch:
    name: Measure LCOV and dispatch priority lanes
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with real LCOV coverage
        run: flutter test --coverage

      - name: Select one target per priority domain
        id: target
        env:
          INPUT_TARGET: ${{ inputs.global_target }}
          REPOSITORY_TARGET: ${{ vars.COVERAGE_GLOBAL_TARGET }}
        run: |
          set -euo pipefail
          target="${INPUT_TARGET:-${REPOSITORY_TARGET:-80}}"
          mkdir -p quality_reports/coverage-agent
          python3 tools/coverage/coverage_agent.py \
            --lcov coverage/lcov.info \
            --json-output quality_reports/coverage-agent/target.json \
            --markdown-output quality_reports/coverage-agent/issue.md \
            --global-target "$target"

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data = json.loads(
              Path("quality_reports/coverage-agent/target.json").read_text()
          )
          print(f"target_reached={str(data['global']['target_reached']).lower()}")
          print(f"global_percent={data['global']['percent']}")
          print(f"target_count={len(data['targets'])}")
          PY

      - name: Upload LCOV and selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-agent-${{ github.run_id }}
          path: |
            coverage/lcov.info
            quality_reports/coverage-agent/target.json
            quality_reports/coverage-agent/issue.md
          retention-days: 30

      - name: Ensure coverage labels exist
        if: steps.target.outputs.target_reached != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create "coverage-agent" \
            --description "Task generated from real LCOV coverage" \
            --color "1D76DB" --force

          python3 - <<'PY' > /tmp/coverage-categories.txt
          import json
          from pathlib import Path

          data = json.loads(
              Path("quality_reports/coverage-agent/target.json").read_text()
          )
          for target in data["targets"]:
              print(target["category"])
          PY

          while IFS= read -r category; do
            gh label create "coverage:${category}" \
              --description "Coverage priority domain" \
              --color "FBCA04" --force
          done < /tmp/coverage-categories.txt

      - name: Create one active task per priority domain
        if: steps.target.outputs.target_reached != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_ASSIGNEE: ${{ vars.COVERAGE_AGENT_ASSIGNEE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import textwrap
          from pathlib import Path

          data = json.loads(
              Path("quality_reports/coverage-agent/target.json").read_text()
          )
          global_data = data["global"]
          assignee = os.environ.get("AGENT_ASSIGNEE", "").strip()

          for target in data["targets"]:
              category = target["category"]
              label = f"coverage:{category}"
              existing = subprocess.run(
                  [
                      "gh",
                      "issue",
                      "list",
                      "--state",
                      "open",
                      "--label",
                      "coverage-agent",
                      "--label",
                      label,
                      "--json",
                      "number",
                      "--jq",
                      "length",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()
              if existing != "0":
                  print(f"Active task already exists for {category}; skipping.")
                  continue

              body = textwrap.dedent(
                  f"""\
                  ## Mission de couverture automatique

                  ### Mesure réelle
                  - Couverture globale LCOV : **{global_data['percent']:.2f} %** ({global_data['hit']}/{global_data['found']})
                  - Objectif global : **{global_data['target']:.2f} %**
                  - Domaine prioritaire : **{category}**
                  - Fichier sélectionné : `{target['path']}`
                  - Couverture du fichier : **{target['percent']:.2f} %** ({target['hit']}/{target['found']})
                  - Lignes non couvertes : `{target['uncovered_ranges']}`

                  ### Travail demandé
                  1. Lire le fichier et ses tests existants.
                  2. Ajouter des tests comportementaux déterministes pour augmenter sa couverture.
                  3. Extraire uniquement les dépendances strictement nécessaires à la testabilité.
                  4. Exécuter `dart format`, `flutter analyze`, `flutter test` et `flutter test --coverage`.
                  5. Fournir dans la PR la couverture avant/après, globale et pour ce fichier.

                  ### Garde-fous obligatoires
                  - Ne pas abaisser de seuil de couverture.
                  - Ne pas exclure de fichier ou de ligne du LCOV.
                  - Ne pas ajouter `skip`, faux succès, attente arbitraire ou test vide.
                  - Ne pas modifier le comportement produit sauf correction justifiée et testée.
                  - Une seule cible principale par PR.
                  - Ne pas fusionner si les tests échouent ou si la couverture globale régresse.

                  ### Critère de fin
                  La PR doit augmenter la couverture LCOV réelle et conserver tous les contrôles au vert.
                  """
              )
              body_path = Path(f"/tmp/coverage-{category}.md")
              body_path.write_text(body, encoding="utf-8")
              title = f"[Coverage Agent] {category} — {target['path']}"
              command = [
                  "gh",
                  "issue",
                  "create",
                  "--title",
                  title,
                  "--body-file",
                  str(body_path),
                  "--label",
                  "coverage-agent",
                  "--label",
                  label,
              ]
              if assignee:
                  command.extend(["--assignee", assignee])
              subprocess.run(command, check=True)
          PY

      - name: Report target reached
        if: steps.target.outputs.target_reached == 'true'
        run: |
          echo "Global LCOV target reached: ${{ steps.target.outputs.global_percent }}%."
