name: Coverage 80% Single Agent

on:
  workflow_dispatch:
    inputs:
      global_target:
        description: Global LCOV target percentage
        required: false
        default: "80"
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "tools/coverage/**"
      - ".github/workflows/coverage-agent.yml"

concurrency:
  group: coverage-80-single-agent
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  measure-and-steer:
    name: Measure LCOV and steer the single active mission
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with real LCOV coverage
        run: flutter test --coverage

      - name: Select the highest-value priority target
        id: target
        env:
          INPUT_TARGET: ${{ inputs.global_target }}
          REPOSITORY_TARGET: ${{ vars.COVERAGE_GLOBAL_TARGET }}
        run: |
          set -euo pipefail
          target="${INPUT_TARGET:-${REPOSITORY_TARGET:-80}}"
          mkdir -p quality_reports/coverage-agent
          python3 tools/coverage/coverage_agent.py \
            --lcov coverage/lcov.info \
            --json-output quality_reports/coverage-agent/target.json \
            --markdown-output quality_reports/coverage-agent/issue.md \
            --global-target "$target"

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data = json.loads(
              Path("quality_reports/coverage-agent/target.json").read_text()
          )
          print(f"target_reached={str(data['global']['target_reached']).lower()}")
          print(f"global_percent={data['global']['percent']}")
          print(f"category={data['target']['category']}")
          print(f"path={data['target']['path']}")
          PY

      - name: Detect the single active coverage pull request
        id: active_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list \
            --state open \
            --json number,title,url,headRefName \
            --jq '[.[] | select(.headRefName | startswith("coverage/"))] | .[0] // {}' \
            > /tmp/active-coverage-pr.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/active-coverage-pr.json').read_text())
          print(f"exists={str(bool(data)).lower()}")
          print(f"number={data.get('number', '')}")
          print(f"title={data.get('title', '')}")
          print(f"url={data.get('url', '')}")
          PY

      - name: Update the single coverage dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          DASHBOARD_ISSUE: "553"
          GLOBAL_PERCENT: ${{ steps.target.outputs.global_percent }}
          TARGET_REACHED: ${{ steps.target.outputs.target_reached }}
          CATEGORY: ${{ steps.target.outputs.category }}
          TARGET_PATH: ${{ steps.target.outputs.path }}
          ACTIVE_PR_EXISTS: ${{ steps.active_pr.outputs.exists }}
          ACTIVE_PR_NUMBER: ${{ steps.active_pr.outputs.number }}
          ACTIVE_PR_TITLE: ${{ steps.active_pr.outputs.title }}
          ACTIVE_PR_URL: ${{ steps.active_pr.outputs.url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          active = os.environ.get("ACTIVE_PR_EXISTS") == "true"
          reached = os.environ.get("TARGET_REACHED") == "true"
          if reached:
              status = "✅ Objectif global atteint."
          elif active:
              status = (
                  f"🔄 PR active : #{os.environ.get('ACTIVE_PR_NUMBER')} "
                  f"[{os.environ.get('ACTIVE_PR_TITLE')}]"
                  f"({os.environ.get('ACTIVE_PR_URL')})"
              )
          else:
              status = "🟠 Aucune PR de couverture active : la cible ci-dessous est prête."

          body = f"""## Agent unique LCOV vers 80 %

          Ce ticket est l'unique tableau de bord de couverture. Aucun autre ticket `coverage-agent` ne doit être ouvert en parallèle.

          ## État automatique

          - Couverture globale réelle : **{os.environ.get('GLOBAL_PERCENT')} %**
          - Objectif : **80 %**
          - Domaine prioritaire suivant : **{os.environ.get('CATEGORY')}**
          - Fichier cible suivant : `{os.environ.get('TARGET_PATH')}`
          - Statut : {status}
          - Dernière mise à jour : exécution GitHub Actions `{os.environ.get('GITHUB_RUN_ID')}`

          ## Boucle obligatoire

          1. Une seule branche `coverage/*` et une seule PR active.
          2. Mesure LCOV réelle depuis `main`.
          3. Sélection de la cible au meilleur rendement dans l'ordre : paiements, publication, messagerie, administration, authentification.
          4. Tests comportementaux déterministes uniquement.
          5. Aucun seuil abaissé, aucune exclusion artificielle, aucun `skip` ou faux succès.
          6. Après fusion, recalcul immédiat et sélection de la cible suivante.
          7. Répéter jusqu'à une couverture globale réelle supérieure ou égale à 80 %.

          ## Contrôles avant fusion

          - `dart format`
          - `flutter analyze`
          - `flutter test`
          - `flutter test --coverage`
          - contrôles Functions et règles Firestore
          - build Web
          - absence de régression LCOV globale
          """
          Path('/tmp/coverage-dashboard.md').write_text(body, encoding='utf-8')
          PY
          gh issue edit "$DASHBOARD_ISSUE" --body-file /tmp/coverage-dashboard.md

      - name: Upload LCOV and selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-agent-${{ github.run_id }}
          path: |
            coverage/lcov.info
            quality_reports/coverage-agent/target.json
            quality_reports/coverage-agent/issue.md
          retention-days: 14

      - name: Report next action
        run: |
          if [ "${{ steps.target.outputs.target_reached }}" = "true" ]; then
            echo "Global LCOV target reached: ${{ steps.target.outputs.global_percent }}%."
          elif [ "${{ steps.active_pr.outputs.exists }}" = "true" ]; then
            echo "Single coverage PR already active: #${{ steps.active_pr.outputs.number }}."
          else
            echo "Next target ready: ${{ steps.target.outputs.category }} — ${{ steps.target.outputs.path }}."
          fi
