name: Coverage Autopilot

on:
  workflow_dispatch:
    inputs:
      global_target:
        description: Global LCOV target percentage
        required: false
        default: "80"
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "tools/coverage/**"
      - ".github/workflows/coverage-agent.yml"

concurrency:
  group: coverage-autopilot
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  measure-and-dispatch:
    name: Measure LCOV and dispatch next task
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with real LCOV coverage
        run: flutter test --coverage

      - name: Select the next priority target
        id: target
        env:
          INPUT_TARGET: ${{ inputs.global_target }}
          REPOSITORY_TARGET: ${{ vars.COVERAGE_GLOBAL_TARGET }}
        run: |
          set -euo pipefail
          target="${INPUT_TARGET:-${REPOSITORY_TARGET:-80}}"
          mkdir -p quality_reports/coverage-agent
          python3 tools/coverage/coverage_agent.py \
            --lcov coverage/lcov.info \
            --json-output quality_reports/coverage-agent/target.json \
            --markdown-output quality_reports/coverage-agent/issue.md \
            --global-target "$target"

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path("quality_reports/coverage-agent/target.json").read_text())
          print(f"target_reached={str(data['global']['target_reached']).lower()}")
          print(f"global_percent={data['global']['percent']}")
          print(f"category={data['target']['category']}")
          print(f"target_path={data['target']['path']}")
          PY

      - name: Upload LCOV and selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-agent-${{ github.run_id }}
          path: |
            coverage/lcov.info
            quality_reports/coverage-agent/target.json
            quality_reports/coverage-agent/issue.md
          retention-days: 30

      - name: Ensure coverage labels exist
        if: steps.target.outputs.target_reached != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create "coverage-agent" \
            --description "Task generated from real LCOV coverage" \
            --color "1D76DB" --force
          gh label create "coverage:${{ steps.target.outputs.category }}" \
            --description "Coverage priority domain" \
            --color "FBCA04" --force

      - name: Detect an existing active coverage task
        id: existing
        if: steps.target.outputs.target_reached != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh issue list \
            --state open \
            --label coverage-agent \
            --json number \
            --jq 'length')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Create exactly one focused coding-agent task
        if: steps.target.outputs.target_reached != 'true' && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_ASSIGNEE: ${{ vars.COVERAGE_AGENT_ASSIGNEE }}
        run: |
          set -euo pipefail
          title="[Coverage Agent] ${{ steps.target.outputs.category }} — ${{ steps.target.outputs.target_path }}"
          args=(
            issue create
            --title "$title"
            --body-file quality_reports/coverage-agent/issue.md
            --label coverage-agent
            --label "coverage:${{ steps.target.outputs.category }}"
          )
          if [ -n "${AGENT_ASSIGNEE:-}" ]; then
            args+=(--assignee "$AGENT_ASSIGNEE")
          fi
          gh "${args[@]}"

      - name: Report target reached
        if: steps.target.outputs.target_reached == 'true'
        run: |
          echo "Global LCOV target reached: ${{ steps.target.outputs.global_percent }}%."
