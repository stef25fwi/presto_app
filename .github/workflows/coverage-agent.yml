name: Coverage 80% Autopilot

on:
  workflow_dispatch:
    inputs:
      global_target:
        description: Global LCOV target percentage
        required: false
        default: "80"
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "tools/coverage/**"
      - ".github/workflows/coverage-agent.yml"

concurrency:
  group: coverage-80-autopilot
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
  checks: read

jobs:
  autopilot:
    name: Measure and dispatch the single LCOV mission
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Measure the real main baseline
        run: |
          set -euo pipefail
          flutter test --coverage

      - name: Select the highest-value priority target
        id: target
        env:
          INPUT_TARGET: ${{ inputs.global_target }}
          REPOSITORY_TARGET: ${{ vars.COVERAGE_GLOBAL_TARGET }}
        run: |
          set -euo pipefail
          target="${INPUT_TARGET:-${REPOSITORY_TARGET:-80}}"
          mkdir -p quality_reports/coverage-agent
          python3 tools/coverage/coverage_agent.py \
            --lcov coverage/lcov.info \
            --json-output quality_reports/coverage-agent/target.json \
            --markdown-output quality_reports/coverage-agent/issue.md \
            --global-target "$target"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path("quality_reports/coverage-agent/target.json").read_text())
          print(f"target_reached={str(data['global']['target_reached']).lower()}")
          print(f"global_percent={data['global']['percent']}")
          print(f"category={data['target']['category']}")
          print(f"path={data['target']['path']}")
          PY

      - name: Detect the single active coverage pull request
        id: active_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --state open --json number,title,url,headRefName \
            --jq '[.[] | select(.headRefName | startswith("coverage/"))] | .[0] // {}' \
            > /tmp/active-coverage-pr.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/active-coverage-pr.json').read_text())
          print(f"exists={str(bool(data)).lower()}")
          print(f"number={data.get('number', '')}")
          print(f"url={data.get('url', '')}")
          PY

      - name: Detect an existing open coverage mission
        id: active_mission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue list --state open --label coverage-agent --limit 100 \
            --json number,title,url \
            --jq '[.[] | select(.number != 553)] | .[0] // {}' \
            > /tmp/active-coverage-mission.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/active-coverage-mission.json').read_text())
          print(f"exists={str(bool(data)).lower()}")
          print(f"number={data.get('number', '')}")
          print(f"url={data.get('url', '')}")
          PY

      - name: Create the unique coverage mission without external AI key
        id: mission
        if: steps.target.outputs.target_reached != 'true' && steps.active_pr.outputs.exists != 'true' && steps.active_mission.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PATH: ${{ steps.target.outputs.path }}
          TARGET_CATEGORY: ${{ steps.target.outputs.category }}
          GLOBAL_PERCENT: ${{ steps.target.outputs.global_percent }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## Mission unique LCOV

          - Baseline réelle sur main : **${GLOBAL_PERCENT}%**
          - Domaine prioritaire : **${TARGET_CATEGORY}**
          - Cible primaire : \`${TARGET_PATH}\`
          - Objectif global : **80,00 %**

          Ajouter des tests comportementaux déterministes qui exécutent réellement les lignes non couvertes. Une refactorisation minimale pour injecter les dépendances est autorisée uniquement si elle conserve le comportement produit.

          Contrôles obligatoires avant PR :
          - \`dart format\`
          - \`flutter analyze --fatal-infos\`
          - \`flutter test --coverage\`
          - gain LCOV réel avec dénominateur non réduit

          Interdictions : aucun \`skip\`, test vide, attente arbitraire, faux succès, exclusion LCOV ou baisse de seuil. Une seule branche et une seule PR \`coverage/*\` active.
          EOF
          )"
          url="$(gh issue create \
            --title "[Coverage] ${TARGET_CATEGORY} — ${TARGET_PATH}" \
            --body "$body" \
            --label coverage-agent \
            --assignee stef25fwi)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Update the coverage dashboard
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GLOBAL_PERCENT: ${{ steps.target.outputs.global_percent }}
          TARGET_CATEGORY: ${{ steps.target.outputs.category }}
          TARGET_PATH: ${{ steps.target.outputs.path }}
          ACTIVE_PR_URL: ${{ steps.active_pr.outputs.url }}
          ACTIVE_MISSION_URL: ${{ steps.active_mission.outputs.url }}
          CREATED_MISSION_URL: ${{ steps.mission.outputs.url }}
        run: |
          status="Mesure terminée."
          if [ -n "${CREATED_MISSION_URL:-}" ]; then
            status="Nouvelle mission sans clé externe : ${CREATED_MISSION_URL}"
          elif [ -n "${ACTIVE_PR_URL:-}" ]; then
            status="PR de couverture déjà active : ${ACTIVE_PR_URL}"
          elif [ -n "${ACTIVE_MISSION_URL:-}" ]; then
            status="Mission de couverture déjà active : ${ACTIVE_MISSION_URL}"
          elif [ "${{ steps.target.outputs.target_reached }}" = "true" ]; then
            status="✅ Objectif global atteint."
          fi
          gh issue comment 553 --body \
            "### Coverage Autopilot sans clé externe — run $GITHUB_RUN_ID

          - Couverture main : **${GLOBAL_PERCENT}%**
          - Domaine : **${TARGET_CATEGORY}**
          - Cible : \`${TARGET_PATH}\`
          - Statut : ${status}"

      - name: Upload LCOV and dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-autopilot-${{ github.run_id }}
          path: |
            coverage/lcov.info
            quality_reports/coverage-agent/target.json
            quality_reports/coverage-agent/issue.md
          if-no-files-found: ignore
          retention-days: 14
