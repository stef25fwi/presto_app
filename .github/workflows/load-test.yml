name: Load test staging

on:
  workflow_dispatch:
    inputs:
      app_base_url:
        description: URL de la web app staging
        required: true
        type: string
      firestore_project_id:
        description: Identifiant du projet Firebase staging
        required: true
        type: string
      allow_production:
        description: Autoriser explicitement la production (déconseillé)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reject accidental production target
        env:
          APP_BASE_URL: ${{ inputs.app_base_url }}
          FIRESTORE_PROJECT_ID: ${{ inputs.firestore_project_id }}
          ALLOW_PRODUCTION_LOAD_TEST: ${{ inputs.allow_production }}
        run: |
          if [ "$ALLOW_PRODUCTION_LOAD_TEST" != "true" ]; then
            if echo "$APP_BASE_URL" | grep -Eq '(^|https://)ilipresto\.web\.app'; then
              echo "Production Hosting is forbidden for this load test."
              exit 1
            fi
            if [ "$FIRESTORE_PROJECT_ID" = "presto-app-74abe" ]; then
              echo "Production Firestore is forbidden for this load test."
              exit 1
            fi
          fi

      - name: Prepare result directory
        run: mkdir -p load-tests/results

      - name: Run 1000-user scenario
        env:
          APP_BASE_URL: ${{ inputs.app_base_url }}
          ALLOW_PRODUCTION_LOAD_TEST: ${{ inputs.allow_production }}
          FIRESTORE_PROJECT_ID: ${{ inputs.firestore_project_id }}
        run: |
          docker run --rm \
            -e APP_BASE_URL \
            -e ALLOW_PRODUCTION_LOAD_TEST \
            -e FIRESTORE_PROJECT_ID \
            -v "$PWD:/work" \
            -w /work \
            grafana/k6:latest run load-tests/k6_1000_users.js

      - name: Upload load-test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-load-test-summary
          path: load-tests/results/
          if-no-files-found: warn
          retention-days: 30
