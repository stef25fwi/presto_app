name: Temporary rename preview secrets to staging

on:
  push:
    branches:
      - agent/phase-3-staging-readiness

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3-staging-readiness
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rename preview secrets
        run: node tools/temporary_rename_preview_secrets_to_staging.mjs

      - name: Run staging readiness tests
        run: node --test tools/quality/check_firebase_staging_readiness.test.mjs

      - name: Commit workflow change
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pr-validation.yml
          git commit -m 'ci: utilise des secrets Firebase staging dédiés'
          git push origin HEAD:agent/phase-3-staging-readiness
