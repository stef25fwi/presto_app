name: AI evaluations

on:
  pull_request:
    paths:
      - 'quality/ai-readiness.json'
      - 'docs/evidence/ai/**'
      - 'docs/production/OPENAI_AI_ROLLOUT_RUNBOOK.md'
      - 'tools/quality/check_ai_readiness.mjs'
      - 'tools/quality/check_ai_readiness.test.mjs'
      - 'tools/quality/check_ai_eval_corpus.mjs'
      - 'tools/quality/check_ai_eval_corpus.test.mjs'
      - 'tools/quality/check_ai_metrics_trend.test.mjs'
      - 'functions/evals/**'
      - 'functions/scripts/openai_*eval.mjs'
      - 'functions/scripts/ai_eval_metrics.mjs'
      - 'functions/scripts/ai_media_probe.mjs'
      - 'functions/scripts/ai_metrics_trend.mjs'
      - 'functions/scripts/generate_ai_eval_media.mjs'
      - 'functions/src/modules/ai/**'
      - 'functions/src/modules/marketplace/callables/classify_service_photo.ts'
      - 'shared/listing_taxonomy_v2.json'
      - 'lib/config/listing_taxonomy.dart'
      - 'tools/check_listing_taxonomy_sync.mjs'
      - '.github/workflows/ai-evaluations.yml'
  push:
    branches:
      - main
    paths:
      - 'quality/ai-readiness.json'
      - 'docs/evidence/ai/**'
      - 'docs/production/OPENAI_AI_ROLLOUT_RUNBOOK.md'
      - 'tools/quality/check_ai_readiness.mjs'
      - 'tools/quality/check_ai_readiness.test.mjs'
      - 'tools/quality/check_ai_eval_corpus.mjs'
      - 'tools/quality/check_ai_eval_corpus.test.mjs'
      - 'tools/quality/check_ai_metrics_trend.test.mjs'
      - 'functions/evals/**'
      - 'functions/scripts/openai_*eval.mjs'
      - 'functions/scripts/ai_eval_metrics.mjs'
      - 'functions/scripts/ai_media_probe.mjs'
      - 'functions/scripts/ai_metrics_trend.mjs'
      - 'functions/scripts/generate_ai_eval_media.mjs'
      - 'functions/src/modules/ai/**'
      - 'functions/src/modules/marketplace/callables/classify_service_photo.ts'
      - 'shared/listing_taxonomy_v2.json'
      - 'lib/config/listing_taxonomy.dart'
      - 'tools/check_listing_taxonomy_sync.mjs'
      - '.github/workflows/ai-evaluations.yml'
  workflow_run:
    workflows:
      - Validate and Deploy Firebase
    types:
      - completed
  schedule:
    # Les jeux d'évaluation réels tournent chaque lundi matin afin que la
    # qualité par accent et par format soit re-mesurée régulièrement et pas
    # seulement au moment d'une modification du corpus.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      live:
        description: 'Exécuter les évaluations OpenAI réelles'
        required: false
        default: true
        type: boolean
      enforce_readiness:
        description: 'Exiger que tous les contrôles du point 8 soient verified'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  EVIDENCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout evidence SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Assert evidence SHA consistency
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EVIDENCE_SHA"
          printf 'Validation evidence will be generated for SHA %s\n' "$actual_sha"

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install synthetic speech dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Validate point 8 readiness registry
        run: |
          node tools/quality/check_ai_readiness.test.mjs
          node tools/quality/check_ai_readiness.mjs

      - name: Validate evaluation corpus coverage
        run: |
          node tools/quality/check_ai_eval_corpus.mjs
          node tools/quality/check_ai_eval_corpus.test.mjs
          node tools/quality/check_ai_metrics_trend.test.mjs

      - name: Enforce point 8 completion when requested
        if: github.event_name == 'workflow_dispatch' && inputs.enforce_readiness == true
        run: node tools/quality/check_ai_readiness.mjs --enforce

      - name: Build and test Functions
        run: npm --prefix functions run ci

      - name: Generate synthetic privacy-safe evaluation media
        run: npm --prefix functions run ai:eval:media

      - name: Validate evaluation manifests
        run: |
          npm --prefix functions run ai:eval:transcription:dry
          npm --prefix functions run ai:eval:vision:dry
          npm --prefix functions run ai:prompt:tokens

      - name: Archive validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: ai-validation-${{ env.EVIDENCE_SHA }}
          path: |
            build/quality/ai-readiness-report.json
            build/quality/ai-eval-corpus-report.json
            functions/evals/media
          if-no-files-found: error
          retention-days: 90

  live:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.live == true)
    needs: validate
    environment: recaptcha
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout evidence SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Assert evidence SHA consistency
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EVIDENCE_SHA"
          printf 'Live evaluation evidence will be generated for SHA %s\n' "$actual_sha"

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Install synthetic speech dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng

      - name: Install Functions dependencies and generate media
        run: |
          npm --prefix functions ci
          npm --prefix functions run ai:eval:media

      - name: Load OpenAI key from Secret Manager
        shell: bash
        run: |
          set -euo pipefail
          key="$(gcloud secrets versions access latest --secret=OPENAI_API_KEY --project=presto-app-74abe)"
          test -n "$key"
          echo "::add-mask::$key"
          echo "OPENAI_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Prepare live evaluation report directory
        run: mkdir -p quality_reports/ai

      - name: Run live listing evaluation
        id: listing_eval
        continue-on-error: true
        env:
          AI_EVAL_ENFORCE: 'true'
          OPENAI_INPUT_EUR_PER_MILLION_TOKENS: ${{ vars.OPENAI_INPUT_EUR_PER_MILLION_TOKENS }}
          OPENAI_OUTPUT_EUR_PER_MILLION_TOKENS: ${{ vars.OPENAI_OUTPUT_EUR_PER_MILLION_TOKENS }}
        run: npm --prefix functions run ai:eval:listing -- evals/listing_cases.jsonl ../quality_reports/ai/listing.json

      - name: Run live transcription evaluation
        id: transcription_eval
        continue-on-error: true
        env:
          AI_EVAL_ENFORCE: 'true'
          OPENAI_TRANSCRIPTION_EUR_PER_MINUTE: ${{ vars.OPENAI_TRANSCRIPTION_EUR_PER_MINUTE }}
        run: npm --prefix functions run ai:eval:transcription -- --output ../quality_reports/ai/transcription.json

      - name: Run live vision evaluation
        id: vision_eval
        continue-on-error: true
        env:
          AI_EVAL_ENFORCE: 'true'
          OPENAI_INPUT_EUR_PER_MILLION_TOKENS: ${{ vars.OPENAI_INPUT_EUR_PER_MILLION_TOKENS }}
          OPENAI_OUTPUT_EUR_PER_MILLION_TOKENS: ${{ vars.OPENAI_OUTPUT_EUR_PER_MILLION_TOKENS }}
        run: npm --prefix functions run ai:eval:vision -- --output ../quality_reports/ai/vision.json

      - name: Archive live evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-evaluation-reports-${{ env.EVIDENCE_SHA }}
          path: quality_reports/ai
          if-no-files-found: error
          retention-days: 90

      - name: Enforce all live evaluations
        if: always()
        shell: bash
        env:
          LISTING_OUTCOME: ${{ steps.listing_eval.outcome }}
          TRANSCRIPTION_OUTCOME: ${{ steps.transcription_eval.outcome }}
          VISION_OUTCOME: ${{ steps.vision_eval.outcome }}
        run: |
          set -euo pipefail
          printf 'listing=%s transcription=%s vision=%s\n' "$LISTING_OUTCOME" "$TRANSCRIPTION_OUTCOME" "$VISION_OUTCOME"
          test "$LISTING_OUTCOME" = success
          test "$TRANSCRIPTION_OUTCOME" = success
          test "$VISION_OUTCOME" = success
