name: Lot3 user offers unused atomic

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'refactor/lot3-user-offers-unused-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove unused mask with fail-fast guards
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/pages/user_offers_section.dart')
          text = p.read_text()
          expected = '// ignore_for_file: unused_element, unused_field, unused_local_variable, unused_element_parameter\n\n'
          if not text.startswith(expected):
              raise SystemExit('fail-fast: expected mask not found exactly')
          p.write_text(text[len(expected):])
          doc = Path('docs/quality/lot3-dead-code-user-offers-unused.md')
          doc.write_text('''# Lot 3 — Code mort — user offers\n\nBase : `92682b95614922c2f2243c3812118deac02b18e6`.\n\nCette tranche retire uniquement le masque fichier `unused_element, unused_field, unused_local_variable, unused_element_parameter` de `lib/pages/user_offers_section.dart`.\n\nLa PR finale doit être validée par `flutter analyze`, les tests, les garde-fous architecture/sécurité/Firestore/App Check et le build Web. Si l’analyseur révèle du code mort, la tranche doit être corrigée avant fusion ; aucun seuil, skip ou exclusion ne peut être ajouté.\n\nLot 1 LCOV reste en pause.\n''')
      - name: Remove temporary workflow from final diff
        run: rm .github/workflows/lot3-user-offers-unused-atomic.yml
      - name: Verify scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --name-only | grep -v -E '^(lib/pages/user_offers_section\.dart|docs/quality/lot3-dead-code-user-offers-unused\.md|\.github/workflows/lot3-user-offers-unused-atomic\.yml)$' || true)"
          ! head -n 1 lib/pages/user_offers_section.dart | grep -q 'ignore_for_file:.*unused_'
      - name: Commit final cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(lot3): retirer le masque unused de user offers'
          git push origin HEAD:${{ github.head_ref }}
