name: SEO continuous monitoring

on:
  schedule:
    - cron: '17 10 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/seo-continuous-monitoring.yml'
      - 'config/seo-monitoring.json'
      - 'tools/seo/**'
      - 'tools/quality/check_seo_monitoring_readiness*'
      - 'web/public-route-seo.js'
      - 'web/sitemap.xml'
  workflow_dispatch:
    inputs:
      require_external_data:
        description: 'Exiger les données Search Console et GA4'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: seo-continuous-monitoring
  cancel-in-progress: true

jobs:
  monitor:
    environment: recaptcha
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate SEO monitoring implementation
        run: |
          node tools/quality/check_seo_monitoring_readiness.test.mjs
          node tools/seo/runtime_seo_registry_contract.test.mjs

      - name: Authenticate to Google without a long-lived key
        id: google_auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 1800s
          access_token_scopes: >-
            https://www.googleapis.com/auth/cloud-platform,
            https://www.googleapis.com/auth/webmasters.readonly,
            https://www.googleapis.com/auth/analytics.readonly

      - name: Setup Google Cloud CLI
        if: steps.google_auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v3

      - name: Enable SEO measurement APIs
        id: api_bootstrap
        if: steps.google_auth.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          gcloud services enable \
            searchconsole.googleapis.com \
            analyticsadmin.googleapis.com \
            analyticsdata.googleapis.com \
            --project presto-app-74abe \
            --quiet

      - name: Build daily SEO report
        id: report
        continue-on-error: true
        env:
          SEO_GOOGLE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          SEO_GA4_PROPERTY_ID: ${{ vars.SEO_GA4_PROPERTY_ID }}
          SEO_GSC_SITE_URL: sc-domain:ilipresto.fr
          REQUIRE_EXTERNAL_DATA: ${{ github.event_name != 'workflow_dispatch' || inputs.require_external_data }}
          SEO_API_BOOTSTRAP_OUTCOME: ${{ steps.api_bootstrap.outcome }}
        run: |
          set -euo pipefail
          args=(--output build/seo/seo-monitoring-report.json --enforce)
          if [ "${REQUIRE_EXTERNAL_DATA:-true}" = "true" ]; then
            args+=(--require-external-data)
          fi
          node tools/seo/build_seo_monitoring_report.mjs "${args[@]}"

      - name: Publish report in workflow summary
        if: always()
        run: |
          if [ -f build/seo/seo-monitoring-report.md ]; then
            cat build/seo/seo-monitoring-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Suivi SEO continu" >> "$GITHUB_STEP_SUMMARY"
            echo "Le rapport n'a pas pu être généré." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authentification Google : ${{ steps.google_auth.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Activation des API : ${{ steps.api_bootstrap.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SEO monitoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-monitoring-${{ github.run_id }}
          path: build/seo/
          if-no-files-found: warn
          retention-days: 90

      - name: Open, update or close the SEO alert issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[SEO] Alerte de suivi continu iliprestō';
            const reportPath = 'build/seo/seo-monitoring-report.json';
            const markdownPath = 'build/seo/seo-monitoring-report.md';

            let report = null;
            if (fs.existsSync(reportPath)) {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            }
            const markdown = fs.existsSync(markdownPath)
              ? fs.readFileSync(markdownPath, 'utf8')
              : '# Suivi SEO continu\n\nLe rapport n’a pas pu être généré.';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            const actionable = !report || report.status !== 'healthy';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${markdown}\n---\nWorkflow : ${runUrl}\n`;

            if (actionable) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Nouvelle analyse disponible : ${runUrl}`,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Retour à la normale confirmé : ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }

      - name: Enforce monitoring result
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'build/seo/seo-monitoring-report.json';
          if (!fs.existsSync(path)) {
            console.error('SEO monitoring report is missing.');
            process.exit(1);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (report.status === 'critical') {
            console.error('Critical SEO monitoring alert detected.');
            process.exit(1);
          }
          console.log(`SEO monitoring completed with status: ${report.status}`);
          NODE
