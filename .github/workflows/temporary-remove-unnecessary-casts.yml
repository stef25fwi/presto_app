name: Temporary remove unnecessary casts

on:
  push:
    branches:
      - agent/phase-0-analyzer-ignore-11

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-analyzer-ignore-11
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove unnecessary casts
        run: node tools/temporary_remove_unnecessary_casts.mjs

      - name: Commit targeted changes
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/account/signed_out_account_fallback.dart \
            lib/pages/fiche_pro_page.dart \
            tools/convert_communes_by_dept.dart
          git commit -m 'fix: retire quatre casts devenus inutiles'
          git push origin HEAD:agent/phase-0-analyzer-ignore-11
