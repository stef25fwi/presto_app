name: Record production deploy 518

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/record-production-deploy-518.yml

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record Firebase deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 7cd8ab037772827a92a0fa2278f782c24be8d016
          EVIDENCE_BRANCH: agent/subscription-credits-dashboard
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          push_run=$(gh api "repos/$repo/actions/workflows/deploy.yml/runs?head_sha=$TARGET_SHA&event=push&per_page=20")
          manual_runs=$(gh api "repos/$repo/actions/workflows/deploy.yml/runs?event=workflow_dispatch&branch=main&per_page=20")

          python3 - <<'PY' > /tmp/deploy-status.json
          import json, os
          from datetime import datetime, timezone

          push = json.loads(os.environ['PUSH_RUNS']).get('workflow_runs', [])
          manual = json.loads(os.environ['MANUAL_RUNS']).get('workflow_runs', [])
          manual = [r for r in manual if r.get('created_at', '') >= '2026-07-17T03:45:00Z']
          candidates = push + manual
          successful = [r for r in candidates if r.get('conclusion') == 'success']
          selected = sorted(successful or candidates, key=lambda r: r.get('created_at', ''))[-1] if candidates else {}
          print(json.dumps({
              'targetSha': os.environ['TARGET_SHA'],
              'runId': selected.get('id'),
              'runUrl': selected.get('html_url'),
              'event': selected.get('event'),
              'status': selected.get('status', 'missing'),
              'conclusion': selected.get('conclusion', 'missing'),
              'createdAt': selected.get('created_at'),
              'updatedAt': selected.get('updated_at'),
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'productionUrl': 'https://ilipresto.web.app',
          }, ensure_ascii=False, indent=2))
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 7cd8ab037772827a92a0fa2278f782c24be8d016
          EVIDENCE_BRANCH: agent/subscription-credits-dashboard
          PUSH_RUNS: ${{ steps.not_used.outputs.push_runs }}
          MANUAL_RUNS: ${{ steps.not_used.outputs.manual_runs }}

      - name: Publish evidence to technical branch
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_BRANCH: agent/subscription-credits-dashboard
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          path="quality/deploy_518_status.json"
          content=$(base64 -w0 /tmp/deploy-status.json)
          sha=$(gh api "repos/$repo/contents/$path?ref=$EVIDENCE_BRANCH" --jq '.sha' 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api --method PUT "repos/$repo/contents/$path" -f message='chore: mettre à jour la preuve du déploiement 518' -f content="$content" -f sha="$sha" -f branch="$EVIDENCE_BRANCH" >/dev/null
          else
            gh api --method PUT "repos/$repo/contents/$path" -f message='chore: enregistrer la preuve du déploiement 518' -f content="$content" -f branch="$EVIDENCE_BRANCH" >/dev/null
          fi

      - name: Remove recorder
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"
          path=".github/workflows/record-production-deploy-518.yml"
          sha=$(gh api "repos/$repo/contents/$path?ref=main" --jq '.sha' 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api --method DELETE "repos/$repo/contents/$path" -f message='chore: retirer l’enregistreur de déploiement 518 [skip ci]' -f sha="$sha" -f branch=main >/dev/null
          fi
