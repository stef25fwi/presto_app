name: Finalize guided toolbox patch

on:
  push:
    branches:
      - feat/guided-personal-journey

permissions:
  contents: write

concurrency:
  group: finalize-guided-toolbox
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[guided-toolbox-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guided-personal-journey
          fetch-depth: 0

      - name: Apply final toolbox patch
        run: python3 tools/finalize_guided_toolbox_patch.py

      - name: Enforce Flutter architecture budgets
        run: |
          python3 tools/quality/check_flutter_architecture_size.py \
            --changed-only \
            --base-ref main \
            --enforce

      - name: Commit final toolbox patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[guided-toolbox-finalized] fix(toolbox): keep legacy file within size baseline"
          git push origin HEAD:feat/guided-personal-journey
