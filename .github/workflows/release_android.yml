name: Release Android (AAB → Play Console)

# Produit l'Android App Bundle signé exigé par le Play Store pour toute
# nouvelle application, certifie Android 16 / API 36 sur l'artefact final,
# puis l'envoie sur la piste demandée.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Piste Play Console"
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      upload:
        description: "Envoyer sur la Play Console (sinon build + artefact seulement)"
        type: boolean
        default: false
      status:
        description: "Statut de la release Play (draft = rien n'est diffusé)"
        type: choice
        default: draft
        options:
          - draft
          - completed

permissions:
  contents: read
  id-token: write

env:
  FLUTTER_VERSION: '3.44.6'
  ANDROID_API_LEVEL: '36'
  BUNDLETOOL_VERSION: '1.18.3'

jobs:
  build-aab:
    name: Build AAB signé + preuve API 36
    environment: recaptcha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Capture Android release toolchain
        run: |
          set -euo pipefail
          mkdir -p evidence/android-release
          flutter --version | tee evidence/android-release/flutter-version.txt
          flutter doctor -v | tee evidence/android-release/flutter-doctor.txt
          java -version 2>&1 | tee evidence/android-release/java-version.txt
          cat android/gradle/wrapper/gradle-wrapper.properties \
            | tee evidence/android-release/gradle-wrapper-properties.txt
          grep -E 'com.android.application.*version' android/settings.gradle.kts \
            | tee evidence/android-release/android-gradle-plugin.txt
          git rev-parse HEAD | tee evidence/android-release/git-sha.txt

      - name: Ensure Android 16 / API 36 SDK
        run: |
          set -euo pipefail
          bash tools/android/ensure_api36_sdk.sh platform
          grep -Eq '^\s*compileSdk\s*=\s*36\s*$' android/app/build.gradle.kts
          grep -Eq '^\s*targetSdk\s*=\s*36\s*$' android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Setup signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_B64}" || -z "${KEYSTORE_PASSWORD}" || -z "${KEY_PASSWORD}" || -z "${KEY_ALIAS}" ]]; then
            echo "::error::Secrets de signature manquants (KEYSTORE_B64 / KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS) dans l'environnement 'recaptcha'."
            exit 1
          fi

          printf "%s" "$KEYSTORE_B64" \
            | tr -d '\r\n[:space:]' \
            | base64 -d > "$RUNNER_TEMP/upload-keystore-raw.jks"

          SIZE=$(stat -c%s "$RUNNER_TEMP/upload-keystore-raw.jks" 2>/dev/null || echo 0)
          if [[ "$SIZE" -lt 100 ]]; then
            echo "::error::Keystore invalide (${SIZE} octets) — KEYSTORE_B64 vide ou corrompu."
            exit 1
          fi

          keytool -importkeystore \
            -srckeystore "$RUNNER_TEMP/upload-keystore-raw.jks" \
            -destkeystore "$RUNNER_TEMP/upload-keystore.jks" \
            -deststoretype JKS \
            -srcstorepass "${KEYSTORE_PASSWORD}" \
            -deststorepass "${KEYSTORE_PASSWORD}" \
            -noprompt

          keytool -list \
            -keystore "$RUNNER_TEMP/upload-keystore.jks" \
            -storetype JKS \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" > /dev/null

          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storeType=JKS
          EOF
          echo "Keystore JKS prêt et alias vérifié."

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*//' | cut -d'+' -f1)
          BUILD_NUMBER=${{ github.run_number }}
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION_NAME} (versionCode ${BUILD_NUMBER})"

      - name: Build AAB release
        env:
          APP_BUILD_NUMBER_OVERRIDE: ${{ steps.version.outputs.build_number }}
        run: |
          bash tools/flutter_with_build_stamp.sh build appbundle \
            --release \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Certify final AAB targets Android 16 / API 36
        run: |
          set -euo pipefail
          AAB='build/app/outputs/bundle/release/app-release.aab'
          test -s "${AAB}"

          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl -fsSL \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            -o "${BUNDLETOOL_JAR}"

          java -jar "${BUNDLETOOL_JAR}" dump manifest \
            --bundle="${AAB}" \
            --module=base \
            > evidence/android-release/aab-base-manifest.xml

          TARGET_SDK="$(java -jar "${BUNDLETOOL_JAR}" dump manifest \
            --bundle="${AAB}" \
            --module=base \
            --xpath='/manifest/uses-sdk/@android:targetSdkVersion' \
            | tr -d '\r[:space:]')"

          echo "targetSdkVersion=${TARGET_SDK}" \
            | tee evidence/android-release/aab-target-sdk.txt
          sha256sum "${AAB}" | tee evidence/android-release/app-release.aab.sha256

          if [[ "${TARGET_SDK}" != "36" ]]; then
            echo "::error::AAB final cible API ${TARGET_SDK}; API 36 exigée avant tout envoi Play."
            exit 1
          fi

          echo "✅ AAB final certifié targetSdkVersion=36"

      - name: Name artifact
        id: artifact
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short=8 HEAD)
          NAME="ilipresto_${{ steps.version.outputs.version_name }}_${{ steps.version.outputs.build_number }}_${SHA}"
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/${NAME}.aab"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "dist/${NAME}.aab"

      - name: Upload API 36 certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-api36-release-evidence-${{ github.sha }}
          path: evidence/android-release/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/${{ steps.artifact.outputs.name }}.aab
          retention-days: 30

      - name: Check Play Console credentials
        if: ${{ inputs.upload }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          if [[ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON absent de l'environnement 'recaptcha'."
            exit 1
          fi

          if ! printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" \
              | jq -e '.type == "service_account" and (.client_email | length > 0) and (.private_key | length > 0)' > /dev/null; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON n'est pas une clé de compte de service valide."
            exit 1
          fi

          echo "Compte de service Play présent et bien formé."

      - name: Upload to Play Console
        if: ${{ inputs.upload }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fr.ilipresto.app
          releaseFiles: dist/${{ steps.artifact.outputs.name }}.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release Android"
            echo ""
            echo "- Flutter : \`${FLUTTER_VERSION}\`"
            echo "- cible Android : API \`${ANDROID_API_LEVEL}\`"
            echo "- version : \`${{ steps.version.outputs.version_name }}\`"
            echo "- versionCode : \`${{ steps.version.outputs.build_number }}\`"
            echo "- artefact : \`${{ steps.artifact.outputs.name }}.aab\`"
            if [[ -f evidence/android-release/aab-target-sdk.txt ]]; then
              echo "- preuve AAB : \`$(cat evidence/android-release/aab-target-sdk.txt)\`"
            else
              echo "- preuve AAB : **absente — release non certifiable**"
            fi
            if [[ "${{ inputs.upload }}" == "true" ]]; then
              echo "- Play Console : envoyé sur \`${{ inputs.track }}\` (statut \`${{ inputs.status }}\`)"
            else
              echo "- Play Console : **non envoyé** (case \`upload\` décochée)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
