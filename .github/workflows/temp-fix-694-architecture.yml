name: Temporary fix 694 architecture

on:
  push:
    branches:
      - coverage/w1-messaging-next-20260723
    paths:
      - .github/workflows/temp-fix-694-architecture.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: coverage/w1-messaging-next-20260723
          fetch-depth: 0
      - name: Restore production screen and remove patch-only regression test
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- lib/pages/messages/conversations_list_page.dart
          rm -f test/pages/messages/conversations_list_admin_build_regression_test.dart
          rm -f .github/workflows/temp-fix-694-architecture.yml

          git config user.name "coverage-fix-bot"
          git config user.email "coverage-fix-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test(messages): keep admin claims coverage architecture-safe"
          git push origin HEAD:coverage/w1-messaging-next-20260723
