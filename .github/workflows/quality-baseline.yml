name: Quality baseline

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate pre-test quality baseline
        run: python3 tools/quality/audit_repository.py --output-dir quality_reports/pre-test

      - name: Run Flutter tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Generate post-test quality baseline
        run: python3 tools/quality/audit_repository.py --output-dir quality_reports/post-test --enforce

      - name: Publish job summary
        if: always()
        run: |
          if [ -f quality_reports/post-test/baseline.md ]; then
            cat quality_reports/post-test/baseline.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f quality_reports/pre-test/baseline.md ]; then
            cat quality_reports/pre-test/baseline.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-baseline-${{ github.sha }}
          path: |
            quality_reports
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30
