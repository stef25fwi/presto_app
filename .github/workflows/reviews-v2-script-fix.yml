name: Reviews V2 emulator script fix

on:
  push:
    branches:
      - agent/reviews-v2-complete-mutual-flow

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reviews-v2-complete-mutual-flow
      - name: Use modular firebase-admin ESM API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('functions/scripts/reviews_v2_emulator_e2e.mjs')
          text = p.read_text()
          text = text.replace(
              'import admin from "firebase-admin";\n',
              'import { getApps, initializeApp } from "firebase-admin/app";\n'
              'import { FieldValue, getFirestore } from "firebase-admin/firestore";\n',
              1,
          )
          text = text.replace(
              'if (admin.apps.length === 0) {\n  admin.initializeApp({ projectId });\n}\nconst db = admin.firestore();',
              'if (getApps().length === 0) {\n  initializeApp({ projectId });\n}\nconst db = getFirestore();',
              1,
          )
          text = text.replace(
              'admin.firestore.FieldValue.serverTimestamp()',
              'FieldValue.serverTimestamp()',
          )
          if 'admin.' in text:
              raise SystemExit('firebase-admin legacy namespace reference remains')
          p.write_text(text)
          PY
          node --check functions/scripts/reviews_v2_emulator_e2e.mjs
          git diff --check
      - name: Commit script fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/scripts/reviews_v2_emulator_e2e.mjs
          git commit -m "test(reviews): fix firebase-admin ESM harness"
          git push origin HEAD:agent/reviews-v2-complete-mutual-flow
