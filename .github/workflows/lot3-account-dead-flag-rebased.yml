name: Lot3 account dead flag rebased

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lot3-account-dead-flag-rebased-20260807
          fetch-depth: 0
      - name: Prove and remove dead flag
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('lib/pages/account_page.dart')
          text = p.read_text()
          lines = text.splitlines(keepends=True)
          hits = [(i + 1, line) for i, line in enumerate(lines) if '_profileLoadRequested' in line]
          if len(hits) != 5:
              raise SystemExit(f'fail-fast: expected exactly 5 occurrences, got {len(hits)}: {hits!r}')

          declaration = re.compile(r'^\s*bool _profileLoadRequested = false;\s*$')
          assignment = re.compile(r'^\s*_profileLoadRequested = (?:true|false);\s*$')
          decl_count = sum(bool(declaration.match(line)) for _, line in hits)
          assign_count = sum(bool(assignment.match(line)) for _, line in hits)
          if decl_count != 1 or assign_count != 4:
              raise SystemExit(f'fail-fast: unexpected forms: decl={decl_count}, assignments={assign_count}, hits={hits!r}')

          kept = [line for line in lines if '_profileLoadRequested' not in line]
          p.write_text(''.join(kept))
          Path('.github/workflows/lot3-account-dead-flag-rebased.yml').unlink()
      - name: Verify scope
        run: |
          ! grep -R "_profileLoadRequested" lib/pages/account_page.dart
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$(printf '%s\n' '.github/workflows/lot3-account-dead-flag-rebased.yml' 'lib/pages/account_page.dart' | sort)
          test "$changed" = "$expected"
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(lot3): supprimer le flag profil jamais lu sur main actualisé"
          git push origin HEAD:refactor/lot3-account-dead-flag-rebased-20260807
