name: Apply UI issues 382 and 383
# Trigger execution after bootstrap merge.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-ui-382-383.yml

permissions:
  contents: write

jobs:
  apply-ui-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create final changes branch
        run: git switch -c fix/issues-382-383-applied

      - name: Apply targeted UI changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one occurrence in {path}, found {count}: {old!r}"
                  )
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "lib/pages/account_page.dart",
              "        border: Border.all(color: kPrestoBlue.withValues(alpha: 0.10)),",
              "        border: Border.all(\n"
              "          color: const Color(0xFFB8BEC7),\n"
              "          width: 2,\n"
              "        ),",
          )

          replace_once(
              "lib/pages/account_page.dart",
              "                    // Logo brand centré\n"
              "                    Padding(\n"
              "                      padding: const EdgeInsets.only(top: 10, bottom: 12),\n"
              "                      child: Center(\n"
              "                        child: Image.asset(\n"
              "                          'assets/images/logowebp.webp',\n"
              "                          height: 52,\n"
              "                        ),\n"
              "                      ),\n"
              "                    ),\n",
              "",
          )

          replace_once(
              "lib/widgets/account_notifications_tile.dart",
              "        side: BorderSide(color: Colors.grey.shade300),",
              "        side: const BorderSide(\n"
              "          color: Color(0xFFB8BEC7),\n"
              "          width: 2,\n"
              "        ),",
          )

          replace_once(
              "lib/pages/toolbox_je_me_lance_page.dart",
              "            tone: const Color(0xFF7C3AED),",
              "            tone: kBlue,",
          )

          replace_once(
              "lib/pages/toolbox_je_me_lance_page.dart",
              "            tone: const Color(0xFF26A65B),",
              "            tone: kBlue,",
          )

          # The bootstrap workflow must disappear from the final diff.
          Path(".github/workflows/apply-ui-382-383.yml").unlink()
          PY

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Format modified Dart files
        run: |
          dart format \
            lib/pages/account_page.dart \
            lib/widgets/account_notifications_tile.dart \
            lib/pages/toolbox_je_me_lance_page.dart

      - name: Commit and push final branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/pages/account_page.dart \
            lib/widgets/account_notifications_tile.dart \
            lib/pages/toolbox_je_me_lance_page.dart \
            .github/workflows/apply-ui-382-383.yml
          git commit -m "fix(ui): appliquer les issues #382 et #383"
          git push --force-with-lease origin HEAD:fix/issues-382-383-applied
