name: Apply UI issues 382 and 383

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-ui-fixes:
    if: github.head_ref == 'trigger/issues-382-383'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create clean final branch
        run: git switch -C fix/issues-382-383-clean

      - name: Apply targeted UI changes only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_in_section(
              path: str,
              start_marker: str,
              end_marker: str,
              old: str,
              new: str,
          ) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              section = text[start:end]
              count = section.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected one scoped occurrence in {path}, found {count}: {old!r}"
                  )
              section = section.replace(old, new, 1)
              file_path.write_text(text[:start] + section + text[end:], encoding="utf-8")

          replace_in_section(
              "lib/pages/account_page.dart",
              "  Widget _buildAccountSectionCard({",
              "\n  Widget _buildProfile(User user) {",
              "        border: Border.all(color: kPrestoBlue.withValues(alpha: 0.10)),",
              "        border: Border.all(color: const Color(0xFFB8BEC7), width: 2),",
          )

          account_path = Path("lib/pages/account_page.dart")
          account_text = account_path.read_text(encoding="utf-8")
          logo_start_marker = "                    // Logo brand centré\n"
          logo_end_marker = (
              "                    // En-tête : avatar + nom/localisation/badge\n"
          )
          logo_start = account_text.index(logo_start_marker)
          logo_end = account_text.index(logo_end_marker, logo_start)
          account_path.write_text(
              account_text[:logo_start] + account_text[logo_end:],
              encoding="utf-8",
          )

          notifications_path = Path(
              "lib/widgets/account_notifications_tile.dart"
          )
          notifications_text = notifications_path.read_text(encoding="utf-8")
          notification_old = (
              "        side: BorderSide(color: Colors.grey.shade300),"
          )
          if notifications_text.count(notification_old) != 1:
              raise SystemExit(
                  "Unexpected notification border occurrence count: "
                  f"{notifications_text.count(notification_old)}"
              )
          notifications_path.write_text(
              notifications_text.replace(
                  notification_old,
                  "        side: const BorderSide(color: Color(0xFFB8BEC7), width: 2),",
                  1,
              ),
              encoding="utf-8",
          )

          replace_in_section(
              "lib/pages/toolbox_je_me_lance_page.dart",
              "  Widget _buildReviewStep() {",
              "\n  Widget _buildTopHeader() {",
              "            tone: const Color(0xFF7C3AED),",
              "            tone: kBlue,",
          )
          replace_in_section(
              "lib/pages/toolbox_je_me_lance_page.dart",
              "  Widget _buildReviewStep() {",
              "\n  Widget _buildTopHeader() {",
              "            tone: const Color(0xFF26A65B),",
              "            tone: kBlue,",
          )

          # The bootstrap workflow must disappear from the final diff.
          Path(".github/workflows/apply-ui-382-383.yml").unlink()
          PY

      - name: Commit and push clean branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/pages/account_page.dart \
            lib/widgets/account_notifications_tile.dart \
            lib/pages/toolbox_je_me_lance_page.dart \
            .github/workflows/apply-ui-382-383.yml
          git commit -m "fix(ui): appliquer les issues #382 et #383"
          git push --force origin HEAD:fix/issues-382-383-clean
