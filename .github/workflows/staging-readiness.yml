name: Firebase staging readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate staging configuration
        env:
          FIREBASE_STAGING_PROJECT_ID: ${{ secrets.FIREBASE_STAGING_PROJECT_ID }}
          FIREBASE_STAGING_TOKEN: ${{ secrets.FIREBASE_STAGING_TOKEN }}
        run: node tools/quality/check_firebase_staging_readiness.mjs

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Verify token access to staging project
        env:
          FIREBASE_STAGING_PROJECT_ID: ${{ secrets.FIREBASE_STAGING_PROJECT_ID }}
          FIREBASE_STAGING_TOKEN: ${{ secrets.FIREBASE_STAGING_TOKEN }}
        run: |
          set -euo pipefail
          firebase projects:list \
            --token "$FIREBASE_STAGING_TOKEN" \
            --json \
            --non-interactive > firebase-projects.json
          jq -e --arg project "$FIREBASE_STAGING_PROJECT_ID" \
            '.result[] | select(.projectId == $project)' \
            firebase-projects.json >/dev/null
          echo "Firebase staging access verified for $FIREBASE_STAGING_PROJECT_ID." >> "$GITHUB_STEP_SUMMARY"
