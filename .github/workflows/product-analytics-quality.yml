name: Product analytics quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tools/quality/audit_analytics_events.py'
      - '.github/workflows/product-analytics-quality.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tools/quality/audit_analytics_events.py'
      - '.github/workflows/product-analytics-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-analytics-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate Analytics event catalog
        run: |
          python3 tools/quality/audit_analytics_events.py \
            --output-dir quality_reports/analytics

      - name: Publish summary
        run: cat quality_reports/analytics/analytics-event-catalog.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload catalog
        uses: actions/upload-artifact@v4
        with:
          name: analytics-event-catalog-${{ github.sha }}
          path: quality_reports/analytics
          if-no-files-found: error
          retention-days: 30
