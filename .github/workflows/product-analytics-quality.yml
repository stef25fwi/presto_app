name: Product analytics quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tools/quality/audit_analytics_events.py'
      - '.github/workflows/product-analytics-quality.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tools/quality/audit_analytics_events.py'
      - '.github/workflows/product-analytics-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-analytics-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Generate and enforce Analytics event catalog
        run: |
          python3 tools/quality/audit_analytics_events.py \
            --output-dir quality_reports/analytics \
            --enforce

      - name: Publish summary
        if: always()
        run: |
          if [ -f quality_reports/analytics/analytics-event-catalog.md ]; then
            cat quality_reports/analytics/analytics-event-catalog.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload catalog
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analytics-event-catalog-${{ github.sha }}
          path: quality_reports/analytics
          if-no-files-found: warn
          retention-days: 30
