name: Temporary export messaging wave 5

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'coverage/messaging-thread-actions-wave-5'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/upload-artifact@v7
        with:
          name: messaging-wave-5-source-${{ github.run_id }}
          path: |
            lib/pages/messages/conversation_thread_page.dart
            test/pages/messages/
          retention-days: 1
