name: Temporary messaging actions coverage executor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  implement-and-test:
    if: github.head_ref == 'coverage/messaging-thread-actions-wave-3' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Apply zero-line-growth messaging action refactor
        run: python3 tools/temp_messaging_actions_wave_patch.py

      - name: Format changed Dart files
        run: dart format lib/pages/messages/conversation_thread_page.dart test/pages/messages/conversation_thread_actions_and_bubbles_coverage_test.dart

      - name: Enforce legacy page line budget
        shell: bash
        run: test "$(wc -l < lib/pages/messages/conversation_thread_page.dart)" -le 5182

      - name: Dependencies
        run: flutter pub get

      - name: Targeted messaging action tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded test/pages/messages/conversation_thread_actions_and_bubbles_coverage_test.dart 2>&1 | tee messaging-actions-test.log

      - name: Targeted analyzer
        shell: bash
        run: |
          set -o pipefail
          flutter analyze lib/pages/messages/conversation_thread_page.dart test/pages/messages/conversation_thread_actions_and_bubbles_coverage_test.dart 2>&1 | tee messaging-actions-analyze.log

      - name: Upload messaging action diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: messaging-actions-diagnostic-${{ github.run_id }}
          path: |
            messaging-actions-test.log
            messaging-actions-analyze.log
          retention-days: 2

      - name: Commit validated implementation and clean executor
        shell: bash
        run: |
          rm -f .github/workflows/temp-export-messaging-actions-wave.yml
          rm -f tools/temp_messaging_actions_wave_patch.py
          rm -f messaging-actions-test.log
          rm -f messaging-actions-analyze.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(coverage): cover messaging actions and bubbles"
          git push origin HEAD:${{ github.head_ref }}
