name: Production guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repair-pr459:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: repair/pr451-complete
          fetch-depth: 0

      - name: Prepare exact repaired files
        id: prepare
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            git fetch origin \
              +refs/heads/repair/pr451-complete:refs/remotes/origin/repair/pr451-complete \
              +refs/heads/main:refs/remotes/origin/main
            git switch -C repair/pr451-complete refs/remotes/origin/repair/pr451-complete

            python3 - <<'PY'
          from pathlib import Path

          source = Path('lib/pages/messages/conversation_thread_page.dart')
          text = source.read_text()

          header_old = """            onForegroundImageError: (error, stackTrace) {
              debugPrint(
                '[ConversationThread] header avatar load failed '
                'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
                'error=$error',
              );
            },
          """
          header_new = """            onForegroundImageError: _otherParticipantPhotoUrl.isNotEmpty
                ? (error, stackTrace) {
                    debugPrint(
                      '[ConversationThread] header avatar load failed '
                      'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
                      'error=$error',
                    );
                  }
                : null,
          """
          if header_new not in text:
              if text.count(header_old) != 1:
                  raise SystemExit(
                      f'Header avatar callback shape not recognized: {text.count(header_old)}'
                  )
              text = text.replace(header_old, header_new, 1)

          bubble_old = """      onForegroundImageError: (error, stackTrace) {
        debugPrint(
          '[ConversationThread] bubble avatar load failed '
          'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
          'error=$error',
        );
      },
          """
          bubble_new = """      onForegroundImageError: _otherParticipantPhotoUrl.isNotEmpty
          ? (error, stackTrace) {
              debugPrint(
                '[ConversationThread] bubble avatar load failed '
                'participantId=$_otherParticipantId url=$_otherParticipantPhotoUrl '
                'error=$error',
              );
            }
          : null,
          """
          if bubble_new not in text:
              if text.count(bubble_old) != 1:
                  raise SystemExit(
                      f'Bubble avatar callback shape not recognized: {text.count(bubble_old)}'
                  )
              text = text.replace(bubble_old, bubble_new, 1)
          source.write_text(text)

          test = Path('test/pages/messages/conversation_thread_page_shell_test.dart')
          test_text = test.read_text()
          drain = """void _drainExpectedConversationThreadExceptions(WidgetTester tester) {
  Object? exception;
  while ((exception = tester.takeException()) != null) {
    final message = exception.toString();
    final isExpectedCircleAvatarAssertion =
        message.contains('circle_avatar.dart') &&
        message.contains(
          'foregroundImage != null || onForegroundImageError == null',
        );
    if (!isExpectedCircleAvatarAssertion) {
      throw exception!;
    }
  }
}

          """
          test_text = test_text.replace(drain, '')
          test_text = test_text.replace(
              '  _drainExpectedConversationThreadExceptions(tester);\n',
              '',
          )
          test.write_text(test_text)
          PY

            git show ae64f4c081b4ee4b84a029c7d4c7a9dee9d98a4a:.github/workflows/dart-format-quality.yml \
              > .github/workflows/dart-format-quality.yml
            git diff --check
          } 2>&1 | tee /tmp/pr459-prepare.log

      - name: Update repair branch through GitHub API
        id: update_branch
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_BRANCH: repair/pr451-complete
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail

            update_file() {
              local path="$1"
              local message="$2"
              local sha
              sha=$(gh api \
                "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${REPAIR_BRANCH}" \
                --jq .sha)
              base64 -w0 "$path" > /tmp/pr459-content.b64
              jq -n \
                --arg message "$message" \
                --rawfile content /tmp/pr459-content.b64 \
                --arg branch "$REPAIR_BRANCH" \
                --arg sha "$sha" \
                '{message:$message,content:$content,branch:$branch,sha:$sha}' \
                > /tmp/pr459-update.json
              gh api --method PUT \
                "repos/${GITHUB_REPOSITORY}/contents/${path}" \
                --input /tmp/pr459-update.json >/dev/null
            }

            delete_file() {
              local path="$1"
              local sha
              sha=$(gh api \
                "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${REPAIR_BRANCH}" \
                --jq .sha 2>/dev/null || true)
              if [ -z "$sha" ]; then
                return 0
              fi
              jq -n \
                --arg message "chore(ci): supprimer le déclencheur temporaire PR459" \
                --arg branch "$REPAIR_BRANCH" \
                --arg sha "$sha" \
                '{message:$message,branch:$branch,sha:$sha}' \
                > /tmp/pr459-delete.json
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/contents/${path}" \
                --input /tmp/pr459-delete.json >/dev/null
            }

            update_file \
              lib/pages/messages/conversation_thread_page.dart \
              'fix(messages): protéger les avatars sans image'
            update_file \
              test/pages/messages/conversation_thread_page_shell_test.dart \
              'test(messages): retirer le contournement CircleAvatar'
            update_file \
              .github/workflows/dart-format-quality.yml \
              'chore(ci): restaurer la validation de format standard'

            delete_file .github/pr459-repair.trigger
            delete_file .github/pr459-native-sync-final.trigger
            delete_file .github/repair-pr459-main.trigger
            delete_file .github/repair-pr459-native-trigger-2
          } 2>&1 | tee /tmp/pr459-api-update.log

      - name: Report repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          UPDATE_OUTCOME: ${{ steps.update_branch.outcome }}
        shell: bash
        run: |
          {
            echo "### Réparation API PR459"
            echo
            echo "- préparation : ${PREPARE_OUTCOME}"
            echo "- mise à jour branche : ${UPDATE_OUTCOME}"
            echo
            echo '```text'
            tail -n 35 /tmp/pr459-prepare.log 2>/dev/null || true
            tail -n 45 /tmp/pr459-api-update.log 2>/dev/null || true
            echo '```'
          } > /tmp/pr459-result.md
          gh pr comment 459 --body-file /tmp/pr459-result.md
          test "$PREPARE_OUTCOME" = success
          test "$UPDATE_OUTCOME" = success

  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify generated patches are committed
        run: |
          node tools/apply_prod_hardening_patches.mjs
          git diff --exit-code

      - name: Test Firebase preview isolation
        run: node --test tools/quality/check_firebase_preview_project.test.mjs

      - name: Check production guardrails
        run: node tools/check_production_guardrails.mjs
