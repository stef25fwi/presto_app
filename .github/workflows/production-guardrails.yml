name: Production guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify generated patches are committed
        run: |
          node tools/apply_prod_hardening_patches.mjs
          git diff --exit-code

      - name: Test Firebase preview isolation
        run: node --test tools/quality/check_firebase_preview_project.test.mjs

      - name: Check production guardrails
        run: node tools/check_production_guardrails.mjs
