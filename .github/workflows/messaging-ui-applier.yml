name: Messaging UI applier

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/messages-audio-input-debug-header-v5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/messages-audio-input-debug-header-v5
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/apply_messaging_ui_fix.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/messages/conversation_thread_page.dart lib/widgets/admin_web_debug_panel.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(messages): show audio duration and move admin debug to header"
          git push origin HEAD:fix/messages-audio-input-debug-header-v5
