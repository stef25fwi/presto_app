name: Observability SLO readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'quality/observability_slo.json'
      - 'tools/quality/check_observability_slo.mjs'
      - 'tools/quality/check_observability_slo.test.mjs'
      - 'docs/operations/OBSERVABILITY_SLO.md'
      - '.github/workflows/observability-slo-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observability-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test observability checker
        run: node --test tools/quality/check_observability_slo.test.mjs
      - name: Generate observability report
        run: node tools/quality/check_observability_slo.mjs
      - name: Upload observability evidence
        uses: actions/upload-artifact@v4
        with:
          name: observability-slo-${{ github.sha }}
          path: quality_reports/observability-slo/report.json
          retention-days: 30
