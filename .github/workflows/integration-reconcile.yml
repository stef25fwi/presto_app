name: Reconcile and Validate Ilipresto Integration

on:
  push:
    branches:
      - integration/latest-ilipresto-20260709

permissions:
  contents: write

env:
  INTEGRATION_BRANCH: integration/latest-ilipresto-20260709

jobs:
  reconcile-and-validate:
    environment: recaptcha
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/latest-ilipresto-20260709
          fetch-depth: 0

      - name: Apply targeted reconciliations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          journey_path = Path('lib/pages/account/mon_entreprise_parcours_page.dart')
          journey = journey_path.read_text(encoding='utf-8')
          old_button = """            const SizedBox(height: 20),
            FilledButton.icon(
              style: FilledButton.styleFrom(
                backgroundColor: _kOrange,
                foregroundColor: Colors.white,
                padding:
                    const EdgeInsets.symmetric(horizontal: 24, vertical: 14),
                shape: RoundedRectangleBorder(
                  borderRadius: BorderRadius.circular(12),
                ),
              ),
              onPressed: onCreate,
              icon: const Icon(Icons.rocket_launch_rounded),
              label: const Text('Créer mon parcours'),
            ),
"""
          new_button = """            const SizedBox(height: 24),
            SizedBox(
              width: double.infinity,
              child: FilledButton.icon(
                style: FilledButton.styleFrom(
                  backgroundColor: _kOrange,
                  foregroundColor: Colors.white,
                  minimumSize: const Size.fromHeight(62),
                  padding:
                      const EdgeInsets.symmetric(horizontal: 26, vertical: 18),
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(18),
                  ),
                  textStyle: const TextStyle(
                    fontSize: 17,
                    fontWeight: FontWeight.w900,
                  ),
                  elevation: 4,
                  shadowColor: _kOrange,
                ),
                onPressed: onCreate,
                icon: const Icon(Icons.rocket_launch_rounded, size: 22),
                label: const Text('Je crée mon entreprise'),
              ),
            ),
"""
          if new_button not in journey:
              if old_button not in journey:
                  raise SystemExit('Bloc du bouton parcours introuvable; arrêt sans modification.')
              journey = journey.replace(old_button, new_button, 1)
              journey_path.write_text(journey, encoding='utf-8')

          main_path = Path('lib/main.dart')
          main = main_path.read_text(encoding='utf-8')
          main = main.replace(
              "import 'pages/admin_space_page.dart';",
              "import 'pages/admin_space_loader.dart';",
              1,
          )
          main = main.replace(
              "'/admin': (_) => const AdminSpacePage(),",
              "'/admin': (_) => const AdminSpaceLoader(),",
              1,
          )
          if "import 'pages/admin_space_page.dart';" in main or "const AdminSpacePage()" in main:
              raise SystemExit('Le branchement direct AdminSpacePage subsiste.')
          if "import 'pages/admin_space_loader.dart';" not in main or "const AdminSpaceLoader()" not in main:
              raise SystemExit('AdminSpaceLoader non branché correctement.')
          main_path.write_text(main, encoding='utf-8')

          firebase_path = Path('firebase.json')
          config = json.loads(firebase_path.read_text(encoding='utf-8'))
          cache_rule = {
              'source': '**/*.part.js',
              'headers': [{'key': 'Cache-Control', 'value': 'no-cache, must-revalidate'}],
          }
          hosting_entries = config.get('hosting', [])
          if not isinstance(hosting_entries, list) or not hosting_entries:
              raise SystemExit('Configuration hosting Firebase introuvable.')
          for hosting in hosting_entries:
              headers = hosting.setdefault('headers', [])
              existing = next((item for item in headers if item.get('source') == '**/*.part.js'), None)
              if existing is None:
                  insert_at = next(
                      (index + 1 for index, item in enumerate(headers) if item.get('source') == '/main.dart.js'),
                      len(headers),
                  )
                  headers.insert(insert_at, cache_rule.copy())
              else:
                  existing['headers'] = cache_rule['headers']
          firebase_path.write_text(
              json.dumps(config, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8',
          )

          Path('.github/workflows/integration-reconcile.yml').unlink(missing_ok=True)
          PY

          git diff --check
          git diff -- lib/pages/account/mon_entreprise_parcours_page.dart lib/main.dart firebase.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --fatal-infos

      - name: Test Flutter
        run: flutter test

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Test Functions
        run: npm --prefix functions test

      - name: Build Flutter web release
        env:
          APPCHECK_RECAPTCHA_SITE_KEY: ${{ secrets.APPCHECK_RECAPTCHA_SITE_KEY }}
        run: bash tools/flutter_with_build_stamp.sh build web --release --no-wasm-dry-run

      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/account/mon_entreprise_parcours_page.dart lib/main.dart firebase.json .github/workflows/integration-reconcile.yml
          git commit -m "fix: intègre bouton parcours et correctifs admin ciblés"
          git push origin "HEAD:${INTEGRATION_BRANCH}"
