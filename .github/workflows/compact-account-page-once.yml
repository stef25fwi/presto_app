name: Compact account page once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compact-account-page-once.yml

permissions:
  contents: write

jobs:
  compact-account-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reduce account page spacing
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/pages/account_page.dart')
          text = path.read_text(encoding='utf-8')
          original = text

          replacements = {
              'padding: const EdgeInsets.fromLTRB(6, 0, 6, 8),': 'padding: const EdgeInsets.fromLTRB(4, 0, 4, 6),',
              'padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 10),': 'padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 8),',
              'padding: const EdgeInsets.fromLTRB(6, 16, 6, 80),': 'padding: const EdgeInsets.fromLTRB(4, 12, 4, 80),',
              'padding: const EdgeInsets.fromLTRB(10, 12, 10, 10),': 'padding: const EdgeInsets.fromLTRB(8, 10, 8, 8),',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'Replacement target not found: {old}')
              text = text.replace(old, new)

          start = text.index('  Widget _buildProfile(User user) {')
          end = text.index('\n  Widget _buildAdminSpaceEntry(User user) {', start)
          profile = text[start:end]
          profile = profile.replace('const SizedBox(height: 12),', 'const SizedBox(height: 8),')
          profile = profile.replace('const SizedBox(height: 14),', 'const SizedBox(height: 10),')
          text = text[:start] + profile + text[end:]

          enterprise_start = text.index('  Widget _buildEnterpriseScaffold(')
          enterprise_end = text.index('\n  Widget _buildEnterpriseHeader(', enterprise_start)
          enterprise = text[enterprise_start:enterprise_end]
          enterprise = enterprise.replace('const SizedBox(height: 16),', 'const SizedBox(height: 10),')
          enterprise = enterprise.replace('const SizedBox(height: 12),', 'const SizedBox(height: 8),')
          text = text[:enterprise_start] + enterprise + text[enterprise_end:]

          if text == original:
              raise SystemExit('No account page change produced')

          path.write_text(text, encoding='utf-8')

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/compact-account-page-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/account_page.dart .github/workflows/compact-account-page-once.yml
          git commit -m "style: compacte la page mon compte ilipresto"
          git push origin main
