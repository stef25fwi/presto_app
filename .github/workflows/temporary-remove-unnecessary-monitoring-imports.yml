name: Temporary remove unnecessary monitoring imports

on:
  push:
    branches:
      - agent/phase-0-analyzer-ignore-17

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-analyzer-ignore-17
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply targeted cleanup
        run: |
          node tools/temporary_remove_unnecessary_monitoring_imports.mjs
          dart format lib/services/app_monitoring_service.dart

      - name: Commit targeted change
        run: |
          if git diff --quiet; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/app_monitoring_service.dart
          git commit -m 'fix: retire les imports monitoring inutiles'
          git push origin HEAD:agent/phase-0-analyzer-ignore-17
