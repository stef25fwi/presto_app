name: Dependency audit report

# Le workflow précédent ne se déclenchait que sur `audit/prod-hardening-p0-p11`
# et recommittait le rapport sur cette même branche : `main` n'a donc jamais été
# audité et `docs/DEPENDENCY_AUDIT.md` a divergé de la réalité. Il devient ici
# une barrière vérifiante sur `main` et sur chaque PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Les avis de sécurité tombent après le merge : re-vérifier chaque lundi.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the report generator
        run: node --test tools/quality/generate_dependency_audit.test.mjs

      - run: npm ci
      - run: npm --prefix functions ci

      - name: Verify report freshness and block high/critical advisories
        run: node tools/quality/generate_dependency_audit.mjs --check

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.sha }}
          path: |
            docs/DEPENDENCY_AUDIT.md
            docs/DEPENDENCY_AUDIT.json
          if-no-files-found: error
          retention-days: 30
