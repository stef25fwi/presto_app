name: Dependency security gate

on:
  pull_request:
    branches: [main]
    paths:
      - functions/package.json
      - functions/package-lock.json
      - .github/workflows/dependency-audit-report.yml
  push:
    branches: [main]
    paths:
      - functions/package.json
      - functions/package-lock.json
      - .github/workflows/dependency-audit-report.yml
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Audit production dependencies and reject high or critical advisories
        run: |
          mkdir -p quality_reports/dependencies
          npm --prefix functions audit --package-lock-only --omit=dev --audit-level=high --json > quality_reports/dependencies/npm-audit.json

      - name: Summarize the current audit
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('quality_reports/dependencies/npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities;
          if (report.error || !counts) throw new Error('Dependency audit is unavailable; no successful verdict can be issued.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Production dependency audit\n\nCritical: ${counts.critical}; high: ${counts.high}; moderate: ${counts.moderate}; low: ${counts.low}.\n`);
          NODE

      - name: Keep the audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-${{ github.sha }}
          path: quality_reports/dependencies/npm-audit.json
          if-no-files-found: error
          retention-days: 14
