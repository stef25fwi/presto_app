name: SEO acquisition readiness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate national positioning
        run: node tools/quality/check_national_positioning.mjs
      - name: Validate every public page
        run: node tools/quality/check_public_page_seo.mjs
      - name: Validate continuous SEO monitoring
        run: node tools/quality/check_seo_monitoring_readiness.test.mjs
      - name: Validate runtime SEO registry
        run: node tools/seo/runtime_seo_registry_contract.test.mjs
      - name: Validate Google measurement bootstrap
        run: node tools/quality/check_seo_google_access_bootstrap.mjs
      - name: Validate Lighthouse lot 13 tooling
        run: node tools/performance/build_lighthouse_baseline.test.mjs
      - name: Validate Core Web Vitals lot 14 tooling
        run: node tools/performance/web_vitals_rum_contract.test.mjs
      - name: Validate Search Console lot 15 tooling
        run: node tools/seo/search_console_lot15_contract.test.mjs
      - name: Validate registry
        run: node tools/quality/check_seo_acquisition_readiness.test.mjs
      - name: Build readiness report
        run: node tools/quality/check_seo_acquisition_readiness.mjs
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: seo-acquisition-readiness-report
          path: build/quality/seo-acquisition-readiness-report.json
          retention-days: 30
