name: presto_app
description: Prest'o app
publish_to: "none"

# Dependency constraints refreshed with Flutter 3.44.6 on 2026-07-28.
version: 1.0.1+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  crypto: ^3.0.6
  firebase_auth: ^6.1.0
  sign_in_with_apple: ^8.1.0
  http: ^1.2.2
  cupertino_icons: ^1.0.8
  firebase_core: ^4.3.0
  firebase_analytics: ^12.0.1
  firebase_crashlytics: ^5.0.0
  auto_size_text: ^3.0.0
  cloud_firestore: ^6.3.0
  cloud_functions: ^6.0.5
  url_launcher: ^6.3.0
  image_picker: ^1.2.2
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.1.0
  firebase_performance: ^0.11.0+1
  firebase_remote_config: ^6.1.1
  flutter_local_notifications: ^22.0.1
  firebase_app_check: ^0.4.1+3
  recaptcha_enterprise_flutter: ^18.8.2
  record: ^7.1.0
  path_provider: ^2.1.0
  google_mobile_ads: ^9.0.0
  flutter_slidable: ^4.0.3
  file_picker: ^11.0.2
  share_plus: ^12.0.2
  pdf: ^3.11.0
  open_filex: ^4.7.0
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.0.9
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0
  web: ^1.0.0
  cross_file: ^0.3.4+2
  firebase_ai: ^3.11.0
  google_sign_in: ^7.2.0
  video_player: ^2.9.2
  just_audio: ^0.10.5
  audioplayers: ^6.7.1
  app_settings: ^8.0.3
  flutter_app_badger: ^1.5.0
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  firebase_core_platform_interface: ^8.0.0
  firebase_auth_platform_interface: ^9.0.0
  fake_cloud_firestore: ^4.1.1
  flutter_lints: ^6.0.0

flutter:
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Variable.ttf
        - asset: assets/fonts/Rubik-Italic-Variable.ttf
          style: italic
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logowebp.webp
    - assets/data/cities_compact.json
    - assets/data/parcours_fiches_fonctionnaire.json
    - assets/data/parcours_fiches_retraite.json
    - assets/data/parcours_fiches_etudiant.json
    - assets/data/parcours_fiches_salarie.json
    - assets/data/parcours_fiches_independant.json
    - assets/data/parcours_fiches_demandeur_emploi.json
    - assets/data/parcours_fiches_sans_activite.json
    - assets/carousel_home/
    - docs/menu_activite_statuts/pack_fiches_fonctionnaire_firebase/markdown/

dependency_overrides:
  flutter_app_badger:
    path: third_party/flutter_app_badger
