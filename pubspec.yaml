name: presto_app
description: Prest'o app
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^5.5.0
  sign_in_with_apple: ^6.1.2
  http: ^1.2.2 
  

  cupertino_icons: ^1.0.8

  # 🔥 Firebase / Firestore / URL launcher
  firebase_core: ^3.8.1
  firebase_crashlytics: ^4.3.0
  cloud_firestore: ^5.8.0
  cloud_functions: ^5.3.0
  firebase_storage: ^12.7.0
  firebase_auth: ^5.5.0
  firebase_app_check: ^0.3.2+1  # ✅ Garder 0.3.x (compatible)
  firebase_analytics: ^11.6.0
  firebase_remote_config: ^5.1.5  # ✅ Compatible avec app_check 0.3.x
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  firebase_storage: ^12.7.0
  firebase_messaging: ^16.1.0
  record: ^6.1.2
  path_provider: ^2.1.0
  google_mobile_ads: ^7.0.0
  font_awesome_flutter: ^10.7.0
  flutter_svg: ^2.0.9
  web: ^1.0.0
  cross_file: ^0.3.4+2
  connectivity_plus: ^5.0.0  # ✅ Pour détecter offline/online
  firebase_analytics: ^11.6.0
  firebase_remote_config: ^6.1.3  # ✅ Mise à jour vers 6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/cities/
    - assets/data/cities_compact.json
    - assets/carousel_home/
    - assets/dlimages/
    - assets/icons/