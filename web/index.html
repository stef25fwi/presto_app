<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="presto_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Sign-In Web Client ID -->
  <meta name="google-signin-client_id" content="151421230024-lung00ghpcc0qgbukvo29og1kuapnggf.apps.googleusercontent.com">

  <title>presto_app</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(90deg, #2250F4 0 50%, #FF8A1D 50% 100%);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #native-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: linear-gradient(90deg, #2250F4 0 50%, #FF8A1D 50% 100%);
      color: #fff;
      transition: opacity 220ms ease;
    }

    #native-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .native-splash-title {
      margin-top: 10vh;
      font-size: clamp(42px, 8vw, 54px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.06em;
      text-shadow: 0 8px 14px rgba(0, 0, 0, 0.16), 0 2px 2px rgba(0, 0, 0, 0.08);
    }

    .native-splash-mark {
      margin-top: 11vh;
      width: min(52vw, 300px);
      aspect-ratio: 1;
      border-radius: 28px;
      border: 3px solid rgba(255, 255, 255, 0.95);
      overflow: hidden;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      box-shadow: 0 24px 30px rgba(0, 0, 0, 0.12);
    }

    .native-splash-half {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(88px, 18vw, 118px);
      font-weight: 900;
      line-height: 1;
      color: #fff;
      text-shadow: 0 6px 10px rgba(0, 0, 0, 0.14);
    }

    .native-splash-half.is-blue {
      background: #2250F4;
    }

    .native-splash-half.is-orange {
      background: #FF8A1D;
    }

    .native-splash-divider {
      position: absolute;
      top: 10px;
      bottom: 10px;
      left: 50%;
      width: 6px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.98);
    }
  </style>
</head>
<body>
  <div id="native-splash" aria-hidden="true">
    <div class="native-splash-title">iliprestō</div>
    <div class="native-splash-mark">
      <div class="native-splash-half is-blue">i</div>
      <div class="native-splash-half is-orange">i</div>
      <div class="native-splash-divider"></div>
    </div>
  </div>
  <script>
    (function () {
      let recaptchaLoader = null;

      function ensureRecaptchaEnterprise(siteKey) {
        if (!siteKey) {
          return Promise.resolve();
        }
        if (window.grecaptcha && window.grecaptcha.enterprise) {
          return Promise.resolve();
        }
        if (recaptchaLoader) {
          return recaptchaLoader;
        }

        recaptchaLoader = new Promise(function (resolve, reject) {
          const script = document.createElement('script');
          script.src = 'https://www.google.com/recaptcha/enterprise.js?render=' + encodeURIComponent(siteKey);
          script.async = true;
          script.defer = true;
          script.onload = function () {
            resolve();
          };
          script.onerror = function () {
            reject(new Error('Impossible de charger reCAPTCHA Enterprise.'));
          };
          document.head.appendChild(script);
        });

        return recaptchaLoader;
      }

      window.prestoMarketplaceRecaptcha = {
        execute: function (siteKey, action) {
          if (!siteKey || !action) {
            return Promise.resolve('');
          }

          return ensureRecaptchaEnterprise(siteKey).then(function () {
            return new Promise(function (resolve, reject) {
              if (!window.grecaptcha || !window.grecaptcha.enterprise) {
                reject(new Error('grecaptcha.enterprise indisponible.'));
                return;
              }

              window.grecaptcha.enterprise.ready(function () {
                window.grecaptcha.enterprise.execute(siteKey, { action: action })
                  .then(resolve)
                  .catch(reject);
              });
            });
          });
        }
      };
    })();

    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('native-splash');
      if (!splash) {
        return;
      }
      splash.classList.add('is-hidden');
      window.setTimeout(function () {
        splash.remove();
      }, 260);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
