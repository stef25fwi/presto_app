  <script>
    (function () {
      // Hôte canonique public = ilipresto.fr. Les hôtes techniques Firebase
      // restent autorisés uniquement comme miroirs de sécurité et sont rabattus
      // vers le domaine public pour conserver une origine de session unique,
      // notamment pour Firebase Auth / Google Sign-In Web.
      const canonicalHost = 'ilipresto.fr';
      const host = window.location.hostname.toLowerCase();
      const redirectHosts = new Set([
        'www.ilipresto.fr',
        'ilipresto.web.app',
        'ilipresto.firebaseapp.com',
        'presto-app-74abe.firebaseapp.com',
        'presto-app-74abe.web.app',
      ]);

      if (!redirectHosts.has(host)) {
        return;
      }

      const canonicalUrl = new URL(window.location.href);
      canonicalUrl.protocol = 'https:';
      canonicalUrl.host = canonicalHost;

      if (canonicalUrl.toString() !== window.location.href) {
        window.location.replace(canonicalUrl.toString());
      }
    })();
  </script>
  <style>
    html, body {
      margin: 0;

</head>
<body>
  <script>
    (function () {
      let recaptchaLoader = null;
      let recaptchaLoaderSiteKey = null;

      function hasRecaptchaEnterpriseApi() {
        return !!(
          window.grecaptcha &&
          window.grecaptcha.enterprise &&
          typeof window.grecaptcha.enterprise.ready === 'function' &&
          typeof window.grecaptcha.enterprise.execute === 'function'
        );
      }

      function waitForRecaptchaEnterpriseApi(timeoutMs) {
        return new Promise(function (resolve, reject) {
          const startedAt = Date.now();

          function check() {
            if (hasRecaptchaEnterpriseApi()) {
              resolve();
              return;
            }

            if (Date.now() - startedAt >= timeoutMs) {
              reject(new Error('API reCAPTCHA Enterprise indisponible apres chargement du script.'));
              return;
            }

            window.setTimeout(check, 50);
          }

          check();
        });
      }

      function loadRecaptchaEnterpriseScript(baseUrl, siteKey) {
        return new Promise(function (resolve, reject) {
          if (hasRecaptchaEnterpriseApi()) {
            resolve();
            return;
          }

          const script = document.createElement('script');
          let settled = false;

          const timeout = window.setTimeout(function () {
            if (settled) return;
            settled = true;
            try { script.remove(); } catch (_) {}
            reject(new Error('Timeout chargement reCAPTCHA Enterprise depuis ' + baseUrl));
          }, 8000);

          script.src = baseUrl + encodeURIComponent(siteKey);
          script.async = true;
          script.defer = true;

          script.onload = function () {
            if (settled) return;
            console.debug('[Marketplace reCAPTCHA] script loaded', baseUrl);
            waitForRecaptchaEnterpriseApi(3000).then(function () {
              if (settled) return;
              settled = true;
              window.clearTimeout(timeout);
              resolve();
            }).catch(function (error) {
              if (settled) return;
              settled = true;
              window.clearTimeout(timeout);
              try { script.remove(); } catch (_) {}
              reject(error);
            });
          };

          script.onerror = function () {
            if (settled) return;
            settled = true;
            window.clearTimeout(timeout);
            try { script.remove(); } catch (_) {}
            reject(new Error('Impossible de charger reCAPTCHA Enterprise depuis ' + baseUrl));
          };

          document.head.appendChild(script);
        });
      }

      function ensureRecaptchaEnterprise(siteKey) {
        if (hasRecaptchaEnterpriseApi()) {
          return Promise.resolve();
        }

        if (recaptchaLoader && recaptchaLoaderSiteKey === siteKey) {
          return recaptchaLoader;
        }

        recaptchaLoaderSiteKey = siteKey;
        recaptchaLoader = loadRecaptchaEnterpriseScript(
          'https://www.google.com/recaptcha/enterprise.js?render=',
          siteKey
        ).catch(function (googleError) {
          console.warn('[Marketplace reCAPTCHA] google.com failed, retry recaptcha.net', googleError);
          return loadRecaptchaEnterpriseScript(
            'https://www.recaptcha.net/recaptcha/enterprise.js?render=',
            siteKey
          );
        }).catch(function (error) {
          recaptchaLoader = null;
          recaptchaLoaderSiteKey = null;
          throw error;
        });

        return recaptchaLoader;
      }

      function withTimeout(promise, ms, label) {
        return new Promise(function (resolve, reject) {
          const timer = window.setTimeout(function () {
            reject(new Error(label + ' timeout'));
          }, ms);

          promise.then(function (value) {
            window.clearTimeout(timer);
            resolve(value);
          }).catch(function (error) {
            window.clearTimeout(timer);
            reject(error);
          });
        });
      }

      window.prestoMarketplaceRecaptcha = {
        execute: function (siteKey, action) {
          siteKey = String(siteKey || '').trim();
          action = String(action || 'listing_submit').trim();

          if (!siteKey) {
            console.warn('[Marketplace reCAPTCHA] missing site key');
            return Promise.resolve('');
          }

          console.debug('[Marketplace reCAPTCHA] execute start', {
            action: action,
            hasSiteKey: true
          });

          return ensureRecaptchaEnterprise(siteKey).then(function () {
            return withTimeout(new Promise(function (resolve, reject) {
              try {
                if (!hasRecaptchaEnterpriseApi()) {
                  reject(new Error('grecaptcha.enterprise indisponible.'));
                  return;
                }

                window.grecaptcha.enterprise.ready(function () {
                  try {
                    window.grecaptcha.enterprise.execute(siteKey, { action: action })
                      .then(resolve)
                      .catch(reject);
                  } catch (executeError) {
                    reject(executeError);
                  }
                });
              } catch (readyError) {
                reject(readyError);
              }
            }), 12000, 'execute reCAPTCHA Enterprise');
          }).then(function (token) {
            token = String(token || '').trim();
            console.debug('[Marketplace reCAPTCHA] execute result', {
              action: action,
              tokenPresent: token.length > 0
            });
            return token;
          }).catch(function (error) {
            console.error('[Marketplace reCAPTCHA] execute failed', error);
            return '';
          });
        }
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
